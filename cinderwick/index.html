<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0706" />
  <meta name="description" content="Cinderwick — lay burning fuse cords between your bombs and chain-detonate the foundry. A fuse-chaining bomber for the Bot Built Arcade." />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Cinderwick - Bot Built Arcade</title>
  <link rel="icon" type="image/png" href="../images/botbuiltarcade-icon-face.png" />
  <link rel="stylesheet" href="assets/css/game.css" />
</head>
<body>
  <canvas id="cw-canvas" aria-label="Cinderwick game view" role="img"></canvas>
  <div id="cw-hud" hidden>
    <div class="hud-cell"><span class="hud-k">SCORE</span><span id="hud-score" class="hud-v">0</span></div>
    <div class="hud-cell"><span class="hud-k">FLOOR</span><span id="hud-level" class="hud-v">1</span></div>
    <div class="hud-cell"><span class="hud-k">TIME</span><span id="hud-time" class="hud-v">3:00</span></div>
    <div class="hud-cell"><span class="hud-k">LIVES</span><span id="hud-lives" class="hud-v">3</span></div>
    <div class="hud-cell"><span class="hud-k">BOMBS</span><span id="hud-bombs" class="hud-v">0/3</span></div>
    <button id="hud-mute" type="button" aria-label="Toggle sound">🔊</button>
    <a id="hud-back" href="../index.html">Arcade</a>
  </div>
  <div id="cw-chain" aria-live="polite"></div>
  <div id="cw-touch" hidden>
    <div id="cw-pad" aria-label="Move"><div id="cw-stick"></div></div>
    <button id="cw-btn-strike" type="button" aria-label="Light the fuse">LIGHT</button>
    <button id="cw-btn-bomb" type="button" aria-label="Place bomb">BOMB</button>
  </div>
  <div id="cw-overlay"></div>
  <noscript><p style="color:#fff3e0;padding:24px">Cinderwick needs JavaScript. <a href="../index.html">Back to Arcade</a></p></noscript>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/sim.js"></script>
  <script src="assets/js/audio.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/game.js"></script>
</body>
</html>
