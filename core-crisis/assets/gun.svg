<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5F9EA0"/>
      <stop offset="1" stop-color="#2f6f75"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#FFA500"/>
    </linearGradient>
  </defs>
  <!-- Simple retro blaster styled to match UI colors -->
  <g transform="translate(6,20)">
    <!-- Body -->
    <rect x="6" y="6" width="30" height="14" rx="6" ry="6" fill="url(#g1)" stroke="#FFD700" stroke-width="2"/>
    <!-- Barrel -->
    <rect x="34" y="10" width="18" height="6" rx="3" ry="3" fill="url(#g2)" stroke="#FFD700" stroke-width="2"/>
    <!-- Muzzle cap -->
    <circle cx="54" cy="13" r="4" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <!-- Grip -->
    <path d="M16,20 L24,20 L20,34 L12,34 Z" fill="#385a5e" stroke="#FFD700" stroke-width="2"/>
    <!-- Sight -->
    <rect x="14" y="2" width="10" height="4" rx="2" ry="2" fill="#B0E0E6" stroke="#FFD700" stroke-width="2"/>
  </g>
</svg>

