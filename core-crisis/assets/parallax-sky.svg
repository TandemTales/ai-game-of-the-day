  <!-- Aurora bands -->
  <path d="M0,220 C180,180 240,260 420,220 C600,180 700,260 960,200 L960,540 L0,540 Z" fill="#143050" opacity="0.35"/>
  <path d="M0,260 C200,240 320,300 480,260 C640,220 740,300 960,240 L960,540 L0,540 Z" fill="#1a3c61" opacity="0.35"/>
