<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5e7eb"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd700"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
  </defs>
  <!-- Shadow base hint -->
  <ellipse cx="32" cy="50" rx="14" ry="6" fill="#000" opacity="0.22"/>
  <!-- Body armor -->
  <path d="M20 20 h24 l4 10 v10 l-4 8 H20 l-4-8 V30z" fill="url(#metal)" stroke="#111827" stroke-opacity="0.5"/>
  <!-- Shoulders -->
  <circle cx="20" cy="28" r="6" fill="url(#metal)" stroke="#111827" stroke-opacity="0.4"/>
  <circle cx="44" cy="28" r="6" fill="url(#metal)" stroke="#111827" stroke-opacity="0.4"/>
  <!-- Tunic -->
  <path d="M22 33 h20 l2 7 -4 8 H24 l-4-8z" fill="url(#cloth)" opacity="0.95"/>
  <!-- Belt -->
  <rect x="22" y="40" width="20" height="4" fill="#1f2937"/>
  <circle cx="32" cy="42" r="3" fill="url(#gold)" stroke="#a16207"/>
  <!-- Head + visor -->
  <circle cx="32" cy="16" r="10" fill="url(#metal)" stroke="#111827" stroke-opacity="0.6"/>
  <rect x="24" y="14" width="16" height="6" rx="3" fill="#0ea5e9" opacity="0.9" stroke="#0369a1"/>
  <!-- Arm left holding mini buckler -->
  <rect x="12" y="30" width="6" height="12" rx="3" fill="url(#metal)"/>
  <circle cx="12" cy="36" r="6" fill="#0ea5e9" stroke="#0284c7"/>
  <!-- Sword (angled) -->
  <g transform="translate(46,34) rotate(25)">
    <rect x="-1" y="-16" width="2" height="20" fill="#1f2937"/>
    <rect x="-1.5" y="4" width="3" height="10" fill="url(#gold)"/>
    <path d="M0 -34 l4 16 h-8z" fill="#e2e8f0" stroke="#64748b"/>
  </g>
</svg>

