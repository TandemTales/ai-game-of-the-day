  <script>
   const $ = sel => document.querySelector(sel);
    let currentGameId = '';
    let highlightRank = 0;
    const GAME_CATALOG = {
      'ironwake': { display: 'Ironwake', url: 'ironwake/index.html' },
      'stormhook': { display: 'Stormhook', url: 'stormhook/index.html' },
      'zephyr-circuit': { display: 'Zephyr Circuit', url: 'zephyr-circuit/index.html' },
      'paradox-vault': { display: 'Paradox Vault', url: 'paradox-vault/index.html' },
      'shiftwick': { display: 'Shiftwick', url: 'shiftwick/index.html' },
      'prism-warden': { display: 'Prism Warden', url: 'prism-warden/index.html' },
      'neon-brick-breaker': { display: 'Neon Brick Breaker', url: 'neon-brick-breaker/index.html' },
      'aurora-tower-defense': { display: 'Aurora Tower Defense', url: 'aurora-tower-defense/index.html' },
      'bastion-builder': { display: 'Bastion Builder', url: 'bastion-builder/index.html' },
      'nova-striker': { display: 'Nova Striker', url: 'nova-striker/index.html' },
      'core-crisis': { display: 'Core Crisis', url: 'core-crisis/index.html' },
      'emberfall-gauntlet': { display: 'Emberfall Gauntlet', url: 'emberfall-gauntlet/index.html' },
      'crimson-descent': { display: 'Crimson Descent', url: 'crimson-descent/index.html' }
    };
    function getGameMeta(id) { return GAME_CATALOG[id] || null; }
    function getParam(...keys) {
      const usp = new URLSearchParams(location.search);
      for (const k of keys) {
        const v = usp.get(k);
        if (v) return v;
      }
      return '';
    }

    function setMessage(html, kind = 'info') {
      const msg = $('#msg');
      msg.className = kind === 'error' ? 'error' : kind === 'success' ? 'success' : '';
      msg.innerHTML = html;
    }

    function fmtWhen(ts) {
      try {
        const d = new Date(Number(ts));
        if (Number.isNaN(d.getTime())) return '';
        return d.toLocaleString();
      } catch { return ''; }
    }

    async function loadBoard() {
      setMessage('');
      const gameId = currentGameId.trim();
      if (!gameId) { setMessage('Missing game id.', 'error'); return; }
      const tbody = $('#tbody');
      tbody.innerHTML = '<tr><td colspan="4">Loading…</td></tr>';
      try {
        const res = await fetch(`/api/leaderboard/${encodeURIComponent(gameId)}?limit=20`, { headers: { 'Accept': 'application/json' } });
        if (!res.ok) throw new Error('Failed to load leaderboard');
        const data = await res.json();
        const entries = Array.isArray(data.entries) ? data.entries : [];
        if (!entries.length) {
          tbody.innerHTML = '<tr><td colspan="4">No scores yet. Be the first!</td></tr>';
          return;
        }
        tbody.innerHTML = entries.map(e => `
          <tr class="${Number(e.rank)===Number(highlightRank)?'recent':''}">
            <td>#${e.rank}</td>
            <td>${escapeHtml(e.name)}</td>
            <td>${e.score}</td>
            <td>${fmtWhen(e.timestamp)}</td>
          </tr>
        `).join('');
        // Scroll recent item into view
        if (highlightRank) {
          const r = tbody.querySelector('tr.recent');
          if (r) setTimeout(()=> r.scrollIntoView({ block: 'center', behavior: 'smooth' }), 60);
        }
      } catch (err) {
        console.error(err);
        tbody.innerHTML = '<tr><td colspan="4">Error loading leaderboard.</td></tr>';
        setMessage('Error loading leaderboard.', 'error');
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }



    document.addEventListener('DOMContentLoaded', () => {
      // loadBtn exists but controls are hidden; still allow manual refresh if needed
      const lb = document.getElementById('loadBtn');
      if (lb) lb.addEventListener('click', loadBoard);

      const initial = getParam('gameId', 'game');
      const hr = Number(getParam('highlightRank'));
      currentGameId = initial || '';
      highlightRank = Number.isFinite(hr) ? hr : 0;
      // Set display name in header
      const meta = getGameMeta(currentGameId);
      const titleEl = document.getElementById('gameTitle');
      if (titleEl) titleEl.textContent = meta?.display || '';
      if (currentGameId) loadBoard();
      // Initialize Play Again button for initial gameId
      const pb = document.getElementById('playBtn');
      if (pb) {
        const url = gameUrlForId(currentGameId);
        pb.style.display = url ? 'inline-block' : 'none';
        if (url) pb.href = url;
      }
    });

    function gameUrlForId(id) {
      const meta = getGameMeta(id);
      return meta ? meta.url : '';
    }
  </script>
