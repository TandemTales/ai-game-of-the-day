<html lang="en">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Brick Breaker - Bot Built Arcade</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../images/botbuiltarcade-icon-face.png">
  <style>
    :root {
      --gold: #FFD700;
      --teal: #00FFFF;
      --dark-bg: #0a0a12;
      --accent: #ff3edf;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: radial-gradient(circle at 50% 20%, rgba(0,255,255,0.08), transparent 50%),
                  radial-gradient(circle at 20% 80%, rgba(255,62,223,0.08), transparent 50%),
                  linear-gradient(135deg, #0a0a12 0%, #111122 100%);
      color: #F5F5DC;
      font-family: 'Press Start 2P', cursive;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 0 8px;
    }

    .loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, rgba(0, 255, 255, 0.08), transparent 65%),
                  rgba(4, 6, 14, 0.92);
      color: #f6faff;
      font-family: 'Press Start 2P', cursive;
      z-index: 999;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    .loading-screen.loading-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 32px clamp(18px, 5vw, 42px);
      border-radius: 18px;
      border: 3px solid rgba(0, 255, 255, 0.3);
      background: rgba(10, 14, 28, 0.75);
      box-shadow: 0 0 32px rgba(0, 255, 255, 0.25), 0 0 12px rgba(255, 215, 0, 0.2);
      text-align: center;
    }

    .loading-orb {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 4px solid rgba(0, 255, 255, 0.25);
      border-top-color: var(--accent);
      border-right-color: rgba(255, 215, 0, 0.8);
      animation: loading-spin 1.15s linear infinite;
      position: relative;
      box-shadow: 0 0 22px rgba(0, 255, 255, 0.35);
    }

    .loading-orb::after {
      content: '';
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255, 215, 0, 0.4);
      box-shadow: 0 0 16px rgba(255, 215, 0, 0.35);
    }

    @keyframes loading-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-orb {
        animation: none;
      }
    }

    .loading-title {
      font-size: clamp(14px, 3vw, 16px);
      color: var(--gold);
      letter-spacing: 1.2px;
      margin: 0;
    }

    .loading-sub {
      margin: 0;
      font-size: clamp(10px, 2.2vw, 12px);
      color: #a8f4ff;
      letter-spacing: 1px;
    }

    .loading-progress {
      font-size: clamp(12px, 2.6vw, 14px);
      color: #ffffff;
      letter-spacing: 1.4px;
      margin: 0;
    }
    #wrap {
      width: 100%;
      max-width: min(100%, 1180px);
      padding: clamp(14px, 4vw, 24px);
      margin: 0 auto;
      transition: padding 0.2s ease;
    }
    .panel {
      background: rgba(0,0,0,0.7);
      border: 4px solid var(--gold);
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(255,215,0,0.25);
      padding: 18px;
      transition: padding 0.2s ease, border-width 0.2s ease;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .title h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 1px;
      background: linear-gradient(90deg, var(--gold), #ffa500);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .btn {
      display: inline-block;
      text-decoration: none;
      color: white;
      border: 2px solid var(--gold);
      background: linear-gradient(45deg, #5F9EA0, #4682B4);
      padding: 10px 14px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(95,158,160,0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
      font-family: 'Press Start 2P', cursive;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(95,158,160,0.6); }
    .btn:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-left: auto;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 6px 0 6px 0;
      font-size: 12px;
      color: #A7E7FF;
      flex-wrap: wrap;
      gap: 8px 16px;
    }
    .hud > div { flex: 1 1 120px; text-align: center; }

    .notification-bar {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 4px 0 10px;
      height: calc(2 * 30px);
      max-height: calc(2 * 30px);
      overflow: hidden;
      align-items: stretch;
      pointer-events: none;
    }

    .notification-column {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      gap: 6px;
      min-width: 0;
    }

    .notification-card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 12px;
      border: 2px solid rgba(0, 255, 255, 0.45);
      background: rgba(12, 16, 28, 0.78);
      color: #f2faff;
      font-size: clamp(7px, 1.25vw, 12px);
      letter-spacing: 0.6px;
      text-shadow: 0 0 12px rgba(0, 255, 255, 0.55);
      opacity: 0;
      transform: translateY(-8px) scale(0.94);
      transition: opacity 0.24s ease, transform 0.24s ease;
      min-width: 0;
    }

    .notification-card.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .notification-card.hide {
      opacity: 0;
      transform: translateY(10px) scale(0.92);
    }

    .notification-tag {
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(0, 255, 255, 0.55);
      background: rgba(0, 255, 255, 0.14);
      color: var(--teal);
      font-size: 0.68em;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .notification-main {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .notification-meta {
      color: var(--gold);
      font-size: 0.9em;
      justify-self: end;
      white-space: nowrap;
    }

    .notification-card.type-upgrade {
      border-color: rgba(255, 215, 0, 0.65);
      box-shadow: 0 0 18px rgba(255, 215, 0, 0.25);
    }

    .notification-card.type-upgrade .notification-tag {
      border-color: rgba(255, 215, 0, 0.65);
      background: rgba(255, 215, 0, 0.16);
      color: var(--gold);
    }

    .notification-card.type-trick {
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
    }

    .notification-card.type-alert {
      border-color: rgba(255, 62, 223, 0.6);
      box-shadow: 0 0 18px rgba(255, 62, 223, 0.22);
    }

    .notification-card.type-alert .notification-tag {
      border-color: rgba(255, 62, 223, 0.6);
      background: rgba(255, 62, 223, 0.18);
      color: var(--accent);
    }

    .notification-card.type-mode {
      border-color: rgba(255, 255, 255, 0.45);
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.18);
    }

    .notification-card.type-mode .notification-tag {
      border-color: rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
    }

    .notification-card.type-portal .notification-tag {
      border-color: rgba(0, 255, 255, 0.65);
      background: rgba(0, 255, 255, 0.22);
    }

    .stage {
      position: relative;
      background: radial-gradient(circle at 50% 20%, rgba(0,255,255,0.05), rgba(0,0,0,0.2)),
                  repeating-linear-gradient( to bottom, rgba(0,255,255,0.06) 0px, rgba(0,255,255,0.06) 2px, transparent 2px, transparent 26px ),
                  radial-gradient(circle at 50% 50%, rgba(255,255,255,0.02), transparent 60%),
                  linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
                  #07070d;
      border-radius: 14px;
      border: 2px solid rgba(0,255,255,0.25);
      box-shadow: inset 0 0 30px rgba(0,255,255,0.25);
      padding: 12px;
      max-width: 100%;
      margin: 0 auto;
      transition: padding 0.2s ease, border-width 0.2s ease;
    }

    canvas { width: 100%; height: auto; display: block; background: transparent; touch-action: none; }

    .overlay {
      position: absolute;
      inset: 12px;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 10px;
      background: rgba(0,0,0,0.6);
      border: 2px dashed rgba(255,215,0,0.4);
      touch-action: none;
    }
    .overlay.show { display: flex; }
    .overlay h2 { margin: 0 0 12px 0; font-size: 18px; color: var(--gold); }
    .overlay p { margin: 4px 0; font-size: 12px; color: #9fd; }

    .controls { margin-top: 10px; font-size: 11px; color: #8ec; opacity: 0.9; }

    .mobile-slider-wrapper {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 18px;
    }

    .mobile-slider-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.6px;
      color: rgba(0, 255, 255, 0.85);
      text-align: center;
    }

    .mobile-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 26px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(0, 255, 255, 0.35), rgba(255, 62, 223, 0.35));
      border: 2px solid rgba(0, 255, 255, 0.45);
      box-shadow: 0 0 16px rgba(0, 255, 255, 0.18);
      outline: none;
      padding: 0 12px;
      position: relative;
    }

    .mobile-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff, #ffe066 45%, #ff3edf 100%);
      border: 2px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 0 20px rgba(255, 62, 223, 0.6);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .mobile-slider::-moz-range-thumb {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff, #ffe066 45%, #ff3edf 100%);
      border: 2px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 0 20px rgba(255, 62, 223, 0.6);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .mobile-slider:active::-webkit-slider-thumb,
    .mobile-slider:active::-moz-range-thumb {
      transform: scale(1.08);
      box-shadow: 0 0 26px rgba(255, 62, 223, 0.75);
    }

    .mobile-slider::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background: rgba(0, 255, 255, 0.18);
    }

    .mobile-slider::-moz-range-track {
      height: 6px;
      border-radius: 999px;
      background: rgba(0, 255, 255, 0.18);
    }

    @media (max-width: 880px), (pointer: coarse) {
      .mobile-slider-wrapper {
        display: flex;
      }
    }

    @media (max-width: 640px) {
      body {
        align-items: stretch;
        justify-content: flex-start;
        padding: 6px;
      }

      #wrap {
        max-width: none;
        padding: 8px;
      }

      .panel {
        padding: 14px;
        border-width: 3px;
      }

      header {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      .actions {
        width: 100%;
        justify-content: center;
      }

      .actions .btn {
        width: 100%;
        text-align: center;
        font-size: 11px;
        padding: 10px;
      }

      .hud {
        font-size: 11px;
        gap: 6px 10px;
      }

      .notification-bar {
        gap: 6px;
        margin: 4px 0 6px;
      }

      .notification-card {
        font-size: clamp(7px, 3.1vw, 11px);
        padding: 5px 8px;
      }

      .hud > div {
        flex: 1 1 80px;
      }

      .stage {
        padding: 6px;
        border-width: 1.5px;
      }
    }

    @media (max-width: 560px) {
      .title h1 { font-size: 18px; }
      .btn {
        font-size: 10px;
        padding: 8px 10px;
      }
    }

    @media (max-height: 640px) {
      body { align-items: flex-start; padding-top: 16px; }
    }
  </style>
</head>

      <header>
        <div class="title">
          <img src="../images/botbuiltarcade-icon-face.png" alt="BotBuilt" width="36" height="36" style="border-radius:50%; border:2px solid var(--gold)">

  <script src="../src/neonBrickBreaker/paddleBuff.js"></script>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Assets
    const imgPaddle = new Image(); imgPaddle.src = 'assets/neon_paddle.svg';
    const imgBall = new Image();   imgBall.src   = 'assets/neon_ball.svg';
    const imgBrick1 = new Image(); imgBrick1.src = 'assets/neon_brick_blue.svg';
    const imgBrick2 = new Image(); imgBrick2.src = 'assets/neon_brick_pink.svg';
    const imgBrickCrack = new Image(); imgBrickCrack.src = 'assets/neon_brick_shield_crack.svg';

    let assetsLoaded = 0;
    const needed = 5;
    const loadingScreenEl = document.getElementById('loading-screen');
    const loadingProgressEl = document.getElementById('loading-progress');
    const loadingStatusEl = document.getElementById('loading-status');
    let loadingScreenDismissed = false;

    function updateLoadingProgress(current, total) {
      if (!loadingProgressEl) return;
      const pct = Math.min(100, Math.round((current / total) * 100));
      loadingProgressEl.textContent = String(pct);
    }

    function markLoadingStatus(text) {
      if (loadingStatusEl && text) {
        loadingStatusEl.textContent = text;
      }
    }

    function hideLoadingScreen() {
      if (!loadingScreenEl || loadingScreenDismissed) return;
      loadingScreenDismissed = true;
      loadingScreenEl.classList.add('loading-hidden');
      setTimeout(() => {
        if (loadingScreenEl && loadingScreenEl.parentElement) {
          loadingScreenEl.parentElement.removeChild(loadingScreenEl);
        }
      }, 600);
    }

    function checkAssetsReady() {
      updateLoadingProgress(assetsLoaded, needed);
      if (assetsLoaded >= needed) {
        markLoadingStatus('Link established');
        hideLoadingScreen();
        init();
      }
    }

    updateLoadingProgress(0, needed);
    markLoadingStatus('Preparing assets');

    [imgPaddle, imgBall, imgBrick1, imgBrick2, imgBrickCrack].forEach(img => {
      const handleAssetComplete = () => {
        assetsLoaded++;
        checkAssetsReady();
      };
      img.addEventListener('load', handleAssetComplete, { once: true });
      img.addEventListener('error', () => {
        markLoadingStatus('Calibrating backup visuals');
        handleAssetComplete();
      }, { once: true });
    });

    // HUD
    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const livesEl = document.getElementById('lives');
    const overlayEl = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const ovSub = document.getElementById('ov-sub');
    const wrapEl = document.getElementById('wrap');
    const panelEl = document.querySelector('.panel');
    const stageEl = document.querySelector('.stage');
    const headerEl = document.querySelector('header');
    const hudEl = document.querySelector('.hud');
    const notificationBar = document.getElementById('notification-bar');
    const notificationColumns = notificationBar ? Array.from(notificationBar.querySelectorAll('.notification-column')) : [];
    const muteBtn = document.getElementById('mute-btn');
    const notificationQueue = [];

    const NOTIFICATION_DISPLAY_MS = 2800;
    const NOTIFICATION_FADE_MS = 260;

    function enqueueNotification(options = {}) {
      if (!notificationColumns.length) return;
      const entry = {
        tag: options.tag || null,
        title: options.title || '',
        meta: options.meta || '',
        type: options.type || '',
        duration: Math.max(1200, options.duration || NOTIFICATION_DISPLAY_MS),
      };
      notificationQueue.push(entry);
      processNotificationQueue();
    }

    function processNotificationQueue() {
      if (!notificationColumns.length || !notificationQueue.length) return;
      for (const column of notificationColumns) {
        if (!column || column.childElementCount > 0) continue;
        const next = notificationQueue.shift();
        if (!next) break;
        spawnNotification(column, next);
      }
    }

    function spawnNotification(column, data) {
      const card = document.createElement('div');
      card.className = 'notification-card';
      if (data.type) {
        card.classList.add(`type-${data.type}`);
      }
      card.setAttribute('role', 'status');
      const ariaParts = [];
      if (data.tag) ariaParts.push(data.tag);
      if (data.title) ariaParts.push(data.title);
      if (data.meta) ariaParts.push(data.meta);
      if (ariaParts.length) {
        card.setAttribute('aria-label', ariaParts.join(' • '));
      }

      if (data.tag) {
        const tagSpan = document.createElement('span');
        tagSpan.className = 'notification-tag';
        tagSpan.textContent = data.tag;
        card.appendChild(tagSpan);
      }

      const mainSpan = document.createElement('span');
      mainSpan.className = 'notification-main';
      mainSpan.textContent = data.title || '';
      card.appendChild(mainSpan);

      if (data.meta) {
        const metaSpan = document.createElement('span');
        metaSpan.className = 'notification-meta';
        metaSpan.textContent = data.meta;
        card.appendChild(metaSpan);
      }

      column.appendChild(card);
      requestAnimationFrame(() => card.classList.add('show'));

      const displayMs = Math.max(600, data.duration || NOTIFICATION_DISPLAY_MS);
      const fadeDelay = Math.max(0, displayMs - NOTIFICATION_FADE_MS);
      setTimeout(() => {
        card.classList.remove('show');
        card.classList.add('hide');
      }, fadeDelay);
      setTimeout(() => {
        if (card.parentNode === column) {
          column.removeChild(card);
        }
        processNotificationQueue();
      }, displayMs);
    }

    const SOUNDTRACK_FILES = [
      'assets/NBB_soundtrack01.mp3',
      'assets/NBB_soundtrack02.mp3',
      'assets/NBB_soundtrack03.mp3',
      'assets/NBB_soundtrack04.mp3'
    ].filter(src => src && src.toLowerCase().includes('soundtrack'));

    let isMuted = false;

    const EVENT_SFX_FILES = Array.from({ length: 40 }, (_, i) => {
      const suffix = String(i + 1).padStart(2, '0');
      return `assets/NBB_sfx_combo${suffix}.wav`;
    }).filter(src => src && src.toLowerCase().includes('sfx'));

    const EVENT_SFX_VOLUME = 0.55;
    const EventSfxAudioContext = window.AudioContext || window.webkitAudioContext || null;
    let eventSfxCtx = null;
    let eventSfxGainNode = null;
    let eventSfxBuffers = [];
    let eventSfxLoadPromise = null;
    const EVENT_SFX_FALLBACK_POOL = [];
    let eventSfxFallbackIndex = 0;

    updateSfxMuteState();

    function ensureEventSfxContext() {
      if (!EventSfxAudioContext) {
        return null;
      }
      if (!eventSfxCtx) {
        try {
          eventSfxCtx = new EventSfxAudioContext({ latencyHint: 'interactive' });
        } catch (err) {
          eventSfxCtx = null;
          return null;
        }
      }
      if (eventSfxCtx.state === 'suspended') {
        eventSfxCtx.resume().catch(() => {});
      }
      return eventSfxCtx;
    }

    function ensureEventSfxGain() {
      const ctx = ensureEventSfxContext();
      if (!ctx) return null;
      if (!eventSfxGainNode) {
        eventSfxGainNode = ctx.createGain();
        eventSfxGainNode.gain.value = isMuted ? 0 : EVENT_SFX_VOLUME;
        eventSfxGainNode.connect(ctx.destination);
      } else {
        eventSfxGainNode.gain.value = isMuted ? 0 : EVENT_SFX_VOLUME;
      }
      return eventSfxGainNode;
    }

    function decodeEventSfxBuffer(ctx, arrayBuffer) {
      return new Promise((resolve, reject) => {
        ctx.decodeAudioData(arrayBuffer.slice(0), resolve, reject);
      });
    }

    function loadEventSfxBuffers() {
      const ctx = ensureEventSfxContext();
      if (!ctx || !EVENT_SFX_FILES.length) {
        return Promise.resolve([]);
      }
      if (!eventSfxLoadPromise) {
        eventSfxLoadPromise = Promise.all(EVENT_SFX_FILES.map(async (src) => {
          try {
            const response = await fetch(src);
            if (!response.ok) {
              throw new Error(`Failed to fetch ${src}`);
            }
            const arrayBuffer = await response.arrayBuffer();
            const buffer = await decodeEventSfxBuffer(ctx, arrayBuffer);
            return buffer;
          } catch (error) {
            console.warn('Failed to prepare event SFX', src, error);
            return null;
          }
        })).then((buffers) => {
          eventSfxBuffers = buffers.filter(Boolean);
          return eventSfxBuffers;
        }).catch((error) => {
          console.warn('Failed to cache event SFX buffers', error);
          eventSfxLoadPromise = null;
          return [];
        });
      }
      return eventSfxLoadPromise;
    }

    function ensureEventSfxFallbackPool() {
      if (EVENT_SFX_FALLBACK_POOL.length || EventSfxAudioContext) {
        return;
      }
      const poolSize = Math.min(4, EVENT_SFX_FILES.length);
      for (let i = 0; i < poolSize; i++) {
        const audio = new Audio();
        audio.preload = 'auto';
        audio.volume = EVENT_SFX_VOLUME;
        audio.muted = isMuted;
        EVENT_SFX_FALLBACK_POOL.push(audio);
      }
    }

    function primeEventSfx() {
      if (!EVENT_SFX_FILES.length) return;
      ensureEventSfxGain();
      if (!EventSfxAudioContext) {
        ensureEventSfxFallbackPool();
        return;

      if (!eventSfxBuffers.length && !eventSfxLoadPromise) {

    function playRandomEventSfx() {
      if (isMuted || !EVENT_SFX_FILES.length) return false;

      if (EventSfxAudioContext) {
        ensureEventSfxGain();
        if (!eventSfxBuffers.length) {
          loadEventSfxBuffers();

        if (eventSfxBuffers.length) {
          const buffer = eventSfxBuffers[Math.floor(Math.random() * eventSfxBuffers.length)];
          if (buffer) {
            const ctx = ensureEventSfxContext();
            if (!ctx) return false;
            const gain = ensureEventSfxGain();
            const source = ctx.createBufferSource();
            source.buffer = buffer;
            if (gain) {
              source.connect(gain);
            } else {
              source.connect(ctx.destination);
            }
            source.start();
            return true;
          }
        }
      }

      ensureEventSfxFallbackPool();
      if (!EVENT_SFX_FALLBACK_POOL.length) return false;
      const player = EVENT_SFX_FALLBACK_POOL[eventSfxFallbackIndex % EVENT_SFX_FALLBACK_POOL.length];
      eventSfxFallbackIndex = (eventSfxFallbackIndex + 1) % EVENT_SFX_FALLBACK_POOL.length;
      const src = EVENT_SFX_FILES[Math.floor(Math.random() * EVENT_SFX_FILES.length)];
      if (!player || !src) return false;
      player.muted = isMuted;
      player.volume = EVENT_SFX_VOLUME;
      player.src = src;

      const gain = shieldAudioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(760, now);
      osc.frequency.exponentialRampToValueAtTime(1320, now + 0.12);
      gain.gain.setValueAtTime(0.26, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      osc.connect(gain).connect(shieldAudioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.32);
    }

    function getGhostWhooshBuffer() {
      if (!shieldAudioCtx) return null;
      if (ghostWhooshBuffer) return ghostWhooshBuffer;
      const duration = 0.45;
      const sampleRate = shieldAudioCtx.sampleRate;
      const frameCount = Math.max(1, Math.floor(sampleRate * duration));
      const buffer = shieldAudioCtx.createBuffer(1, frameCount, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < frameCount; i++) {
        const progress = i / frameCount;
        const fadeOut = Math.pow(1 - progress, 1.2);
        const fadeIn = Math.pow(progress, 0.4);
        data[i] = (Math.random() * 2 - 1) * fadeOut * (0.45 + 0.55 * fadeIn);
      }
      ghostWhooshBuffer = buffer;
      return ghostWhooshBuffer;
    }

      const source = shieldAudioCtx.createBufferSource();
      source.buffer = buffer;
      source.playbackRate.setValueAtTime(1.25, now);
      source.playbackRate.exponentialRampToValueAtTime(0.65, now + 0.45);
      const filter = shieldAudioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(520, now);
      filter.Q.setValueAtTime(1.4, now);
      const gain = shieldAudioCtx.createGain();
      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
      source.connect(filter).connect(gain).connect(shieldAudioCtx.destination);
      source.start(now);
      source.stop(now + 0.5);
    }

      const maxX = visualRightLimit - width;
      if (maxX < visualLeftLimit) {
        const centered = (visualLeftLimit + visualRightLimit - width) / 2;
        if (Number.isFinite(centered)) {
          return centered;
        }
        return visualLeftLimit;
      }
      return Math.max(visualLeftLimit, Math.min(maxX, value));

      if (resetCountdown) {
        wallPulseCountdown = wallPulseInterval;
      } else if (!wallPulseActive && wallPulseCountdown > wallPulseInterval) {
        wallPulseCountdown = wallPulseInterval;
      }
    }

    function resetWallPulseState() {
      wallPulseActive = false;
      wallPulseElapsed = 0;
      wallPulseStrength = 0;
      wallPulseCountdown = wallPulseInterval;
    }

    function updateWallPulse(dt) {
      if (wallPulseActive) {
        wallPulseElapsed += dt;
        const normalized = Math.min(1, Math.max(0, wallPulseElapsed / PULSE_DURATION_SEC));
        wallPulseStrength = Math.sin(normalized * Math.PI);
        if (wallPulseElapsed >= PULSE_DURATION_SEC) {
          wallPulseActive = false;
          wallPulseElapsed = 0;
          wallPulseStrength = 0;
          wallPulseCountdown = wallPulseInterval;
        }
      } else {
        wallPulseStrength = 0;
        wallPulseCountdown -= dt;
        if (wallPulseCountdown <= 0) {
          wallPulseActive = true;
          wallPulseElapsed = 0;
          wallPulseStrength = 0;
        }
      }
    }

    function getWallBulgeOffset(y) {
      if (wallPulseStrength <= 0) return 0;
      const h = canvas.height || 1;
      const normalizedY = Math.min(1, Math.max(0, y / h));
      const profile = Math.sin(normalizedY * Math.PI);
      return wallPulseStrength * BULGE_WIDTH_PX * profile;
    }

    function getLeftWallX(y) {
      return getWallBulgeOffset(y);
    }

    function getRightWallX(y) {
      return canvas.width - getWallBulgeOffset(y);
    }

    function drawWallPulses() {
      if (wallPulseStrength <= 0) return;
      const samples = 24;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(0, 255, 255, 0.12)';
      ctx.strokeStyle = 'rgba(0, 255, 255, 0.35)';
      ctx.lineWidth = 2;
      ctx.shadowColor = 'rgba(0, 255, 255, 0.35)';
      ctx.shadowBlur = 18;

      ctx.beginPath();
      ctx.moveTo(0, 0);
      for (let i = 0; i <= samples; i++) {
        const t = i / samples;
        const y = t * canvas.height;
        const x = getWallBulgeOffset(y);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(0, canvas.height);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(canvas.width, 0);
      for (let i = 0; i <= samples; i++) {
        const t = i / samples;
        const y = t * canvas.height;
        const x = canvas.width - getWallBulgeOffset(y);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(canvas.width, canvas.height);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    function togglePause() {
      paused = !paused;
      if (paused) {
        showOverlay('Paused', 'Press P to resume');
      } else {
        hideOverlay();
        lastTime = performance.now();
      }
    }

    function showOverlay(title, sub) {
      ovTitle.textContent = title;
      ovSub.textContent = sub;
      overlayEl.classList.add('show');
    }
    function hideOverlay(){ overlayEl.classList.remove('show'); }

    function createTrickState() {
      return {
        wallHitsSincePaddle: new Set(),
        lastWallHitTime: -Infinity,
        lastCeilingHitTime: -Infinity,
        lastThreaderPassTime: -Infinity,
        lastPaddleHitTime: gameTime,
        perfectSaveWindow: null,
        edgeKissCandidateTime: -Infinity,
      };
    }

    function ensureTrickState(ball) {
      if (!ball.trickState) {
        ball.trickState = createTrickState();
      }
      return ball.trickState;
    }

    function markBallAsRestingOnPaddle(ball) {
      const state = ensureTrickState(ball);
      state.lastPaddleHitTime = gameTime;
      state.lastWallHitTime = -Infinity;
      state.lastCeilingHitTime = -Infinity;
      state.lastThreaderPassTime = -Infinity;
      state.edgeKissCandidateTime = -Infinity;
      if (state.wallHitsSincePaddle && typeof state.wallHitsSincePaddle.clear === 'function') {
        state.wallHitsSincePaddle.clear();
      } else {
        state.wallHitsSincePaddle = new Set();
      }
      state.perfectSaveWindow = null;
    }

    function markBallLaunched(ball) {
      const state = ensureTrickState(ball);
      state.lastPaddleHitTime = gameTime;
      state.lastWallHitTime = -Infinity;
      state.lastCeilingHitTime = -Infinity;
      state.lastThreaderPassTime = -Infinity;
      state.edgeKissCandidateTime = -Infinity;
      if (state.wallHitsSincePaddle && typeof state.wallHitsSincePaddle.clear === 'function') {
        state.wallHitsSincePaddle.clear();
      } else {
        state.wallHitsSincePaddle = new Set();
      }
      state.perfectSaveWindow = null;
    }

    function notePaddleContact(ball, contactDelta, { allowPerfectSave = true } = {}) {
      const state = ensureTrickState(ball);
      state.lastPaddleHitTime = gameTime;
      state.lastWallHitTime = -Infinity;
      state.lastCeilingHitTime = -Infinity;
      state.lastThreaderPassTime = -Infinity;
      state.edgeKissCandidateTime = -Infinity;
      if (state.wallHitsSincePaddle && typeof state.wallHitsSincePaddle.clear === 'function') {
        state.wallHitsSincePaddle.clear();
      } else {
        state.wallHitsSincePaddle = new Set();
      }
      if (allowPerfectSave && Number.isFinite(contactDelta) && Math.abs(contactDelta) <= TRICK_SHOT_SETTINGS.perfectSaveTolerance) {
        state.perfectSaveWindow = gameTime + TRICK_SHOT_SETTINGS.perfectSaveWindow;
      } else {
        state.perfectSaveWindow = null;
      }
    }

    function noteWallContact(ball, wall) {
      const state = ensureTrickState(ball);
      if (!state.wallHitsSincePaddle || typeof state.wallHitsSincePaddle.add !== 'function') {
        state.wallHitsSincePaddle = new Set();
      }
      state.wallHitsSincePaddle.add(wall);
      state.lastWallHitTime = gameTime;
      if (wall === 'ceiling') {
        state.lastCeilingHitTime = gameTime;
      }
    }

    function registerEdgeKissCandidate(ball) {
      const state = ensureTrickState(ball);
      state.edgeKissCandidateTime = gameTime;
    }

    function createBall(x, y, lockedToPaddle = false) {
      const ball = {
        x,
        y,
        vx: 0,
        vy: 0,
        lockedToPaddle,
        shieldHitFrame: -1,
        shieldHits: new Set(),
        lastPortalId: null,
        lastPortalTime: -Infinity,
        portalSpeedRecovery: null,
        energyTrailTimer: 0,
        trickState: createTrickState(),
      };
      if (lockedToPaddle) {
        markBallAsRestingOnPaddle(ball);
      } else {
        markBallLaunched(ball);
      }
      return ball;
    }

    function detectThreaderPassage(ball) {
      if (!ball || ball.lockedToPaddle || ball.vy >= 0) return;
      const state = ensureTrickState(ball);
      const ballLeft = ball.x - BALL_R;
      const ballRight = ball.x + BALL_R;
      const ballTop = ball.y - BALL_R;
      const ballBottom = ball.y + BALL_R;
      let leftBrick = null;
      let rightBrick = null;
      for (const br of bricks) {
        if (!br || !br.alive) continue;
        if (br.isPhase && !br.phaseTangible) continue;
        const top = br.y;
        const bottom = br.y + br.h;
        if (ballBottom < top || ballTop > bottom) continue;
        if (br.x + br.w <= ballLeft) {
          if (!leftBrick || br.x > leftBrick.x) leftBrick = br;
        } else if (br.x >= ballRight) {
          if (!rightBrick || br.x < rightBrick.x) rightBrick = br;
        }
      }
      if (!leftBrick || !rightBrick) return;
      const gapStart = leftBrick.x + leftBrick.w;
      const gapEnd = rightBrick.x;
      const gapWidth = gapEnd - gapStart;
      if (!(gapWidth > BALL_R * 2)) return;
      if (ballLeft <= gapStart || ballRight >= gapEnd) return;
      if (gapWidth <= TRICK_SHOT_SETTINGS.threaderGapMax) {
        state.lastThreaderPassTime = gameTime;
      }
    }

    function maybeRegisterTrickShot(ball, { willBreak = false } = {}) {
      if (!ball) return;
      const state = ensureTrickState(ball);
      const awards = [];
      const walls = state.wallHitsSincePaddle;
      if (walls && typeof walls.size === 'number') {
        if (
          walls.size >= TRICK_SHOT_SETTINGS.cleanBankWallsRequired &&
          state.lastWallHitTime > state.lastPaddleHitTime
        ) {
          awards.push('cleanBank');
          if (typeof walls.clear === 'function') walls.clear();
          state.lastWallHitTime = -Infinity;
        }
      }

      if (
        state.edgeKissCandidateTime > -Infinity &&
        gameTime - state.edgeKissCandidateTime <= TRICK_SHOT_SETTINGS.edgeKissWindow
      ) {
        awards.push('edgeKiss');
        state.edgeKissCandidateTime = -Infinity;
      }

      if (willBreak) {
        if (
          state.lastCeilingHitTime > -Infinity &&
          gameTime - state.lastCeilingHitTime <= TRICK_SHOT_SETTINGS.backboardWindow
        ) {
          awards.push('backboard');
          state.lastCeilingHitTime = -Infinity;
        }
        if (
          state.lastThreaderPassTime > -Infinity &&
          gameTime - state.lastThreaderPassTime <= TRICK_SHOT_SETTINGS.threaderWindow
        ) {
          awards.push('threader');
          state.lastThreaderPassTime = -Infinity;
        }
        if (state.perfectSaveWindow && gameTime <= state.perfectSaveWindow) {
          awards.push('perfectSave');
          state.perfectSaveWindow = null;
        }
        if (
          Number.isFinite(state.lastPaddleHitTime) &&
          gameTime - state.lastPaddleHitTime >= TRICK_SHOT_SETTINGS.longRailWindow
        ) {
          awards.push('longRail');
          state.lastPaddleHitTime = gameTime;
        }
      }

      if (!awards.length) return;
      for (const key of awards) {
        registerTrickShot(key);
      }
    }

    function registerTrickShot(key) {
      const def = TRICK_SHOT_DEFS[key];
      if (!def) return;
      const points = Number.isFinite(def.points) ? Math.round(def.points) : 0;
      if (points) {
        score += points;
        scoreEl.textContent = score;
      }
      playRandomEventSfx();
      showTrickNotification(def);
    }

    function showTrickNotification(def) {
      enqueueNotification({
        type: 'trick',
        tag: def.tagText || 'Trick Shot',
        title: def.name || 'Trick',
        meta: def.points ? `+${Math.round(def.points)}` : '',
      });
    }

    function handlePaddleWidthChange(newWidth, previousWidth = paddleWidth) {
      const prevWidth = Number.isFinite(previousWidth) ? previousWidth : paddleWidth;
      const center = paddleX + prevWidth / 2;
      paddleWidth = newWidth;
      paddleX = clampPaddleX(center - paddleWidth / 2);
      updateLockedBallsPosition();
      if (newWidth > PADDLE_CONFIG.baseWidth + 0.01) {
        paddleGrowTimer = PADDLE_GROW_ANIM_TIME;
      } else if (newWidth < prevWidth - 0.01) {
        paddleGrowTimer = 0;
      }
      const buffActive = newWidth > PADDLE_CONFIG.baseWidth + 0.01;
      if (buffActive && !paddleBuffActive) {
        enqueueNotification({
          type: 'upgrade',
          tag: 'Paddle',
          title: 'Paddle Engaged',
        });
      } else if (!buffActive && paddleBuffActive) {
        enqueueNotification({
          type: 'upgrade',
          tag: 'Paddle',
          title: 'Paddle Normalized',
        });
      }
      paddleBuffActive = buffActive;
    }

    function updateLockedBallsPosition() {
      for (const ball of balls) {
        if (ball.lockedToPaddle) {
          ball.x = paddleX + paddleWidth / 2;
          ball.y = PADDLE_Y - BALL_R - 2;
        }
      }
    }

    function activateGhostMode() {
      ghostModeActive = true;
      ghostModeTimer = GHOST_MODE_DURATION;
      ghostModeNoticeActive = true;
      enqueueNotification({
        type: 'mode',
        tag: 'Mode',
        title: 'Ghost Paddle',
        meta: `${GHOST_MODE_DURATION.toFixed(1)}s`,
      });
      playGhostWhooshSound();
    }

    function deactivateGhostMode() {
      ghostModeActive = false;
      ghostModeTimer = 0;
      if (ghostModeNoticeActive) {
        enqueueNotification({
          type: 'mode',
          tag: 'Mode',
          title: 'Ghost Paddle Faded',
        });
        ghostModeNoticeActive = false;
      }
    }

    function updateGhostMode(dt) {
      if (!ghostModeActive) return;
      ghostModeTimer -= dt;
      if (ghostModeTimer <= 0) {
        deactivateGhostMode();
      }
    }

    function captureInitialBallSpeed(ball) {
      if (minimumBallSpeed === null) {
        const speed = Math.hypot(ball.vx, ball.vy);
        if (speed > 0) minimumBallSpeed = speed;
      }
    }

    function enforceMinimumBallSpeed(ball) {
      if (minimumBallSpeed === null) return;
      if (ball && ball.portalSpeedRecovery && gameTime < ball.portalSpeedRecovery.rampEnd) {
        return;
      }
      const currentSpeed = Math.hypot(ball.vx, ball.vy);
      if (currentSpeed === 0) return;
      if (currentSpeed < minimumBallSpeed) {
        const scale = minimumBallSpeed / currentSpeed;
        ball.vx *= scale;
        ball.vy *= scale;
      }
    }

    function applyPortalSpeedRecovery(ball) {
      const state = ball.portalSpeedRecovery;
      if (!state) return;

      const { slowUntil, rampEnd, slowSpeed, targetSpeed, dirX, dirY } = state;
      if (targetSpeed <= 0) {
        ball.portalSpeedRecovery = null;
        return;
      }

      let desiredSpeed;
      if (gameTime < slowUntil) {
        desiredSpeed = slowSpeed;
      } else if (gameTime < rampEnd) {
        const rampDuration = Math.max(0.0001, rampEnd - slowUntil);
        const t = Math.min(1, Math.max(0, (gameTime - slowUntil) / rampDuration));
        desiredSpeed = slowSpeed + (targetSpeed - slowSpeed) * t;
      } else {
        desiredSpeed = targetSpeed;
      }

      if (desiredSpeed <= 0) {
        ball.portalSpeedRecovery = null;
        return;
      }

      const currentSpeed = Math.hypot(ball.vx, ball.vy);
      if (currentSpeed > 0) {
        const scale = desiredSpeed / currentSpeed;
        ball.vx *= scale;
        ball.vy *= scale;
      } else {
        const magnitude = Math.hypot(dirX, dirY) || 1;
        ball.vx = (dirX / magnitude) * desiredSpeed;
        ball.vy = (dirY / magnitude) * desiredSpeed;
      }

      if (gameTime >= rampEnd) {
        ball.portalSpeedRecovery = null;
      }
    }

    function registerBrickCombo() {
      const prevMultiplier = comboState.multiplier;
      comboState.multiplier += 1;
      comboState.timer = COMBO_SETTINGS.decayWindow;
      const now = gameTime;
      comboHistory.push(now);
      pruneComboHistory(now);
      if (paddleBuff) {
        paddleBuff.handleComboChange(comboState.multiplier);
      }
      considerShieldWallReward(prevMultiplier, comboState.multiplier);
      if (comboState.multiplier > 1) {
        playRandomEventSfx();
      }
    }

    function resetComboMultiplier() {
      if (comboState.multiplier !== 0 || comboState.timer !== 0) {
        comboState.multiplier = 0;
        comboState.timer = 0;
      }
      comboHistory.length = 0;
      if (paddleBuff) {
        paddleBuff.handleComboChange(0);
      }
      shieldWallState.lastAwardedMultiplier = 0;
    }

    function updateComboTimer(dt) {
      if (comboState.multiplier <= 0) return;
      comboState.timer -= dt;
      if (comboState.timer <= 0) {
        comboState.multiplier = 0;
        comboState.timer = 0;
        comboHistory.length = 0;
        if (paddleBuff) {
          paddleBuff.handleComboChange(0);
        }
        shieldWallState.lastAwardedMultiplier = 0;
      }
    }

    function getShieldWallY() {
      const desired = PADDLE_Y + PADDLE_H + SHIELD_WALL_CONFIG.verticalOffset;
      const maxY = canvas.height - SHIELD_WALL_CONFIG.thickness - 20;
      const minY = PADDLE_Y + PADDLE_H + 2;
      return Math.min(Math.max(desired, minY), maxY);
    }

    function deactivateShieldWalls() {
      shieldWallState.active = false;
      shieldWallState.type = null;
      shieldWallState.timer = 0;
      shieldWallState.duration = 0;
      shieldWallState.y = null;
      shieldWallState.left.startLength = 0;
      shieldWallState.left.length = 0;
      shieldWallState.right.startLength = 0;
      shieldWallState.right.length = 0;
      shieldWallState.lastAwardedMultiplier = 0;
    }

    function activateShieldWalls(tier, currentMultiplier) {
      const config = SHIELD_WALL_CONFIG[tier];
      if (!config) return;
      const previousType = shieldWallState.type;
      const wasSameTierActive = shieldWallState.active && shieldWallState.type === tier;
      const y = getShieldWallY();
      const leftWall = getLeftWallX(y);
      const rightWall = getRightWallX(y);
      const playWidth = Math.max(0, rightWall - leftWall);
      const startLength = Math.max(0, playWidth * config.widthRatio);

      shieldWallState.active = startLength > 0;
      shieldWallState.type = tier;
      shieldWallState.timer = config.duration;
      shieldWallState.duration = config.duration;
      shieldWallState.y = y;
      shieldWallState.thickness = SHIELD_WALL_CONFIG.thickness;
      shieldWallState.left.startLength = startLength;
      shieldWallState.right.startLength = startLength;
      shieldWallState.left.length = startLength;
      shieldWallState.right.length = startLength;
      shieldWallState.lastAwardedMultiplier = currentMultiplier;

      if (!shieldWallState.active) {
        shieldWallState.type = null;
        shieldWallState.lastAwardedMultiplier = 0;
        return;
      }

      if (!wasSameTierActive || previousType !== tier) {
        if (tier === 'great') {
          showUpgradeBanner('Shield Wall: Great Combo!');
        } else {
          showUpgradeBanner('Shield Wall Ready!');
        }
      }
    }

    function updateShieldWalls(dt) {
      if (!shieldWallState.active) return;
      shieldWallState.timer -= dt;
      if (shieldWallState.timer <= 0) {
        deactivateShieldWalls();
        return;
      }
      const ratio = shieldWallState.duration > 0
        ? Math.max(0, Math.min(1, shieldWallState.timer / shieldWallState.duration))
        : 0;
      shieldWallState.left.length = shieldWallState.left.startLength * ratio;
      shieldWallState.right.length = shieldWallState.right.startLength * ratio;
      if (shieldWallState.left.length <= 0 && shieldWallState.right.length <= 0) {
        deactivateShieldWalls();
      }
    }

    function pruneComboHistory(now = gameTime) {
      const cutoff = now - SHIELD_WALL_GREAT_WINDOW;
      while (comboHistory.length > 0 && comboHistory[0] < cutoff) {
        comboHistory.shift();
      }
    }

    function getComboCountWithin(windowSeconds) {
      if (!Number.isFinite(windowSeconds) || windowSeconds <= 0) return 0;
      pruneComboHistory(gameTime);
      const cutoff = gameTime - windowSeconds;
      let count = 0;
      for (let i = comboHistory.length - 1; i >= 0; i--) {
        if (comboHistory[i] >= cutoff) {
          count += 1;
        } else {
          break;
        }
      }
      return count;
    }

    function considerShieldWallReward(prevMultiplier, currentMultiplier) {
      const greatCombos = getComboCountWithin(SHIELD_WALL_GREAT_WINDOW);
      if (currentMultiplier >= SHIELD_WALL_GREAT_THRESHOLD && greatCombos >= SHIELD_WALL_GREAT_THRESHOLD) {
        if (currentMultiplier > shieldWallState.lastAwardedMultiplier || shieldWallState.type !== 'great') {
          activateShieldWalls('great', currentMultiplier);
        }
        return;
      }
      if (shieldWallState.type !== 'great') {
        const goodCombos = getComboCountWithin(SHIELD_WALL_GOOD_WINDOW);
        if (currentMultiplier >= SHIELD_WALL_GOOD_THRESHOLD && goodCombos >= SHIELD_WALL_GOOD_THRESHOLD) {
          if (currentMultiplier > shieldWallState.lastAwardedMultiplier || shieldWallState.type !== 'good') {
            activateShieldWalls('good', currentMultiplier);
          }
        }
      }
    }

    function launchFromPaddle(ball, servingRight = Math.random() > 0.5) {
      ball.x = paddleX + paddleWidth / 2;
      ball.y = PADDLE_Y - BALL_R - 2;
      const angle = (Math.random()*0.5 + 0.8) * (servingRight ? 1 : -1);
      const baseSpeed = (6 + level * 0.8) * 0.75 * 60;
      const levelSpeedMultiplier = 1 + Math.max(0, level - 1) * 0.02;
      const speed = baseSpeed * levelSpeedMultiplier;
      ball.vx = Math.cos(angle) * speed;
      ball.vy = -Math.abs(Math.sin(angle) * speed) - 120;
      ball.lockedToPaddle = false;
      markBallLaunched(ball);
      captureInitialBallSpeed(ball);
      enforceMinimumBallSpeed(ball);
      running = true;
    }

    function resetLevel(n) {
      level = n;
      levelEl.textContent = level;
      updateWallPulseIntervalForLevel(level, { resetCountdown: true });
      resetWallPulseState();
      deactivateShieldWalls();
      const rows = BRICK_ROWS_START + Math.floor((level-1)%4);
      const topOffset = 80;
      const totalWidth = BRICK_COLS*BRICK_W + (BRICK_COLS-1)*BRICK_GAP;
      const leftOffset = (canvas.width - totalWidth)/2 + BRICK_ALIGNMENT_OFFSET;
      brickGridLeft = leftOffset;
      brickGridTop = topOffset;
      const baseShieldChance = Math.min(
        SHIELDED_MAX_CHANCE,
        SHIELDED_BASE_CHANCE + Math.max(0, level - 1) * SHIELDED_LEVEL_BONUS
      );
      bricks = [];
      brickGrid = [];
      brickIdCounter = 0;
      frameCounter = 0;
      deactivateGhostMode();
      for (let r=0; r<rows; r++) {
        if (!brickGrid[r]) {
          brickGrid[r] = [];
        }
        for (let c=0; c<BRICK_COLS; c++) {
          const rowBonus = (rows - r) / rows * 0.06;
          const shieldChance = Math.min(SHIELDED_MAX_CHANCE, baseShieldChance + rowBonus);
          const shielded = Math.random() < shieldChance;
          const maxShieldHealth = shielded ? 1 : 0;
          const brickHp = 1;
          const brick = {
            id: brickIdCounter++,
            x: leftOffset + c*(BRICK_W+BRICK_GAP),
            y: topOffset + r*(BRICK_H+BRICK_GAP),
            w: BRICK_W,
            h: BRICK_H,
            hp: brickHp,
            img: (r%2===0) ? imgBrick1 : imgBrick2,
            alive: true,
            embeddedBall: false,
            embeddedBallReleased: false,
            basePoints: BRICK_BASE_POINTS,
            shieldHealth: maxShieldHealth,
            maxShieldHealth,
            shieldFade: maxShieldHealth > 0 ? 1 : 0,
            shieldGlowPhase: Math.random() * Math.PI * 2,
            shieldCrackTimer: 0,
            gridRow: r,
            gridCol: c,
            explosive: false,
            explosiveGlowPhase: Math.random() * Math.PI * 2,
            explosiveGlowPulse: 0,
            explosiveWarningTimer: 0,
            lastExplosionFrame: -1,
            crackTimer: 0,
            shakeTimer: 0,
            shakeIntensity: 0,
            shakePhase: Math.random() * Math.PI * 2,
            shakeOffsetX: 0,
            shakeOffsetY: 0,
            isTeleport: false,
            teleportActive: false,
            teleportUsesRemaining: 0,
            teleportTimer: 0,
            teleportFlashTimer: 0,
            isGhost: false,
            ghostPhase: Math.random() * Math.PI * 2,
            ghostFlicker: 0,
            isEnergy: false,
            energyGlowPhase: Math.random() * Math.PI * 2,
            energyGlowBoost: 0,
            energyActivated: false,
            energyArcs: [],
            energyArcTimer: 0,
            isPhase: false,
            phaseTangible: true,
            phaseTimer: PHASE_BRICK_TOGGLE_INTERVAL,
            phaseVisibility: 1,
            phaseGlowPhase: Math.random() * Math.PI * 2,
            phaseGlowPulse: 0,
            isTrap: false,
            trapGlowPhase: Math.random() * Math.PI * 2,
            trapGlowPulse: 0,
          };
          bricks.push(brick);
          brickGrid[r][c] = brick;
        }
      }

      assignPhaseBricks();
      assignGhostBricks();
      assignEnergyBricks();
      assignTeleportBricks();
      assignExplosiveBricks();
      assignTrapBricks();
      assignEmbeddedBalls();
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      resetComboMultiplier();
      resetInputInversion();
      if (paddleBuff) {
        paddleBuff.reset();
        paddleWidth = paddleBuff.getCurrentWidth();
      } else {
        paddleWidth = PADDLE_CONFIG.baseWidth;
        paddleGrowTimer = 0;
      }
      paddleBuffActive = paddleWidth > PADDLE_CONFIG.baseWidth + 0.01;
      paddleX = clampPaddleX((canvas.width - paddleWidth) / 2);
      balls = [createBall(paddleX + paddleWidth / 2, PADDLE_Y - BALL_R - 2, true)];
      running = false; paused = false;
      minimumBallSpeed = null;
      SPECIAL_BAR.x = (canvas.width - SPECIAL_BAR.w) / 2;
      SPECIAL_BAR.dir = Math.random() > 0.5 ? 1 : -1;
      SPECIAL_BAR.speed = (3.4 + Math.min(level - 1, 6) * 0.35) * 60;
      SPECIAL_BAR.hp = SPECIAL_BAR.maxHp;
      SPECIAL_BAR.stateIndex = 0;
      SPECIAL_BAR.stateTime = 0;
      SPECIAL_BAR.flashTimer = SPECIAL_BAR.flashInterval;
      SPECIAL_BAR.flashVisible = true;
      splitBars = [];
      showOverlay('Level ' + level, 'Tap/Click or press Space to launch');
      magnetActive = false;
      magnetTimer = 0;
      magnetPulse = 0;
      magnetLockedSpeed = null;
      resizeGame();
    }

    function assignEmbeddedBalls() {
      if (!bricks.length) return;
      const aliveBricks = bricks.filter(br => br.alive && !br.isTeleport && !br.isEnergy && !br.isGhost && !br.isPhase);
      if (!aliveBricks.length) return;
      const targetCount = Math.min(aliveBricks.length, 2 + Math.floor(Math.random() * 3));
      const chosen = new Set();
      while (chosen.size < targetCount) {
        chosen.add(Math.floor(Math.random() * aliveBricks.length));
      }
      for (const idx of chosen) {
        aliveBricks[idx].embeddedBall = true;
      }
    }

    function getExplosiveWarningDelay() {
      const range = EXPLOSIVE_WARNING_INTERVAL_MAX - EXPLOSIVE_WARNING_INTERVAL_MIN;
      return EXPLOSIVE_WARNING_INTERVAL_MIN + Math.random() * Math.max(0.0001, range);
    }

    function getPhaseBrickCountForLevel(currentLevel) {
      if (currentLevel <= 0) return 0;
      const increments = Math.floor(Math.max(0, currentLevel - 1) / 2);
      const desired = 1 + increments;
      return Math.min(PHASE_BRICK_MAX_COUNT, desired);
    }

    function assignPhaseBricks() {
      if (!bricks.length) return;
      const desired = Math.min(getPhaseBrickCountForLevel(level), bricks.length);
      if (desired <= 0) return;
      const pool = bricks.filter(br => br.alive && !br.isTeleport && !br.isEnergy && !br.isGhost && !br.explosive);
      if (!pool.length) return;
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      const limit = Math.min(desired, pool.length);
      for (let i = 0; i < limit; i++) {
        const br = pool[i];
        if (!br) continue;
        br.isPhase = true;
        br.phaseTangible = true;
        br.phaseTimer = Math.random() * PHASE_BRICK_TOGGLE_INTERVAL;
        br.phaseVisibility = 1;
        br.phaseGlowPhase = Math.random() * Math.PI * 2;
        br.phaseGlowPulse = 0;
        if (br.maxShieldHealth > 0) {
          br.maxShieldHealth = 0;
          br.shieldHealth = 0;
          br.shieldFade = 0;
          br.shieldCrackTimer = 0;
        }
        if (br.embeddedBall) {
          br.embeddedBall = false;
          br.embeddedBallReleased = false;
        }
      }
    }

    function assignExplosiveBricks() {
      if (!bricks.length) return;
      const pool = bricks.filter(br => br.alive && !br.isTeleport && !br.isEnergy && !br.isGhost && !br.isPhase);
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      const count = Math.min(pool.length, Math.random() < 0.5 ? 1 : 2);
      for (let i = 0; i < count; i++) {
        const br = pool[i];
        if (br) {
          br.explosive = true;
          br.explosiveGlowPulse = 0.8;
          br.explosiveWarningTimer = getExplosiveWarningDelay();
        }
      }
    }

    function getTrapBrickCountForLevel(currentLevel) {
      if (currentLevel < TRAP_BRICK_START_LEVEL) return 0;
      const offset = currentLevel - TRAP_BRICK_START_LEVEL;
      const base = 1 + Math.floor(offset / TRAP_BRICK_LEVEL_STEP);
      return Math.min(TRAP_BRICK_MAX_COUNT, Math.max(0, base));
    }

    function assignTrapBricks() {
      const desired = Math.min(getTrapBrickCountForLevel(level), bricks.length);
      if (desired <= 0) return;
      const pool = bricks.filter(br => br.alive && !br.isTrap && !br.isTeleport && !br.isEnergy && !br.isGhost && !br.isPhase && !br.explosive);
      if (!pool.length) return;
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      const limit = Math.min(desired, pool.length);
      for (let i = 0; i < limit; i++) {
        const br = pool[i];
        if (!br) continue;
        br.isTrap = true;
        br.trapGlowPhase = Math.random() * Math.PI * 2;
        br.trapGlowPulse = 1;
      }
    }

    function getEnergyBrickCountForLevel(currentLevel) {
      if (currentLevel < 2) return 0;
      const capped = Math.min(currentLevel, 20);
      return 1 + Math.floor((capped - 2) / 4);
    }

    function getGhostBrickCountForLevel(currentLevel) {
      if (currentLevel < 3) return 0;
      const growth = Math.floor((Math.max(currentLevel, 3) - 3) / 4);
      return Math.min(GHOST_BRICK_MAX_COUNT, 1 + growth);
    }

    function assignGhostBricks() {
      if (!bricks.length) return;
      const desired = Math.min(getGhostBrickCountForLevel(level), bricks.length);
      if (desired <= 0) return;
      const pool = bricks.filter(br => br.alive && !br.isGhost && !br.explosive && !br.isPhase);
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      let assigned = 0;
      for (const br of pool) {
        if (!br || assigned >= desired) break;
        br.isGhost = true;
        br.explosive = false;
        br.ghostPhase = Math.random() * Math.PI * 2;
        br.ghostFlicker = Math.random();
        assigned++;
      }
    }

    function assignEnergyBricks() {
      if (!bricks.length) return;
      const desired = Math.min(getEnergyBrickCountForLevel(level), bricks.length);
      if (desired <= 0) return;
      const pool = bricks.filter(br => br.alive && !br.isEnergy && !br.explosive && !br.isPhase);
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      let assigned = 0;
      for (const br of pool) {
        if (!br || assigned >= desired) break;
        br.isEnergy = true;
        br.energyActivated = false;
        br.energyGlowBoost = 1;
        br.energyGlowPhase = Math.random() * Math.PI * 2;
        br.energyArcs = [];
        const range = Math.max(0.0001, ENERGY_ARC_REFRESH_MAX - ENERGY_ARC_REFRESH_MIN);
        br.energyArcTimer = ENERGY_ARC_REFRESH_MIN + Math.random() * range;
        addEnergyArc(br);
        assigned++;
      }
    }

    function getTeleportBrickCountForLevel(currentLevel) {
      if (currentLevel < 2) return 0;
      const growth = Math.floor((currentLevel - 2) / 2);
      return Math.min(6, 1 + growth);
    }

    function assignTeleportBricks() {
      const desired = Math.min(getTeleportBrickCountForLevel(level), bricks.length);
      if (desired <= 0) return;
      const pool = bricks.filter(br => br.alive && !br.isTeleport && !br.explosive && !br.isPhase);
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      let assigned = 0;
      for (let i = 0; i < pool.length && assigned < desired; i++) {
        const br = pool[i];
        if (!br) continue;
        br.isTeleport = true;
        br.teleportActive = true;
        br.teleportUsesRemaining = 1;
        br.teleportTimer = TELEPORT_BRICK_INTERVAL;
        br.teleportFlashTimer = 0;
        assigned++;
      }
    }

    function updateTeleportBricks(dt) {
      for (const br of bricks) {
        if (!br || !br.alive || !br.isTeleport) continue;
        if (br.teleportUsesRemaining !== undefined && br.teleportUsesRemaining <= 0) {
          br.teleportActive = false;
          continue;
        }
        if (!br.teleportActive) {
          br.teleportActive = true;
          if (!Number.isFinite(br.teleportTimer) || br.teleportTimer <= 0) {
            br.teleportTimer = TELEPORT_BRICK_INTERVAL;
          }
        }
        if (br.teleportFlashTimer > 0) {
          br.teleportFlashTimer = Math.max(0, br.teleportFlashTimer - dt);
        }
        if (!Number.isFinite(br.teleportTimer)) {
          br.teleportTimer = TELEPORT_BRICK_INTERVAL;
        }
        br.teleportTimer -= dt;
        let safety = 0;
        while (br.teleportTimer <= 0 && safety < 8) {
          const moved = teleportBrickToRandomCell(br);
          if (!moved) {
            br.teleportTimer = TELEPORT_BRICK_INTERVAL;
            break;
          }
          br.teleportTimer += TELEPORT_BRICK_INTERVAL;
          safety++;
        }
      }
    }

    function teleportBrickToRandomCell(brick) {
      const oldRow = brick.gridRow;
      const oldCol = brick.gridCol;
      if (brickGrid[oldRow] && brickGrid[oldRow][oldCol] === brick) {
        brickGrid[oldRow][oldCol] = null;
      }
      const emptyCells = [];
      const rowCount = brickGrid.length;
      for (let r = 0; r < rowCount; r++) {
        const rowData = brickGrid[r] || [];
        for (let c = 0; c < BRICK_COLS; c++) {
          const occupant = rowData[c];
          const occupied = occupant && occupant !== brick && occupant.alive;
          if (!occupied) {
            emptyCells.push({ row: r, col: c });
          }
        }
      }
      if (!emptyCells.length) {
        if (!brickGrid[oldRow]) brickGrid[oldRow] = [];
        brickGrid[oldRow][oldCol] = brick;
        return false;
      }
      let candidates = emptyCells;
      if (candidates.length > 1) {
        const filtered = candidates.filter(cell => cell.row !== oldRow || cell.col !== oldCol);
        if (filtered.length) {
          candidates = filtered;
        }
      }
      const target = candidates[Math.floor(Math.random() * candidates.length)];
      if (!target) {
        if (!brickGrid[oldRow]) brickGrid[oldRow] = [];
        brickGrid[oldRow][oldCol] = brick;
        return false;
      }
      if (target.row === oldRow && target.col === oldCol) {
        if (!brickGrid[oldRow]) brickGrid[oldRow] = [];
        brickGrid[oldRow][oldCol] = brick;
        return false;
      }
      if (!brickGrid[target.row]) brickGrid[target.row] = [];
      const occupant = brickGrid[target.row][target.col];
      if (occupant && occupant !== brick && occupant.alive) {
        if (!brickGrid[oldRow]) brickGrid[oldRow] = [];
        brickGrid[oldRow][oldCol] = brick;
        return false;
      }
      brick.gridRow = target.row;
      brick.gridCol = target.col;
      brick.x = brickGridLeft + target.col * (BRICK_W + BRICK_GAP);
      brick.y = brickGridTop + target.row * (BRICK_H + BRICK_GAP);
      brickGrid[target.row][target.col] = brick;
      brick.teleportFlashTimer = TELEPORT_FLASH_DURATION;
      adjustBallsAfterTeleport(brick);
      return true;
    }

    function clamp(value, min, max) {
      if (!Number.isFinite(value)) return min;
      return Math.max(min, Math.min(max, value));
    }

    function getTopMostBrickY() {
      let top = Infinity;
      for (const br of bricks) {
        if (br && br.alive) {
          top = Math.min(top, br.y);
        }
      }
      return top === Infinity ? null : top;
    }

    function getLowestAliveBricks() {
      let maxBottom = -Infinity;
      const lowest = [];
      const tolerance = 1;
      for (const br of bricks) {
        if (!br || !br.alive) continue;
        const bottom = br.y + br.h;
        if (bottom > maxBottom + tolerance) {
          maxBottom = bottom;
          lowest.length = 0;
          lowest.push(br);
        } else if (Math.abs(bottom - maxBottom) <= tolerance) {
          lowest.push(br);
        }
      }
      return lowest;
    }

    function circleIntersectsRect(cx, cy, radius, rect) {
      const closestX = clamp(cx, rect.x, rect.x + rect.w);
      const closestY = clamp(cy, rect.y, rect.y + rect.h);
      const dx = cx - closestX;
      const dy = cy - closestY;
      return dx * dx + dy * dy < radius * radius;
    }

    function getShieldWallRect(side) {
      if (!shieldWallState.active) return null;
      const length = side === 'left' ? shieldWallState.left.length : shieldWallState.right.length;
      if (!(length > 0)) return null;
      const y = Number.isFinite(shieldWallState.y) ? shieldWallState.y : getShieldWallY();
      const thickness = shieldWallState.thickness || SHIELD_WALL_CONFIG.thickness;
      const clampY = Math.min(Math.max(y, 0), canvas.height - thickness);
      if (side === 'left') {
        const anchor = getLeftWallX(clampY);
        return { x: anchor, y: clampY, w: length, h: thickness };
      }
      const anchor = getRightWallX(clampY);
      return { x: anchor - length, y: clampY, w: length, h: thickness };
    }

    function isPortalSpawnPositionSafe(x, y) {
      const leftWall = getLeftWallX(y) + BALL_R;
      const rightWall = getRightWallX(y) - BALL_R;
      if (x < leftWall || x > rightWall) return false;
      if (y < BALL_R || y > canvas.height - BALL_R) return false;
      const radius = BALL_R;
      for (const br of bricks) {
        if (!br || !br.alive) continue;
        if (circleIntersectsRect(x, y, radius, br)) return false;
      }
      if (SPECIAL_BAR && SPECIAL_BAR.hp > 0) {
        const specialRect = { x: SPECIAL_BAR.x, y: SPECIAL_BAR.y, w: SPECIAL_BAR.w, h: SPECIAL_BAR.h };
        if (circleIntersectsRect(x, y, radius, specialRect)) return false;
      }
      for (const bar of splitBars) {
        if (!bar || bar.hp <= 0) continue;
        if (circleIntersectsRect(x, y, radius, bar)) return false;
      }
      return true;
    }

    function findPortalSpawnPosition(ball) {
      const lowestBricks = getLowestAliveBricks();
      if (lowestBricks.length) {
        const targetBrick = lowestBricks[Math.floor(Math.random() * lowestBricks.length)];
        const maxSpawnY = Math.min(PADDLE_Y - BALL_R * 2, canvas.height - BALL_R * 1.5);
        let spawnY = targetBrick.y + targetBrick.h + BALL_R * 1.5;
        spawnY = Math.min(maxSpawnY, Math.max(BALL_R * 1.5, spawnY));
        let leftBound = getLeftWallX(spawnY) + BALL_R;
        let rightBound = getRightWallX(spawnY) - BALL_R;
        if (!(rightBound > leftBound)) {
          const center = canvas.width / 2;
          leftBound = center - BALL_R;
          rightBound = center + BALL_R;
        }
        const targetLeft = Math.max(leftBound, targetBrick.x + BALL_R * 0.75);
        const targetRight = Math.min(rightBound, targetBrick.x + targetBrick.w - BALL_R * 0.75);
        const attempts = 32;
        if (targetLeft <= targetRight) {
          const span = Math.max(0, targetRight - targetLeft);
          for (let i = 0; i < attempts; i++) {
            const candidateX = targetLeft + Math.random() * span;
            if (isPortalSpawnPositionSafe(candidateX, spawnY)) {
              return { x: candidateX, y: spawnY };
            }
          }
          const midX = clamp(targetBrick.x + targetBrick.w / 2, targetLeft, targetRight);
          if (isPortalSpawnPositionSafe(midX, spawnY)) {
            return { x: midX, y: spawnY };
          }
        }
        let fallbackX = clamp(targetBrick.x + targetBrick.w / 2, leftBound, rightBound);
        if (ball) {
          const biased = clamp(ball.x, leftBound, rightBound);
          if (isPortalSpawnPositionSafe(biased, spawnY)) {
            return { x: biased, y: spawnY };
          }
          fallbackX = biased;
        }
        if (isPortalSpawnPositionSafe(fallbackX, spawnY)) {
          return { x: fallbackX, y: spawnY };
        }
        for (let i = 0; i < attempts; i++) {
          const offset = (i % 2 === 0 ? 1 : -1) * Math.ceil(i / 2) * BALL_R * 1.5;
          const candidateX = clamp(fallbackX + offset, leftBound, rightBound);
          if (isPortalSpawnPositionSafe(candidateX, spawnY)) {
            return { x: candidateX, y: spawnY };
          }
        }
        return { x: fallbackX, y: spawnY };
      }

      const bandMin = canvas.height * PORTAL_VERTICAL_BAND_MIN;
      const bandMax = canvas.height * PORTAL_VERTICAL_BAND_MAX;
      let spawnY = bandMin + Math.random() * Math.max(0.0001, bandMax - bandMin);
      const topMost = getTopMostBrickY();
      if (topMost !== null) {
        spawnY = Math.min(spawnY, topMost + BRICK_H);
      }
      spawnY = Math.max(BALL_R * 1.5, spawnY);
      let leftBound = getLeftWallX(spawnY) + BALL_R;
      let rightBound = getRightWallX(spawnY) - BALL_R;
      if (!(rightBound > leftBound)) {
        const center = canvas.width / 2;
        leftBound = center - BALL_R;
        rightBound = center + BALL_R;
      }
      let fallbackX = clamp(ball ? ball.x : canvas.width / 2, leftBound, rightBound);
      const attempts = 48;
      const span = Math.max(0, rightBound - leftBound);
      for (let i = 0; i < attempts; i++) {
        const candidateX = leftBound + Math.random() * span;
        if (isPortalSpawnPositionSafe(candidateX, spawnY)) {
          return { x: candidateX, y: spawnY };
        }
      }
      const segmentCount = Math.max(1, BRICK_COLS * 2);
      for (let i = 0; i < segmentCount; i++) {
        const ratio = (i + 0.5) / (segmentCount + 0.5);
        const candidateX = leftBound + ratio * (rightBound - leftBound);
        if (isPortalSpawnPositionSafe(candidateX, spawnY)) {
          return { x: candidateX, y: spawnY };
        }
      }
      if (isPortalSpawnPositionSafe(fallbackX, spawnY)) {
        return { x: fallbackX, y: spawnY };
      }
      for (let i = 0; i < attempts; i++) {
        const offset = (i % 2 === 0 ? 1 : -1) * Math.ceil(i / 2) * BALL_R * 1.5;
        const candidateX = clamp(fallbackX + offset, leftBound, rightBound);
        if (isPortalSpawnPositionSafe(candidateX, spawnY)) {
          return { x: candidateX, y: spawnY };
        }
      }
      return { x: fallbackX, y: spawnY };
    }

    function handlePortalCollision(ball, brick) {
      if (!brick.teleportActive) return false;
      if (ball.lastPortalId === brick.id && (gameTime - ball.lastPortalTime) < PORTAL_GRACE_PERIOD) {
        return false;
      }
      const previousSpeed = Math.hypot(ball.vx, ball.vy);
      const spawn = findPortalSpawnPosition(ball);
      teleportBallThroughPortal(ball, brick, spawn, previousSpeed);
      brick.teleportFlashTimer = TELEPORT_FLASH_DURATION;
      if (brick.teleportUsesRemaining !== undefined) {
        brick.teleportUsesRemaining = Math.max(0, brick.teleportUsesRemaining - 1);
        if (brick.teleportUsesRemaining <= 0) {
          brick.teleportActive = false;
        }
      }
      score += PORTAL_BONUS_POINTS;
      scoreEl.textContent = score;
      showPortalTag();
      playRandomEventSfx();
      return true;
    }

    function teleportBallThroughPortal(ball, brick, spawn, previousSpeed) {
      ball.x = spawn.x;
      ball.y = spawn.y;
      ball.lockedToPaddle = false;
      ball.portalSpeedRecovery = null;

      const baseline = minimumBallSpeed === null ? 0 : minimumBallSpeed;
      const prior = Number.isFinite(previousSpeed) ? Math.max(0, previousSpeed) : 0;
      const baseSpeed = Math.max(prior, baseline, PORTAL_MIN_LAUNCH_SPEED);
      const angleDeg = 25 + Math.random() * 40;
      const angleRad = angleDeg * (Math.PI / 180);
      const direction = Math.random() < 0.5 ? -1 : 1;
      const dirX = Math.cos(angleRad) * direction;
      const dirY = -Math.abs(Math.sin(angleRad));
      const dirMag = Math.hypot(dirX, dirY) || 1;
      const normX = dirX / dirMag;
      const normY = dirY / dirMag;

      ball.vx = normX * baseSpeed;
      ball.vy = normY * baseSpeed;
      captureInitialBallSpeed(ball);
      enforceMinimumBallSpeed(ball);
      const launchSpeed = Math.hypot(ball.vx, ball.vy);
      const exitSpeed = launchSpeed * PORTAL_EXIT_SPEED_RATIO;
      ball.vx = normX * exitSpeed;
      ball.vy = normY * exitSpeed;

      ball.portalSpeedRecovery = {
        slowUntil: gameTime + PORTAL_SLOW_DURATION,
        rampEnd: gameTime + PORTAL_SLOW_DURATION + PORTAL_RECOVERY_DURATION,
        slowSpeed: exitSpeed,
        targetSpeed: launchSpeed,
        dirX: normX,
        dirY: normY,
      };

      ball.lastPortalId = brick.id;
      ball.lastPortalTime = gameTime;
      if (ball.shieldHits && typeof ball.shieldHits.clear === 'function') {
        ball.shieldHits.clear();
      }
      const resultingSpeed = launchSpeed;
      if (resultingSpeed > 0) {
        minimumBallSpeed = minimumBallSpeed === null
          ? resultingSpeed
          : Math.max(minimumBallSpeed, resultingSpeed);
      }
    }

    function adjustBallsAfterTeleport(brick) {
      if (!balls.length) return;
      const left = brick.x;
      const right = brick.x + brick.w;
      const top = brick.y;
      const bottom = brick.y + brick.h;
      for (const ball of balls) {
        if (!ball) continue;
        if (ball.x + BALL_R <= left || ball.x - BALL_R >= right || ball.y + BALL_R <= top || ball.y - BALL_R >= bottom) {
          continue;
        }
        const overlaps = [];
        const overlapLeft = (ball.x + BALL_R) - left;
        if (overlapLeft > 0) overlaps.push({ axis: 'x', dir: -1, amount: overlapLeft });
        const overlapRight = right - (ball.x - BALL_R);
        if (overlapRight > 0) overlaps.push({ axis: 'x', dir: 1, amount: overlapRight });
        const overlapTop = (ball.y + BALL_R) - top;
        if (overlapTop > 0) overlaps.push({ axis: 'y', dir: -1, amount: overlapTop });
        const overlapBottom = bottom - (ball.y - BALL_R);
        if (overlapBottom > 0) overlaps.push({ axis: 'y', dir: 1, amount: overlapBottom });
        if (!overlaps.length) continue;
        overlaps.sort((a, b) => a.amount - b.amount);
        const best = overlaps[0];
        if (best.axis === 'x') {
          ball.x += best.dir * best.amount;
        } else {
          ball.y += best.dir * best.amount;
        }
      }
    }

    function getBrickAt(row, col) {
      if (row < 0 || col < 0) return null;
      const rowData = brickGrid[row];
      if (!rowData) return null;
      return rowData[col] || null;
    }

    function getActiveBrickTraits(brick) {
      if (!brick) return [];
      const traits = [];
      if (brick.maxShieldHealth > 0) traits.push('shield');
      if (brick.isTeleport) traits.push('teleport');
      if (brick.isEnergy) traits.push('energy');
      if (brick.isGhost) traits.push('ghost');
      if (brick.isPhase) traits.push('phase');
      if (brick.isTrap) traits.push('trap');
      return traits;
    }

    function isSpecialBrick(brick) {
      if (!brick) return false;
      const traits = getActiveBrickTraits(brick);
      if (traits.length > 0) return true;
      if (brick.explosive || brick.embeddedBall) return true;
      return false;
    }

    function awardBrickPoints(brick, ratio = 1) {
      const traits = getActiveBrickTraits(brick);
      let multiplier = 1;
      if (traits.includes('shield')) {
        multiplier *= SHIELDED_BRICK_MULTIPLIER;
      }
      if (traits.includes('teleport')) {
        multiplier *= TELEPORT_BRICK_SCORE_MULTIPLIER;
      }
      if (traits.includes('phase')) {
        multiplier *= PHASE_BRICK_SCORE_MULTIPLIER;
      }
      if (traits.includes('trap')) {
        multiplier *= TRAP_BRICK_SCORE_MULTIPLIER;
      }
      const extraTraitCount = Math.max(0, traits.length - 1);
      if (extraTraitCount > 0) {
        multiplier *= Math.pow(EXTRA_TRAIT_STACK_MULTIPLIER, extraTraitCount);
      }
      const rawPoints = brick.basePoints * multiplier * ratio;
      const awarded = Math.max(1, Math.round(rawPoints));
      score += awarded;
      scoreEl.textContent = score;
      return awarded;
    }

    function applyCrackedState(brick) {
      if (!brick || !brick.alive) return;
      if (brick.maxShieldHealth > 0 && brick.shieldHealth > 0) {
        brick.shieldCrackTimer = Math.max(brick.shieldCrackTimer, SHIELD_CRACK_DURATION);
        brick.shieldFade = 1;
      } else {
        brick.crackTimer = Math.max(brick.crackTimer, EXPLOSIVE_CRACK_DURATION);
      }
    }

    function applyShake(brick, multiplier = 1) {
      if (!brick || !brick.alive) return;
      brick.shakeTimer = Math.max(brick.shakeTimer, BRICK_SHAKE_DURATION);
      const targetIntensity = BRICK_SHAKE_INTENSITY * Math.max(0.1, multiplier);
      brick.shakeIntensity = Math.max(brick.shakeIntensity, targetIntensity);
      if (!Number.isFinite(brick.shakePhase)) {
        brick.shakePhase = Math.random() * Math.PI * 2;
      }
    }

    function triggerExplosiveBrick(brick) {
      if (!brick || !brick.explosive) return;
      if (brick.lastExplosionFrame === frameCounter) return;
      brick.lastExplosionFrame = frameCounter;
      brick.explosiveGlowPulse = 1;
      brick.explosiveWarningTimer = getExplosiveWarningDelay();
      const centerX = brick.x + brick.w / 2;
      const centerY = brick.y + brick.h / 2;
      spawnExplosionParticles(centerX, centerY);
      spawnExplosionShockwave(centerX, centerY);
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const neighbor = getBrickAt(brick.gridRow + dr, brick.gridCol + dc);
          if (!neighbor || !neighbor.alive) continue;
          if (neighbor.lastExplosionFrame === frameCounter) continue;
          neighbor.lastExplosionFrame = frameCounter;
          if (Math.random() < EXPLOSIVE_NEIGHBOR_CHANCE) {
            neighbor.hp = 0;
            neighbor.shieldHealth = 0;
            neighbor.shieldFade = 0;
            neighbor.shieldCrackTimer = 0;
            neighbor.alive = false;
            awardBrickPoints(neighbor, EXPLOSIVE_POINT_RATIO);
            handleBrickDestroyed(neighbor, null, { triggeredByExplosion: true });
          } else {
            applyCrackedState(neighbor);
            applyShake(neighbor, 1);
          }
        }
      }
    }

    function spawnExplosionParticles(x, y) {
      const mainCount = EXPLOSION_PARTICLE_COUNT + Math.floor(Math.random() * 8);
      for (let i = 0; i < mainCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 220 + Math.random() * 200;
        const life = EXPLOSION_PARTICLE_LIFE + Math.random() * 0.18;
        explosionParticles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life,
          maxLife: life,
          baseRadius: EXPLOSION_PARTICLE_BASE_RADIUS * (0.75 + Math.random() * 0.65),
          radiusRange: EXPLOSION_PARTICLE_RADIUS_VARIANCE * (0.7 + Math.random() * 0.9),
          hueBias: Math.random(),
        });
      }
      const emberCount = Math.floor(EXPLOSION_PARTICLE_COUNT * 0.6);
      for (let i = 0; i < emberCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 120 + Math.random() * 140;
        const life = (EXPLOSION_PARTICLE_LIFE * 0.75) + Math.random() * 0.18;
        explosionParticles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life,
          maxLife: life,
          baseRadius: EXPLOSION_PARTICLE_BASE_RADIUS * (0.45 + Math.random() * 0.35),
          radiusRange: EXPLOSION_PARTICLE_RADIUS_VARIANCE * (0.35 + Math.random() * 0.4),
          hueBias: Math.random(),
          spark: true,
        });
      }
    }

    function spawnExplosionShockwave(x, y) {
      explosionShockwaves.push({
        x,
        y,
        life: EXPLOSION_SHOCKWAVE_LIFE,
        maxLife: EXPLOSION_SHOCKWAVE_LIFE,
        radius: 0,
      });
    }

    function spawnBrickDebris(brick) {
      if (!brick) return;
      const centerX = brick.x + brick.w / 2;
      const centerY = brick.y + brick.h / 2;
      const count = EXPLOSION_DEBRIS_COUNT + Math.floor(Math.random() * 6);
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 160 + Math.random() * 160;
        const life = EXPLOSION_DEBRIS_LIFE + Math.random() * 0.2;
        brickDebrisParticles.push({
          x: centerX,
          y: centerY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life,
          maxLife: life,
          size: 3 + Math.random() * 4,
          rotation: Math.random() * Math.PI * 2,
          rotationSpeed: (Math.random() - 0.5) * 12,
          colorMix: Math.random(),
        });
      }
    }

    function updateExplosionParticles(dt) {
      for (let i = explosionParticles.length - 1; i >= 0; i--) {
        const p = explosionParticles[i];
        p.life -= dt;
        if (p.life <= 0) {
          explosionParticles.splice(i, 1);
          continue;
        }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.9;
