        p.vy *= 0.9;
      }
    }

    function updateExplosionShockwaves(dt) {
      for (let i = explosionShockwaves.length - 1; i >= 0; i--) {
        const sw = explosionShockwaves[i];
        sw.life -= dt;
        if (sw.life <= 0) {
          explosionShockwaves.splice(i, 1);
          continue;
        }
        const lifeRatio = 1 - Math.max(0, sw.life / sw.maxLife);
        sw.radius = lifeRatio * EXPLOSION_SHOCKWAVE_MAX_RADIUS;
      }
    }

    function updateBrickDebris(dt) {
      for (let i = brickDebrisParticles.length - 1; i >= 0; i--) {
        const p = brickDebrisParticles[i];
        p.life -= dt;
        if (p.life <= 0) {
          brickDebrisParticles.splice(i, 1);
          continue;
        }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.88;
        p.vy = p.vy * 0.88 + 240 * dt;
        p.rotation += p.rotationSpeed * dt;
      }
    }

    function renderExplosionParticles() {
      if (!explosionParticles.length) return;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const p of explosionParticles) {
        const lifeRatio = Math.max(0, p.life / p.maxLife);
        const radius = (p.baseRadius || EXPLOSION_PARTICLE_BASE_RADIUS) + (1 - lifeRatio) * (p.radiusRange || EXPLOSION_PARTICLE_RADIUS_VARIANCE);
        const alphaBase = (p.spark ? 0.55 : 0.65) * lifeRatio + 0.2;
        const mix = p.hueBias ?? 0.5;
        const cyanAlpha = alphaBase * (1 - mix * 0.25);
        const magentaAlpha = alphaBase * (0.7 + mix * 0.4);
        const gradient = ctx.createRadialGradient(p.x, p.y, radius * 0.22, p.x, p.y, radius);
        gradient.addColorStop(0, `rgba(0, 255, 255, ${cyanAlpha})`);
        gradient.addColorStop(0.55, `rgba(120, 255, 255, ${cyanAlpha * 0.85})`);
        gradient.addColorStop(0.9, `rgba(255, 62, 223, ${magentaAlpha})`);
        gradient.addColorStop(1, 'rgba(255, 62, 223, 0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function renderExplosionShockwaves() {
      if (!explosionShockwaves.length) return;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const sw of explosionShockwaves) {
        const lifeRatio = Math.max(0, sw.life / sw.maxLife);
        const radius = Math.max(4, sw.radius || 0);
        const alpha = 0.4 * lifeRatio + 0.1;
        const innerRadius = radius * 0.35;
        const gradient = ctx.createRadialGradient(sw.x, sw.y, innerRadius, sw.x, sw.y, radius);
        gradient.addColorStop(0, `rgba(0, 255, 255, ${alpha})`);
        gradient.addColorStop(0.6, `rgba(0, 255, 255, ${alpha * 0.4})`);
        gradient.addColorStop(0.85, `rgba(255, 62, 223, ${alpha * 0.6})`);
        gradient.addColorStop(1, 'rgba(255, 62, 223, 0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function renderBrickDebris() {
      if (!brickDebrisParticles.length) return;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const p of brickDebrisParticles) {
        const lifeRatio = Math.max(0, p.life / p.maxLife);
        const mix = Math.min(1, Math.max(0, p.colorMix));
        const r = Math.round(0 * (1 - mix) + 255 * mix);
        const g = Math.round(255 * (1 - mix) + 62 * mix);
        const b = Math.round(255 * (1 - mix) + 223 * mix);
        const alpha = 0.7 * lifeRatio + 0.15;
        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        const width = p.size * (1 + (1 - lifeRatio) * 0.5);
        const height = p.size * 0.45;
        ctx.fillRect(-width / 2, -height / 2, width, height);
        ctx.restore();
      }
      ctx.restore();
    }

    function ensureEnergyArcState(br) {
      if (!Array.isArray(br.energyArcs)) {
        br.energyArcs = [];
      }
      const range = Math.max(0.0001, ENERGY_ARC_REFRESH_MAX - ENERGY_ARC_REFRESH_MIN);
      if (!Number.isFinite(br.energyArcTimer)) {
        br.energyArcTimer = ENERGY_ARC_REFRESH_MIN + Math.random() * range;
      }
    }

    function jitterEnergyArc(br, arc) {
      if (!arc || !arc.points || !arc.basePoints) return;
      const minY = br.y + br.h * 0.08;
      const maxY = br.y + br.h * 0.92;
      for (let i = 1; i < arc.points.length - 1; i++) {
        const base = arc.basePoints[i];
        if (!base) continue;
        arc.points[i].x = base.x + (Math.random() - 0.5) * ENERGY_ARC_JITTER;
        arc.points[i].y = clamp(base.y + (Math.random() - 0.5) * ENERGY_ARC_JITTER, minY, maxY);
      }
    }

    function createEnergyArc(br, intensity = 1) {
      const segments = 5 + Math.floor(Math.random() * 4);
      const minY = br.y + br.h * 0.12;
      const maxY = br.y + br.h * 0.88;
      const centralY = clamp(br.y + br.h * (0.25 + Math.random() * 0.5), minY, maxY);
      const amplitude = br.h * 0.35 * Math.min(2, intensity);
      const sway = br.w * 0.08 * Math.min(2, intensity);
      const basePoints = [];
      for (let i = 0; i < segments; i++) {
        const t = segments <= 1 ? 0 : i / (segments - 1);
        const x = br.x + t * br.w;
        const sine = Math.sin((t + Math.random() * 0.2) * Math.PI * (1 + Math.random())) * amplitude * 0.4;
        const jitterY = (Math.random() - 0.5) * amplitude * 0.4;
        const jitterX = (Math.random() - 0.5) * sway;
        const y = clamp(centralY + sine + jitterY, minY, maxY);
        basePoints.push({ x: x + jitterX, y });
      }
      const arc = {
        basePoints,
        points: basePoints.map(pt => ({ ...pt })),
        life: ENERGY_ARC_LIFETIME,
        maxLife: ENERGY_ARC_LIFETIME,
        alpha: 0.45 + Math.random() * 0.35 * Math.min(1.6, intensity),
        width: 1 + Math.random() * 1.2 * Math.min(1.6, intensity),
        jitterTimer: 0,
      };
      jitterEnergyArc(br, arc);
      return arc;
    }

    function addEnergyArc(br, intensity = 1) {
      ensureEnergyArcState(br);
      const arc = createEnergyArc(br, intensity);
      br.energyArcs.push(arc);
      if (br.energyArcs.length > 14) {
        br.energyArcs.splice(0, br.energyArcs.length - 14);
      }
    }

    function updateEnergyArcs(br, dt) {
      ensureEnergyArcState(br);
      const range = Math.max(0.0001, ENERGY_ARC_REFRESH_MAX - ENERGY_ARC_REFRESH_MIN);
      const intensity = 1 + Math.min(1.4, (br.energyGlowBoost || 0) * 0.8 + (br.energyActivated ? 0.7 : 0));
      br.energyArcTimer -= dt * intensity;
      while (br.energyArcTimer <= 0) {
        const countRange = ENERGY_ARC_MAX_COUNT - ENERGY_ARC_MIN_COUNT + 1;
        const spawnCount = ENERGY_ARC_MIN_COUNT + Math.floor(Math.random() * Math.max(1, countRange));
        for (let i = 0; i < spawnCount; i++) {
          addEnergyArc(br, intensity);
        }
        br.energyArcTimer += ENERGY_ARC_REFRESH_MIN + Math.random() * range;
      }
      if (!Array.isArray(br.energyArcs) || !br.energyArcs.length) return;
      br.energyArcs = br.energyArcs.filter(arc => {
        arc.life -= dt;
        if (arc.life <= 0) return false;
        arc.jitterTimer -= dt;
        if (arc.jitterTimer <= 0) {
          arc.jitterTimer = 0.016 + Math.random() * 0.035;
          jitterEnergyArc(br, arc);
        }
        return true;
      });
    }

    function triggerEnergyArcBurst(br) {
      ensureEnergyArcState(br);
      const intensity = 1.4 + Math.min(1, br.energyGlowBoost || 0);
      const burstCount = 2 + Math.floor(Math.random() * 2);
      for (let i = 0; i < burstCount; i++) {
        addEnergyArc(br, intensity);
      }
      br.energyArcTimer = Math.min(br.energyArcTimer, ENERGY_ARC_REFRESH_MIN);
    }

    function updateBrickVisualState(dt) {
      for (const br of bricks) {
        if (!br.alive) continue;
        if (br.shakeTimer > 0) {
          br.shakeTimer = Math.max(0, br.shakeTimer - dt);
          br.shakePhase += dt * BRICK_SHAKE_FREQUENCY;
          const normalized = Math.max(0, Math.min(1, br.shakeTimer / BRICK_SHAKE_DURATION));
          const intensity = br.shakeIntensity * Math.pow(normalized, 0.65);
          br.shakeOffsetX = Math.sin(br.shakePhase * 1.9) * intensity;
          br.shakeOffsetY = Math.cos(br.shakePhase * 2.3) * intensity * 0.75;
          if (br.shakeTimer <= 0) {
            br.shakeOffsetX = 0;
            br.shakeOffsetY = 0;
            br.shakeIntensity = 0;
          }
        } else if (Math.abs(br.shakeOffsetX) > 0.01 || Math.abs(br.shakeOffsetY) > 0.01) {
          br.shakeOffsetX *= 0.6;
          br.shakeOffsetY *= 0.6;
          if (Math.abs(br.shakeOffsetX) < 0.01 && Math.abs(br.shakeOffsetY) < 0.01) {
            br.shakeOffsetX = 0;
            br.shakeOffsetY = 0;
            br.shakeIntensity = 0;
          }
        }
        if (br.explosive) {
          if (!Number.isFinite(br.explosiveGlowPhase)) {
            br.explosiveGlowPhase = Math.random() * Math.PI * 2;
          }
          br.explosiveGlowPhase = (br.explosiveGlowPhase + dt * EXPLOSIVE_GLOW_SPEED) % (Math.PI * 2);
          const basePulse = (Math.sin(br.explosiveGlowPhase) + 1) / 2;
          const flicker = (Math.sin(br.explosiveGlowPhase * 3.1) + 1) / 2 * 0.35;
          const normalized = Math.min(1, Math.max(0, Math.pow(basePulse, 1.4) * (0.7 + flicker)));
          br.explosiveGlowPulse = normalized;
          if (!Number.isFinite(br.explosiveWarningTimer) || br.explosiveWarningTimer <= 0) {
            br.explosiveWarningTimer = getExplosiveWarningDelay();
          } else {
            br.explosiveWarningTimer -= dt;
            if (br.explosiveWarningTimer <= 0) {
              br.explosiveWarningTimer = getExplosiveWarningDelay();
              br.explosiveGlowPulse = 1;
              applyShake(br, EXPLOSIVE_WARNING_SHAKE_MULTIPLIER + Math.random() * 0.35);
            }
          }
        } else if (br.explosiveGlowPulse) {
          br.explosiveGlowPulse = Math.max(0, br.explosiveGlowPulse - dt * 1.2);
        }
        if (br.isTrap) {
          if (!Number.isFinite(br.trapGlowPhase)) {
            br.trapGlowPhase = Math.random() * Math.PI * 2;
          }
          br.trapGlowPhase = (br.trapGlowPhase + dt * TRAP_GLOW_SPEED) % (Math.PI * 2);
          const basePulse = (Math.sin(br.trapGlowPhase) + 1) / 2;
          const flicker = (Math.sin(br.trapGlowPhase * 2.7) + 1) / 2 * 0.3;
          const normalized = Math.min(1, Math.max(0, basePulse * 0.6 + flicker * 0.4));
          br.trapGlowPulse = TRAP_GLOW_MIN_ALPHA + normalized * (TRAP_GLOW_MAX_ALPHA - TRAP_GLOW_MIN_ALPHA);
        } else if (br.trapGlowPulse) {
          br.trapGlowPulse = Math.max(0, br.trapGlowPulse - dt * 2.2);
        }
        if (br.isPhase) {
          if (!Number.isFinite(br.phaseTimer)) {
            br.phaseTimer = PHASE_BRICK_TOGGLE_INTERVAL;
          }
          br.phaseTimer -= dt;
          while (br.phaseTimer <= 0) {
            br.phaseTimer += PHASE_BRICK_TOGGLE_INTERVAL;
            br.phaseTangible = !br.phaseTangible;
          }
          const targetVisibility = br.phaseTangible ? 1 : PHASE_BRICK_INTANGIBLE_ALPHA;
          if (!Number.isFinite(br.phaseVisibility)) {
            br.phaseVisibility = targetVisibility;
          } else {
            const lerpRate = Math.min(1, dt * 8);
            br.phaseVisibility += (targetVisibility - br.phaseVisibility) * lerpRate;
          }
          if (!Number.isFinite(br.phaseGlowPhase)) {
            br.phaseGlowPhase = Math.random() * Math.PI * 2;
          }
          br.phaseGlowPhase = (br.phaseGlowPhase + dt * PHASE_BRICK_GLOW_SPEED) % (Math.PI * 2);
          const glowBase = (Math.sin(br.phaseGlowPhase) + 1) / 2;
          const intangibleBoost = br.phaseTangible ? 0.25 : 0.65;
          br.phaseGlowPulse = Math.min(1, Math.max(0, glowBase * (0.6 + intangibleBoost)));
        } else if (br.phaseGlowPulse) {
          br.phaseGlowPulse = Math.max(0, br.phaseGlowPulse - dt * 2.4);
          if (!br.isPhase && Number.isFinite(br.phaseVisibility)) {
            const lerpRate = Math.min(1, dt * 8);
            br.phaseVisibility += (1 - br.phaseVisibility) * lerpRate;
            if (Math.abs(1 - br.phaseVisibility) < 0.01) {
              br.phaseVisibility = 1;
            }
          }
        }
        if (br.isGhost) {
          if (!Number.isFinite(br.ghostPhase)) {
            br.ghostPhase = Math.random() * Math.PI * 2;
          }
          br.ghostPhase = (br.ghostPhase + dt * GHOST_BRICK_FLICKER_SPEED) % (Math.PI * 2);
          br.ghostFlicker = (Math.sin(br.ghostPhase) + 1) / 2;
        } else if (br.ghostFlicker) {
          br.ghostFlicker = Math.max(0, br.ghostFlicker - dt * 4);
        }
        if (br.isEnergy) {
          if (!Number.isFinite(br.energyGlowPhase)) {
            br.energyGlowPhase = Math.random() * Math.PI * 2;
          }
          br.energyGlowPhase = (br.energyGlowPhase + dt * ENERGY_GLOW_SPEED) % (Math.PI * 2);
          if (!Number.isFinite(br.energyGlowBoost)) {
            br.energyGlowBoost = 0;
          }
          if (br.energyGlowBoost > 0) {
            br.energyGlowBoost = Math.max(0, br.energyGlowBoost - dt * ENERGY_GLOW_DECAY);
          }
          updateEnergyArcs(br, dt);
        } else if (br.energyGlowBoost > 0) {
          br.energyGlowBoost = Math.max(0, br.energyGlowBoost - dt * ENERGY_GLOW_DECAY);
          if (Array.isArray(br.energyArcs) && br.energyArcs.length) {
            br.energyArcs.length = 0;
          }
        }
        if (br.crackTimer > 0) {
          br.crackTimer = Math.max(0, br.crackTimer - dt);
        }
        if (!br.maxShieldHealth) continue;
        if (br.shieldHealth > 0) {
          br.shieldFade = Math.min(1, br.shieldFade + dt * 4);
        } else if (br.shieldFade > 0) {
          br.shieldFade = Math.max(0, br.shieldFade - dt * 3.2);
        }
        br.shieldGlowPhase = (br.shieldGlowPhase + dt * 2.6) % (Math.PI * 2);
        if (br.shieldCrackTimer > 0) {
          br.shieldCrackTimer = Math.max(0, br.shieldCrackTimer - dt);
        }
      }
    }

    function launch() {
      if (paused) { togglePause(); return; }
      if (!running) {
        const ball = balls.find(b => b.lockedToPaddle) || balls[0];
        if (ball) {
          hideOverlay();
          minimumBallSpeed = null;
          launchFromPaddle(ball);
        }
      }
    }

    function update(dt) {
      frameCounter++;
      updateBrickVisualState(dt);
      const paddleSpeed = (9 + level*0.4) * 60;
      let moveLeft = input.left;
      let moveRight = input.right;
      if (inputInvertActive) {
        const swapped = moveLeft;
        moveLeft = moveRight;
        moveRight = swapped;
      }
      if (moveLeft) paddleX -= paddleSpeed * dt;
      if (moveRight) paddleX += paddleSpeed * dt;
      paddleX = clampPaddleX(paddleX);
      syncSliderToPaddle();

      const ballsToRemove = [];

      for (const ball of balls) {
        if (!ball.shieldHits) {
          ball.shieldHits = new Set();
        }
        if (ball.shieldHitFrame !== frameCounter) {
          ball.shieldHits.clear();
          ball.shieldHitFrame = frameCounter;
        }
        if (ball.energyTrailTimer > 0) {
          ball.energyTrailTimer = Math.max(0, ball.energyTrailTimer - dt);
        }
        if (ball.lockedToPaddle) {
          ball.x = paddleX + paddleWidth / 2;
          ball.y = PADDLE_Y - BALL_R - 2;
          markBallAsRestingOnPaddle(ball);
          continue;
        }

        if (magnetActive && ball.vy > 0) {
          const targetX = paddleX + paddleWidth / 2;
          const targetY = PADDLE_Y + PADDLE_H / 2;
          let speed = magnetLockedSpeed;
          if (!speed || speed <= 0) {
            const currentSpeed = Math.hypot(ball.vx, ball.vy);
            if (currentSpeed > 0) {
              speed = currentSpeed;
            } else if (minimumBallSpeed) {
              speed = minimumBallSpeed;
            } else {
              speed = 0;
            }
            if (speed > 0) magnetLockedSpeed = speed;
          }
          if (speed > 0) {
            const dx = targetX - ball.x;
            const dy = targetY - ball.y;
            const dist = Math.hypot(dx, dy);
            if (dist > 1) {
              ball.vx = (dx / dist) * speed;
              ball.vy = (dy / dist) * speed;
            } else {
              ball.vx = 0;
              ball.vy = speed;
            }
          }
        }

        if (ball.portalSpeedRecovery) {
          applyPortalSpeedRecovery(ball);
        }

        const prevBallX = ball.x;
        const prevBallY = ball.y;
        ball.x += ball.vx * dt; ball.y += ball.vy * dt;

        const leftBoundPrev = getLeftWallX(prevBallY);
        const leftBoundNow = getLeftWallX(ball.y);
        const headingLeft = ball.vx < 0;
        const leftBound = headingLeft ? Math.max(leftBoundPrev, leftBoundNow) : leftBoundNow;
        if (ball.x - BALL_R < leftBound) {
          ball.x = leftBound + BALL_R;
          ball.vx = Math.abs(ball.vx);
          if (ball.vx === 0) {
            ball.vx = Math.max(180, minimumBallSpeed || 0);
          }
          noteWallContact(ball, 'left');
        }

        const rightBoundPrev = getRightWallX(prevBallY);
        const rightBoundNow = getRightWallX(ball.y);
        const headingRight = ball.vx > 0;
        const rightBound = headingRight ? Math.min(rightBoundPrev, rightBoundNow) : rightBoundNow;
        if (ball.x + BALL_R > rightBound) {
          ball.x = rightBound - BALL_R;
          ball.vx = -Math.abs(ball.vx);
          if (ball.vx === 0) {
            const fallback = Math.max(180, minimumBallSpeed || 0);
            ball.vx = -fallback;
          }
          noteWallContact(ball, 'right');
        }
        if (ball.y - BALL_R < 0) {
          ball.y = BALL_R;
          ball.vy *= -1;
          noteWallContact(ball, 'ceiling');
        }

        detectThreaderPassage(ball);

        if (SPECIAL_BAR.hp > 0) {
          const barLeft = SPECIAL_BAR.x;
          const barRight = SPECIAL_BAR.x + SPECIAL_BAR.w;
          const barTop = SPECIAL_BAR.y;
          const barBottom = SPECIAL_BAR.y + SPECIAL_BAR.h;
          const intersectsBar =
            ball.x + BALL_R >= barLeft &&
            ball.x - BALL_R <= barRight &&
            ball.y + BALL_R >= barTop &&
            ball.y - BALL_R <= barBottom;
          if (intersectsBar) {
            const prevTop = prevBallY - BALL_R;
            const prevBottom = prevBallY + BALL_R;
            let verticalBounce = false;

            if (ball.vy > 0 && prevBottom <= barTop) {
              ball.y = barTop - BALL_R;
              ball.vy = -Math.abs(ball.vy);
              verticalBounce = true;
            } else if (ball.vy < 0 && prevTop >= barBottom) {
              ball.y = barBottom + BALL_R;
              ball.vy = Math.abs(ball.vy);
              verticalBounce = true;
            } else {
              if (prevBallX + BALL_R <= barLeft) {
                ball.x = barLeft - BALL_R;
              } else if (prevBallX - BALL_R >= barRight) {
                ball.x = barRight + BALL_R;
              }
              ball.vx *= -1;
            }

            if (verticalBounce) {
              const offset = (ball.x - (barLeft + SPECIAL_BAR.w / 2)) / (SPECIAL_BAR.w / 2);
              ball.vx += offset * 1.2 * 60;
            }

            SPECIAL_BAR.hp = Math.max(0, SPECIAL_BAR.hp - 1);
            if (SPECIAL_BAR.hp > 0) {
              score += 20;
            } else {
              score += 50;
              handleSpecialBarDestroyed();
            }
            scoreEl.textContent = score;
          }
        } else if (splitBars.length) {
          handleSplitBarsCollision(ball, prevBallX, prevBallY);
        }

        if (shieldWallState.active) {
          handleShieldWallCollision(ball, prevBallX, prevBallY);
        }

        if (ball.y - BALL_R > canvas.height) {
          ballsToRemove.push(ball);
          continue;
        }

        const paddleTop = PADDLE_Y;
        const paddleBottom = PADDLE_Y + PADDLE_H;
        const prevBottom = prevBallY + BALL_R;
        const currBottom = ball.y + BALL_R;
        const currTop = ball.y - BALL_R;
        const paddleHit = getPaddleHitbox();
        const paddleHitLeft = paddleHit.left;
        const paddleHitRight = paddleHit.right;
        const paddleHitWidth = paddleHit.width;
        const paddleHitCenter = paddleHitLeft + paddleHitWidth / 2;
        const overlapsHorizontally = ball.x + BALL_R >= paddleHitLeft && ball.x - BALL_R <= paddleHitRight;
        const crossedPaddleTop = prevBottom <= paddleTop && currBottom >= paddleTop;
        const withinVerticalRange = currBottom >= paddleTop && currTop <= paddleBottom;

        if (ball.vy > 0 && overlapsHorizontally && (crossedPaddleTop || withinVerticalRange)) {
          ball.y = paddleTop - BALL_R - 1;
          if (magnetActive) {
            const reboundSpeed = magnetLockedSpeed ?? Math.hypot(ball.vx, ball.vy);
            ball.x = paddleHitCenter;
            ball.vx = 0;
            if (reboundSpeed && reboundSpeed > 0) {
              ball.vy = -Math.abs(reboundSpeed);
            } else {
              const fallbackSpeed = minimumBallSpeed || (6 + level * 0.8) * 0.75 * 60;
              ball.vy = -Math.abs(fallbackSpeed);
            }
            magnetLockedSpeed = Math.abs(ball.vy);
            notePaddleContact(ball, 0, { allowPerfectSave: false });
          } else {
            const clampedX = Math.min(paddleHitRight, Math.max(paddleHitLeft, ball.x));
            const denominator = paddleHitWidth / 2 || 1;
            const hit = denominator !== 0 ? (clampedX - paddleHitCenter) / denominator : 0;
            const speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy) * 1.03;
            const angle = hit * 1.0;
            ball.vx = speed * Math.sin(angle);
            ball.vy = -Math.abs(speed * Math.cos(angle));
            enforceMinimumBallSpeed(ball);
            notePaddleContact(ball, clampedX - paddleHitCenter);
          }
        }

        for (const br of bricks) {
          if (!br.alive) continue;
          if (br.isPhase && !br.phaseTangible) continue;
          if (ball.x + BALL_R > br.x && ball.x - BALL_R < br.x + br.w &&
              ball.y + BALL_R > br.y && ball.y - BALL_R < br.y + br.h) {
            if (br.isTeleport && ball.lastPortalId === br.id && (gameTime - ball.lastPortalTime) < PORTAL_GRACE_PERIOD) {
              continue;
            }
            const prevY = prevBallY;
            const wasAbove = prevY + BALL_R <= br.y;
            const wasBelow = prevY - BALL_R >= br.y + br.h;
            const collisionOrientation = (wasAbove || wasBelow) ? 'vertical' : 'horizontal';
            const impactVx = ball.vx;
            const impactVy = ball.vy;
            const impactSpeed = Math.hypot(impactVx, impactVy);
            if (impactSpeed > 0) {
              if (collisionOrientation === 'vertical') {
                const ratio = Math.abs(impactVy) / impactSpeed;
                if (ratio <= EDGE_KISS_SIN_THRESHOLD) {
                  registerEdgeKissCandidate(ball);
                }
              } else {
                const ratio = Math.abs(impactVx) / impactSpeed;
                if (ratio <= EDGE_KISS_SIN_THRESHOLD) {
                  registerEdgeKissCandidate(ball);
                }
              }
            }
            const willBreak = br.shieldHealth <= 0 && br.hp <= 1;
            maybeRegisterTrickShot(ball, { willBreak });
            if (wasAbove || wasBelow) {
              ball.vy *= -1;
            } else {
              ball.vx *= -1;
            }

            if (br.shieldHealth > 0) {
              if (!ball.shieldHits.has(br.id)) {
                ball.shieldHits.add(br.id);
                br.shieldHealth = Math.max(0, br.shieldHealth - 1);
                br.shieldFade = 1;
                br.shieldCrackTimer = SHIELD_CRACK_DURATION;
                playShieldCrackSound();
                score += BRICK_HIT_POINTS;
                scoreEl.textContent = score;
              }
              enforceMinimumBallSpeed(ball);
              break;
            }

            applyGhostBrickEffect(br);
            applyEnergyBrickEffect(br, ball);
            let portalHandled = false;
            if (br.isTeleport) {
              portalHandled = handlePortalCollision(ball, br);
            }
            if (portalHandled) {
              enforceMinimumBallSpeed(ball);
              break;
            }
            br.hp -= 1;
            if (br.hp <= 0) {
              br.alive = false;
              awardBrickPoints(br, 1);
              handleBrickDestroyed(br, ball);
            } else {
              score += BRICK_HIT_POINTS;
              scoreEl.textContent = score;
            }
            enforceMinimumBallSpeed(ball);
            break;
          }
        }

        enforceMinimumBallSpeed(ball);
      }

      if (ballsToRemove.length) {
        balls = balls.filter(ball => !ballsToRemove.includes(ball));
      }

      if (!balls.length) {
        lives--; livesEl.textContent = lives;
        resetComboMultiplier();
        if (lives <= 0) {
          running = false;
          showOverlay('Game Over', 'Press Space to restart');
          if (!gameOverHandled) { gameOverHandled = true; maybeSubmitLeaderboard().catch(console.error); }
          window.addEventListener('keydown', restartOnce, { once: true });
        } else {
          running = false;
          showOverlay('Life Lost', 'Tap/Click or press Space to relaunch');
          balls = [createBall(paddleX + paddleWidth / 2, PADDLE_Y - BALL_R - 2, true)];
          magnetActive = false;
          magnetTimer = 0;
          magnetPulse = 0;
          magnetLockedSpeed = null;
          minimumBallSpeed = null;
        }
        return;
      }

      const remaining = bricks.reduce((acc, br) => br.alive ? acc + 1 : acc, 0);
      if (remaining === 0 && splitBars.length === 0) {
        score += 200; scoreEl.textContent = score;
        running = false;
        resetLevel(level + 1);
      }
    }

    function handleBrickDestroyed(brick, ball, options = {}) {
      const { triggeredByExplosion = false } = options;
      const specialBrick = isSpecialBrick(brick);
      if (ball) {
        increaseBallSpeedForBrickBreak(ball);
      }
      registerBrickCombo();
      if (brickGrid[brick.gridRow] && brickGrid[brick.gridRow][brick.gridCol] === brick) {
        brickGrid[brick.gridRow][brick.gridCol] = null;
      }
      if (brick.isTeleport) {
        brick.teleportActive = false;
      }
      if (triggeredByExplosion) {
        spawnBrickDebris(brick);
      }
      if (brick.isTrap) {
        activateInputInversion();
      }
      if (brick.embeddedBall && !brick.embeddedBallReleased) {
        brick.embeddedBallReleased = true;
        brick.embeddedBall = false;
        const referenceBall = ball || getReferenceBallForExplosion();
        releaseEmbeddedBall(brick, referenceBall);
      }
      if (brick.explosive && !triggeredByExplosion) {
        triggerExplosiveBrick(brick);
      }
      if (specialBrick) {
        playRandomEventSfx();
      }
    }

    function increaseBallSpeedForBrickBreak(ball) {
      const boostMultiplier = 1 + level * 0.005;
      ball.vx *= boostMultiplier;
      ball.vy *= boostMultiplier;
      const currentSpeed = Math.hypot(ball.vx, ball.vy);
      if (currentSpeed > 0) {
        minimumBallSpeed = minimumBallSpeed === null
          ? currentSpeed
          : Math.max(minimumBallSpeed, currentSpeed);
      }
    }

    function getReferenceBallForExplosion() {
      const active = balls.find(b => !b.lockedToPaddle && (b.vx || b.vy));
      return active || balls[0] || null;
    }

    function releaseEmbeddedBall(brick, sourceBall) {
      const spawnX = brick.x + brick.w / 2;
      const spawnY = brick.y + brick.h / 2;
      const newBall = createBall(spawnX, spawnY, false);
      const defaultSpeed = (6 + level * 0.8) * 0.75 * 60;
      const sourceSpeed = sourceBall ? Math.hypot(sourceBall.vx, sourceBall.vy) : 0;
      const reference = sourceBall || getReferenceBallForExplosion();
      const referenceBallSpeed = reference ? Math.hypot(reference.vx, reference.vy) : 0;
      const referenceSpeed = Math.max(defaultSpeed, sourceSpeed, referenceBallSpeed, minimumBallSpeed || 0);
      const angle = Math.PI * 0.25 + Math.random() * Math.PI * 0.5;
      const direction = Math.random() < 0.5 ? -1 : 1;
      newBall.vx = Math.cos(angle) * referenceSpeed * direction;
      newBall.vy = Math.sin(angle) * referenceSpeed;
      captureInitialBallSpeed(newBall);
      enforceMinimumBallSpeed(newBall);
      const speed = Math.hypot(newBall.vx, newBall.vy);
      if (speed > 0) {
        minimumBallSpeed = minimumBallSpeed === null
          ? speed
          : Math.max(minimumBallSpeed, speed);
      }
      balls.push(newBall);
      running = true;
    }

    function handleShieldWallCollision(ball, prevBallX, prevBallY) {
      if (!shieldWallState.active) return;
      const leftRect = getShieldWallRect('left');
      const rightRect = getShieldWallRect('right');
      if (!leftRect && !rightRect) return;

      const prevBottom = prevBallY + BALL_R;
      const currBottom = ball.y + BALL_R;
      const currTop = ball.y - BALL_R;

      const bounceFromRect = (rect, isLeft) => {
        if (!rect) return false;
        const intersects =
          ball.x + BALL_R >= rect.x &&
          ball.x - BALL_R <= rect.x + rect.w &&
          currBottom >= rect.y &&
          currTop <= rect.y + rect.h;
        if (!intersects) return false;

        const approachingFromAbove = ball.vy >= 0 && prevBottom <= rect.y + rect.h;
        if (!approachingFromAbove) return false;

        ball.y = rect.y - BALL_R - 0.5;
        const speed = Math.max(Math.hypot(ball.vx, ball.vy), SHIELD_WALL_CONFIG.minReturnSpeed);
        const upwardSpeed = Math.min(speed, Math.max(SHIELD_WALL_CONFIG.minUpwardSpeed, speed * SHIELD_WALL_CONFIG.shallowRatio));
        const horizontalSpeed = Math.sqrt(Math.max(0, speed * speed - upwardSpeed * upwardSpeed));
        const dir = isLeft ? 1 : -1;

        ball.vy = -Math.abs(upwardSpeed);
        ball.vx = dir * Math.max(horizontalSpeed, 140);

        return true;
      };

      if (bounceFromRect(leftRect, true) || bounceFromRect(rightRect, false)) {
        enforceMinimumBallSpeed(ball);
      }
    }

    function restartOnce(e) {
      if (e.code === 'Space') {
        score = 0; lives = 3; level = 1;
        scoreEl.textContent = score; livesEl.textContent = lives; levelEl.textContent = level;
        gameOverHandled = false;
        resetLevel(1);
      }
    }

    async function maybeSubmitLeaderboard() {
      let dest = `../leaderboard.html?gameId=${encodeURIComponent(GAME_ID)}`;
      try {
        const res = await fetch(`/api/leaderboard/rank?gameId=${encodeURIComponent(GAME_ID)}&score=${encodeURIComponent(score)}`, {
          headers: { 'Accept': 'application/json' }
        });
        if (res.ok) {
          const data = await res.json();
          const rank = Number(data?.rank);
          const qualifies = Number.isFinite(rank) && rank > 0 && rank <= 20;
          if (qualifies) {
            let name = prompt(`New High Score! You placed #${rank}. Enter your name (max 20 chars):`, '');
            if (name != null) {
              name = name.trim().replace(/[^\w \-'.!]/g, '').slice(0, 20);
              if (name) {
                let submitted = false;
                try {
                  await fetch('/api/leaderboard/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ gameId: GAME_ID, name, score })
                  });
                  submitted = true;
                } catch {}
                if (submitted) {
                  dest += `&highlightRank=${encodeURIComponent(rank)}`;
                }
              }
            }
          }
        }
      } catch (e) {
        console.error(e);
      } finally {
        location.href = dest;
      }
    }

    function activateMagnetUpgrade() {
      magnetActive = true;
      magnetTimer = 15;
      magnetPulse = 0;
      const referenceBall = balls.find(b => !b.lockedToPaddle && (b.vx || b.vy)) || balls[0];
      if (referenceBall) {
        const currentSpeed = Math.hypot(referenceBall.vx, referenceBall.vy);
        if (currentSpeed > 0) {
          magnetLockedSpeed = currentSpeed;
        } else if (minimumBallSpeed) {
          magnetLockedSpeed = minimumBallSpeed;
        }
      }
      showUpgradeBanner('Upgrade: Magnet Paddle!');
    }

    function showUpgradeBanner(text) {
      enqueueNotification({
        type: 'upgrade',
        tag: 'Upgrade',
        title: text,
      });
    }

    function showPortalTag() {
      enqueueNotification({
        type: 'portal',
        tag: 'Portal',
        title: 'Portal Hop!',
      });
    }

    function drawNeonGrid() {
      // subtle glow grid for retro vibe
      ctx.save();
      ctx.strokeStyle = 'rgba(0,255,255,0.05)';
      ctx.lineWidth = 1;
      const step = 40;
      for (let x=0; x<=canvas.width; x+=step) {
        ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
      }
      for (let y=0; y<=canvas.height; y+=step) {
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
      }
      ctx.restore();
    }

    function drawShieldWalls() {
      if (!shieldWallState.active) return;
      const leftRect = getShieldWallRect('left');
      const rightRect = getShieldWallRect('right');
      if (!leftRect && !rightRect) return;

      const progress = shieldWallState.duration > 0
        ? Math.max(0, Math.min(1, shieldWallState.timer / shieldWallState.duration))
        : 0;

      const drawSegment = (rect, isLeft) => {
        if (!rect) return;
        const vividAlpha = 0.55 + progress * 0.35;
        const softAlpha = 0.28 + progress * 0.25;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = Math.min(1, 0.42 + progress * 0.38);
        const grad = ctx.createLinearGradient(rect.x, rect.y, rect.x + rect.w, rect.y);
        if (isLeft) {
          grad.addColorStop(0, `rgba(0, 255, 255, ${vividAlpha})`);
          grad.addColorStop(1, `rgba(255, 62, 223, ${softAlpha})`);
        } else {
          grad.addColorStop(0, `rgba(255, 62, 223, ${softAlpha})`);
          grad.addColorStop(1, `rgba(0, 255, 255, ${vividAlpha})`);
        }
        ctx.fillStyle = grad;
        ctx.shadowColor = 'rgba(0, 255, 255, 0.65)';
        ctx.shadowBlur = 18;
        ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
        ctx.restore();
      };

      drawSegment(leftRect, true);
      drawSegment(rightRect, false);
    }

    function render() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      drawNeonGrid();
      drawWallPulses();
      drawShieldWalls();

      // Draw bricks
      for (const br of bricks) {
        if (!br.alive) continue;
        const drawX = br.x + (br.shakeOffsetX || 0);
        const drawY = br.y + (br.shakeOffsetY || 0);
        let ghostFlicker = 0;
        let ghostAlpha = 1;
        if (br.isGhost) {
          ghostFlicker = Number.isFinite(br.ghostFlicker) ? br.ghostFlicker : 0;
          ghostAlpha = Math.max(0.15, Math.min(1, GHOST_BRICK_BASE_ALPHA + ghostFlicker * GHOST_BRICK_FLICKER_AMPLITUDE));
        }
        let phaseVisibility = 1;
        if (br.isPhase) {
          const visibility = Number.isFinite(br.phaseVisibility) ? br.phaseVisibility : (br.phaseTangible ? 1 : PHASE_BRICK_INTANGIBLE_ALPHA);
          phaseVisibility = Math.max(0.05, Math.min(1, visibility));
        }
        ctx.save();
        ctx.globalAlpha = ghostAlpha * phaseVisibility;
        ctx.drawImage(br.img, drawX, drawY, br.w, br.h);
        ctx.restore();
        if (br.isGhost) {
          const centerX = drawX + br.w / 2;
          const centerY = drawY + br.h / 2;
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = 0.2 + ghostFlicker * 0.35;
          const innerRadius = Math.max(6, Math.min(br.w, br.h) * 0.25);
          const outerRadius = Math.max(br.w, br.h) * 0.75;
          const gradient = ctx.createRadialGradient(centerX, centerY, innerRadius, centerX, centerY, outerRadius);
          gradient.addColorStop(0, 'rgba(180, 255, 255, 0.85)');
          gradient.addColorStop(0.7, 'rgba(120, 200, 255, 0.25)');
          gradient.addColorStop(1, 'rgba(120, 200, 255, 0)');
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(centerX, centerY, outerRadius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        if (br.isPhase) {
          const pulse = Number.isFinite(br.phaseGlowPulse) ? br.phaseGlowPulse : 0;
          const centerX = drawX + br.w / 2;
          const centerY = drawY + br.h / 2;
          const overlayAlpha = br.phaseTangible ? 0.35 + pulse * 0.2 : 0.55 + pulse * 0.35;
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = Math.min(1, overlayAlpha);
          const innerRadius = Math.max(6, Math.min(br.w, br.h) * 0.22);
          const outerRadius = Math.max(br.w, br.h) * (br.phaseTangible ? 0.9 : 1.3);
          const gradient = ctx.createRadialGradient(centerX, centerY, innerRadius, centerX, centerY, outerRadius);
          gradient.addColorStop(0, br.phaseTangible ? 'rgba(180, 255, 255, 0.9)' : 'rgba(120, 220, 255, 0.9)');
          gradient.addColorStop(0.55, br.phaseTangible ? 'rgba(120, 200, 255, 0.35)' : 'rgba(80, 160, 255, 0.45)');
          gradient.addColorStop(1, 'rgba(60, 140, 255, 0)');
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(centerX, centerY, outerRadius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          if (!br.phaseTangible) {
            ctx.save();
            ctx.globalAlpha = Math.min(0.5, 0.18 + pulse * 0.25);
            ctx.strokeStyle = 'rgba(80, 160, 255, 0.95)';
            ctx.setLineDash([6, 6]);
            ctx.lineDashOffset = (pulse * 12 + frameCounter * 0.6) % 12;
            ctx.lineWidth = 2;
            ctx.strokeRect(drawX - 2, drawY - 2, br.w + 4, br.h + 4);
            ctx.restore();
          }
        }
        if (br.isTeleport) {
          if (br.teleportFlashTimer > 0) {
            const flashNormalized = Math.max(0, Math.min(1, br.teleportFlashTimer / TELEPORT_FLASH_DURATION));
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = TELEPORT_FLASH_MAX_ALPHA * flashNormalized;
            const gradient = ctx.createRadialGradient(
              drawX + br.w / 2,
              drawY + br.h / 2,
              Math.max(8, br.w * 0.2),
              drawX + br.w / 2,
              drawY + br.h / 2,
              Math.max(br.w, br.h) * 0.9
            );
            gradient.addColorStop(0, 'rgba(0, 255, 255, 0.8)');
            gradient.addColorStop(1, 'rgba(0, 255, 255, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(drawX + br.w / 2, drawY + br.h / 2, Math.max(br.w, br.h), 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }
        if (br.isEnergy) {
          const glowPhase = Number.isFinite(br.energyGlowPhase) ? br.energyGlowPhase : 0;
          const basePulse = 0.55 + Math.sin(glowPhase * 2.1) * 0.35;
          const boost = Math.max(0, br.energyGlowBoost || 0);
          const glowStrength = Math.min(1, basePulse * 0.6 + boost * 0.6);
          const centerX = drawX + br.w / 2;
          const centerY = drawY + br.h / 2;
          const innerRadius = Math.max(6, Math.min(br.w, br.h) * 0.28);
          const outerRadius = Math.max(br.w, br.h) * (1.1 + boost * 0.5);
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = 0.2 + glowStrength * 0.45;
          const gradient = ctx.createRadialGradient(centerX, centerY, innerRadius, centerX, centerY, outerRadius);
          gradient.addColorStop(0, 'rgba(0, 255, 255, 0.85)');
          gradient.addColorStop(0.5, 'rgba(146, 80, 255, 0.4)');
          gradient.addColorStop(1, 'rgba(255, 62, 223, 0)');
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(centerX, centerY, outerRadius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          if (Array.isArray(br.energyArcs) && br.energyArcs.length) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (const arc of br.energyArcs) {
              if (!arc || !arc.points || arc.points.length < 2) continue;
              const lifeRatio = arc.maxLife > 0 ? Math.max(0, Math.min(1, arc.life / arc.maxLife)) : 0;
              const fade = Math.pow(lifeRatio, 0.6);
              const baseAlpha = (arc.alpha || 0.6) * fade * (0.6 + glowStrength * 0.8);
              if (baseAlpha <= 0.01) continue;
              const lineWidth = Math.max(1, (arc.width || 1.4) + boost * 1.1);
              ctx.lineWidth = lineWidth;
              ctx.strokeStyle = `rgba(0, 255, 255, ${baseAlpha})`;
              ctx.beginPath();
              ctx.moveTo(arc.points[0].x, arc.points[0].y);
              for (let i = 1; i < arc.points.length; i++) {
                const p = arc.points[i];
                ctx.lineTo(p.x, p.y);
              }
              ctx.stroke();
              ctx.lineWidth = Math.max(0.8, lineWidth * 0.55);
              ctx.strokeStyle = `rgba(255, 255, 255, ${baseAlpha * 0.75})`;
              ctx.beginPath();
              ctx.moveTo(arc.points[0].x, arc.points[0].y);
              for (let i = 1; i < arc.points.length; i++) {
                const p = arc.points[i];
                ctx.lineTo(p.x, p.y);
              }
              ctx.stroke();
            }
            ctx.restore();
          }

          ctx.save();
          ctx.globalAlpha = 0.25 + glowStrength * 0.35;
          ctx.strokeStyle = `rgba(0, 255, 255, ${0.45 + glowStrength * 0.35})`;
          ctx.lineWidth = 2;
          ctx.strokeRect(drawX - 1.5, drawY - 1.5, br.w + 3, br.h + 3);
          ctx.restore();
        }
        if (br.isTrap) {
          const glowAlpha = Math.max(0, Math.min(1, br.trapGlowPulse || 0));
          const centerX = drawX + br.w / 2;
          const centerY = drawY + br.h / 2;
          if (glowAlpha > 0.01) {
            const innerRadius = Math.max(6, Math.min(br.w, br.h) * 0.32);
            const outerRadius = Math.max(br.w, br.h) * 1.05;
            const gradient = ctx.createRadialGradient(centerX, centerY, innerRadius, centerX, centerY, outerRadius);
            gradient.addColorStop(0, 'rgba(255, 140, 140, 0.9)');
            gradient.addColorStop(0.7, 'rgba(255, 90, 90, 0.35)');
            gradient.addColorStop(1, 'rgba(255, 120, 120, 0)');
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = glowAlpha;
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, outerRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
          ctx.save();
          const fontSize = Math.round(br.h * 0.62);
          ctx.font = `bold ${fontSize}px "Press Start 2P", "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#ffe6e6';
          ctx.shadowColor = 'rgba(255, 120, 120, 0.9)';
          ctx.shadowBlur = 12 + glowAlpha * 24;
          ctx.fillText('☠', centerX, centerY + br.h * 0.02);
          ctx.shadowBlur = 0;
          ctx.strokeStyle = 'rgba(80, 0, 0, 0.4)';
          ctx.lineWidth = 1.4;
          ctx.strokeText('☠', centerX, centerY + br.h * 0.02);
          ctx.restore();
        }
        if (br.explosive) {
          const glowPulse = Math.max(0, Math.min(1, br.explosiveGlowPulse || 0));
          if (glowPulse > 0.01) {
            const glowStrength = EXPLOSIVE_GLOW_MIN_ALPHA + glowPulse * (EXPLOSIVE_GLOW_MAX_ALPHA - EXPLOSIVE_GLOW_MIN_ALPHA);
            const glowX = drawX + br.w / 2;
            const glowY = drawY + br.h / 2;
            const innerRadius = Math.max(6, Math.min(br.w, br.h) * 0.3);
            const outerRadius = Math.max(br.w, br.h) * 1.1;
            const gradient = ctx.createRadialGradient(glowX, glowY, innerRadius, glowX, glowY, outerRadius);
            gradient.addColorStop(0, 'rgba(255, 120, 120, 1)');
            gradient.addColorStop(0.45, 'rgba(255, 60, 60, 0.7)');
            gradient.addColorStop(1, 'rgba(255, 0, 0, 0)');
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = glowStrength;
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(glowX, glowY, outerRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.globalAlpha = glowStrength * 0.8;
            ctx.fillStyle = 'rgba(255, 40, 40, 0.85)';
            ctx.fillRect(drawX, drawY, br.w, br.h);
            ctx.restore();

            if (glowPulse > 0.65) {
              ctx.save();
              ctx.globalAlpha = glowStrength * 0.75;
              ctx.strokeStyle = 'rgba(255, 160, 160, 1)';
              ctx.lineWidth = 2;
              ctx.strokeRect(drawX - 1, drawY - 1, br.w + 2, br.h + 2);
              ctx.restore();
            }
          }
        }
        if (br.maxShieldHealth > 0 && (br.shieldHealth > 0 || br.shieldFade > 0.01)) {
          const pulse = 0.75 + Math.sin(br.shieldGlowPhase * 2) * 0.25;
          const baseIntensity = br.shieldHealth > 0 ? 1 : br.shieldFade;

          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          const overlayStrength = br.shieldHealth > 0 ? 0.36 : 0.26 * br.shieldFade;
          ctx.globalAlpha = Math.min(0.6, overlayStrength * pulse);
          const overlayGradient = ctx.createLinearGradient(drawX, drawY, drawX + br.w, drawY + br.h);
          overlayGradient.addColorStop(0, 'rgba(0, 255, 255, 0.15)');
          overlayGradient.addColorStop(0.5, 'rgba(0, 200, 255, 0.55)');
          overlayGradient.addColorStop(1, 'rgba(0, 255, 255, 0.15)');
          ctx.fillStyle = overlayGradient;
          ctx.fillRect(drawX, drawY, br.w, br.h);
          ctx.restore();

          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          const glowX = drawX + br.w / 2;
          const glowY = drawY + br.h / 2;
          const outerRadius = Math.max(br.w, br.h) * 0.85;
          const innerRadius = Math.max(4, Math.min(br.w, br.h) * 0.2);
          const glowGradient = ctx.createRadialGradient(glowX, glowY, innerRadius, glowX, glowY, outerRadius);
          glowGradient.addColorStop(0, 'rgba(0, 255, 255, 0.8)');
          glowGradient.addColorStop(0.45, 'rgba(0, 200, 255, 0.45)');
          glowGradient.addColorStop(1, 'rgba(0, 255, 255, 0)');
          const glowAlpha = Math.min(0.55, (0.35 + 0.25 * Math.sin(br.shieldGlowPhase * 3)) * baseIntensity);
          ctx.globalAlpha = glowAlpha;
          ctx.fillStyle = glowGradient;
          ctx.beginPath();
          ctx.arc(glowX, glowY, outerRadius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          const edgeAlpha = Math.min(0.85, (0.55 + 0.25 * Math.sin(br.shieldGlowPhase * 4)) * baseIntensity * pulse);
          ctx.strokeStyle = `rgba(0, 255, 255, ${edgeAlpha})`;
          ctx.lineWidth = 2.4 + 1.1 * (1 - Math.cos(br.shieldGlowPhase * 2));
          ctx.shadowColor = `rgba(0, 255, 255, ${0.5 * baseIntensity})`;
          ctx.shadowBlur = 6 + 10 * baseIntensity;
          ctx.strokeRect(drawX - 1.5, drawY - 1.5, br.w + 3, br.h + 3);
          ctx.restore();

          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          const shimmerAlpha = Math.min(0.35, 0.25 * baseIntensity);
          ctx.globalAlpha = shimmerAlpha;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
          ctx.lineWidth = 1;
          const shimmerOffset = (Math.sin(br.shieldGlowPhase * 6 + frameCounter * 0.08) + 1) / 2;
          const shimmerY = drawY + shimmerOffset * br.h;
          ctx.beginPath();
          ctx.moveTo(drawX + 2, shimmerY);
          ctx.lineTo(drawX + br.w - 2, shimmerY - br.h * 0.3);
          ctx.stroke();
          ctx.restore();
        }
        if (br.crackTimer > 0) {
          ctx.save();
          const crackIntensity = Math.min(1, br.crackTimer / EXPLOSIVE_CRACK_DURATION);
          ctx.strokeStyle = `rgba(255, 62, 223, ${0.55 * crackIntensity})`;
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(drawX + br.w * 0.18, drawY + br.h * 0.22);
          ctx.lineTo(drawX + br.w * 0.38, drawY + br.h * 0.5);
          ctx.lineTo(drawX + br.w * 0.3, drawY + br.h * 0.82);
          ctx.moveTo(drawX + br.w * 0.66, drawY + br.h * 0.18);
          ctx.lineTo(drawX + br.w * 0.52, drawY + br.h * 0.48);
          ctx.lineTo(drawX + br.w * 0.7, drawY + br.h * 0.78);
          ctx.stroke();
          ctx.restore();
        }
        if (br.embeddedBall && !br.embeddedBallReleased) {
          ctx.save();
          ctx.globalAlpha = 0.85;
          const glowX = drawX + br.w / 2;
          const glowY = drawY + br.h / 2;
          const gradient = ctx.createRadialGradient(glowX, glowY, 4, glowX, glowY, 18);
          gradient.addColorStop(0, 'rgba(0, 255, 255, 0.85)');
          gradient.addColorStop(1, 'rgba(0, 255, 255, 0)');
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(glowX, glowY, 18, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        if (br.shieldCrackTimer > 0) {
          ctx.save();
          const crackAlpha = Math.min(1, br.shieldCrackTimer / SHIELD_CRACK_DURATION);
          ctx.globalAlpha = crackAlpha;
          ctx.drawImage(imgBrickCrack, drawX - 6, drawY - 4, br.w + 12, br.h + 8);
          ctx.restore();
        }
      }

      renderExplosionShockwaves();
      renderBrickDebris();
      renderExplosionParticles();

      drawSpecialBar();

      // Draw paddle
      let paddleDrawWidth = paddleWidth;
      let paddleDrawHeight = PADDLE_H;
      let paddleDrawX = paddleX;
      let paddleDrawY = PADDLE_Y;
      const growthPulse = getPaddleGrowthPulse();
      if (growthPulse > 0) {
        const widthScale = 1 + growthPulse * 0.12;
        const heightScale = 1 + growthPulse * 0.08;
        paddleDrawWidth = paddleWidth * widthScale;
        paddleDrawHeight = PADDLE_H * heightScale;
        paddleDrawX = paddleX - (paddleDrawWidth - paddleWidth) / 2;
        paddleDrawY = PADDLE_Y - (paddleDrawHeight - PADDLE_H) / 2;
      }

      if (magnetActive) {
        ctx.save();
        const pulse = 0.65 + Math.sin(magnetPulse * 6) * 0.25;
        const glowSize = 24 + Math.sin(magnetPulse * 8) * 6;
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = `rgba(0, 255, 255, ${0.18 + pulse * 0.18})`;
        ctx.shadowColor = 'rgba(0, 255, 255, 0.85)';
        ctx.shadowBlur = glowSize;
        ctx.fillRect(paddleDrawX - 6, paddleDrawY - 8, paddleDrawWidth + 12, paddleDrawHeight + 16);
        ctx.restore();
      }

      if (ghostModeActive) {
        ctx.save();
        ctx.globalAlpha = GHOST_PADDLE_ALPHA;
        ctx.drawImage(imgPaddle, paddleDrawX, paddleDrawY, paddleDrawWidth, paddleDrawHeight);
        ctx.restore();
        const hitbox = getPaddleHitbox();
        const widthScale = paddleWidth > 0 ? paddleDrawWidth / paddleWidth : 1;
        const effectiveDrawWidth = hitbox.width * widthScale;
        const effectiveDrawX = paddleDrawX + (paddleDrawWidth - effectiveDrawWidth) / 2;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.28;
        const highlightHeight = paddleDrawHeight * 0.7;
        const highlightY = paddleDrawY + (paddleDrawHeight - highlightHeight) / 2;
        ctx.fillStyle = 'rgba(0, 255, 255, 0.6)';
        ctx.fillRect(effectiveDrawX, highlightY, effectiveDrawWidth, highlightHeight);
        ctx.globalAlpha = 0.18;
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.8)';
        ctx.lineWidth = 2;
        ctx.strokeRect(effectiveDrawX, highlightY, effectiveDrawWidth, highlightHeight);
        ctx.restore();
      } else {
        ctx.drawImage(imgPaddle, paddleDrawX, paddleDrawY, paddleDrawWidth, paddleDrawHeight);
      }

      for (const ball of balls) {
        if (!ball) continue;
        if (ball.energyTrailTimer > 0) {
          const normalized = Math.max(0, Math.min(1, ball.energyTrailTimer / ENERGY_TRAIL_DURATION));
          const speed = Math.hypot(ball.vx, ball.vy);
          if (speed > 1) {
            const dirX = ball.vx / speed;
            const dirY = ball.vy / speed;
            const clampedSpeed = Math.min(speed, 900);
            const baseLength = ENERGY_TRAIL_MIN_LENGTH + (clampedSpeed / 900) * (ENERGY_TRAIL_MAX_LENGTH - ENERGY_TRAIL_MIN_LENGTH);
            const trailLength = baseLength * normalized;
            const endX = ball.x - dirX * trailLength;
            const endY = ball.y - dirY * trailLength;
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = 0.25 + normalized * 0.45;
            const gradient = ctx.createLinearGradient(ball.x, ball.y, endX, endY);
            gradient.addColorStop(0, 'rgba(0, 255, 255, 0.9)');
            gradient.addColorStop(0.4, 'rgba(146, 80, 255, 0.4)');
            gradient.addColorStop(1, 'rgba(255, 62, 223, 0)');
            ctx.strokeStyle = gradient;
            ctx.lineWidth = BALL_R * 1.6;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(ball.x, ball.y);
            ctx.lineTo(endX, endY);
            ctx.stroke();
            ctx.restore();
          }
        }
      }

      for (const ball of balls) {
        ctx.drawImage(imgBall, ball.x - BALL_R*1.5, ball.y - BALL_R*1.5, BALL_R*3, BALL_R*3);
      }
    }

    function loop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;
      gameTime += dt;

      updateExplosionShockwaves(dt);
      updateBrickDebris(dt);
      updateExplosionParticles(dt);

      if (SPECIAL_BAR.hp > 0) {
        updateSpecialBarState(dt);
        if (running && !paused) {
          updateSpecialBarMovement(dt);
        }
      } else if (splitBars.length) {
        if (running && !paused) {
          updateSplitBars(dt);
        }
      }

      updateMagnet(dt);
      if (paddleBuff) {
        paddleBuff.update(dt);
      }
      if (paddleGrowTimer > 0) {
        paddleGrowTimer = Math.max(0, paddleGrowTimer - dt);
      }
      if (!paused) {
        updateWallPulse(dt);
        updateGhostMode(dt);
        updateTeleportBricks(dt);
        updateInputInversion(dt);
      }

      if (running && !paused) {
        updateComboTimer(dt);
        updateShieldWalls(dt);
        update(dt);
      }
      render();
      requestAnimationFrame(loop);
    }

    function updateMagnet(dt) {
      if (magnetActive) {
        magnetTimer -= dt;
        magnetPulse += dt;
        if (magnetTimer <= 0) {
          magnetActive = false;
          magnetTimer = 0;
          magnetLockedSpeed = null;
        }
      } else if (magnetPulse !== 0) {
        magnetPulse = 0;
        magnetLockedSpeed = null;
      }
    }

    function drawSpecialBar() {
      if (SPECIAL_BAR.hp > 0) {
        if (isSpecialBarFlashing() && !SPECIAL_BAR.flashVisible) return;
        ctx.save();
        const { x, y, w, h, hp, maxHp } = SPECIAL_BAR;
        const damageRatio = hp / maxHp;
        const alpha = damageRatio === 1 ? 0.92 : damageRatio >= 2/3 ? 0.78 : 0.62;
        const color = getSpecialBarColor();
        const grad = ctx.createLinearGradient(x, y, x + w, y);
        if (color === 'green') {
          grad.addColorStop(0, `rgba(80, 255, 140, ${alpha})`);
          grad.addColorStop(0.5, `rgba(20, 200, 120, ${alpha})`);
          grad.addColorStop(1, `rgba(120, 255, 200, ${alpha})`);
          ctx.shadowColor = 'rgba(80, 255, 180, 0.7)';
        } else {
          grad.addColorStop(0, `rgba(255, 90, 90, ${alpha})`);
          grad.addColorStop(0.5, `rgba(255, 30, 0, ${alpha})`);
          grad.addColorStop(1, `rgba(255, 160, 80, ${alpha})`);
          ctx.shadowColor = 'rgba(255, 80, 60, 0.7)';
        }
        ctx.fillStyle = grad;
        ctx.shadowBlur = 12 * damageRatio + (color === 'green' ? 6 : 0);
        ctx.fillRect(x, y, w, h);
        ctx.shadowBlur = 0;
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.strokeRect(x, y, w, h);

        // Draw crack detail as HP decreases
        if (hp <= maxHp - 1) {
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = 'rgba(255,255,255,0.35)';
          ctx.beginPath();
          ctx.moveTo(x + w * 0.22, y + h * 0.2);
          ctx.lineTo(x + w * 0.45, y + h * 0.45);
          ctx.lineTo(x + w * 0.38, y + h * 0.82);
          ctx.stroke();
        }
        if (hp <= maxHp - 2) {
          ctx.beginPath();
          ctx.moveTo(x + w * 0.68, y + h * 0.18);
          ctx.lineTo(x + w * 0.52, y + h * 0.5);
          ctx.lineTo(x + w * 0.56, y + h * 0.88);
          ctx.moveTo(x + w * 0.08, y + h * 0.62);
          ctx.lineTo(x + w * 0.28, y + h * 0.42);
          ctx.lineTo(x + w * 0.48, y + h * 0.5);
          ctx.stroke();
        }

        ctx.restore();
      } else if (splitBars.length) {
        ctx.save();
        for (const bar of splitBars) {
          if (bar.hp <= 0) continue;
          ctx.shadowColor = 'rgba(255, 80, 60, 0.55)';
          ctx.shadowBlur = 14;
          ctx.fillStyle = 'rgba(255, 70, 70, 0.9)';
          ctx.fillRect(bar.x, bar.y, bar.w, bar.h);
          ctx.shadowBlur = 0;
          ctx.strokeStyle = 'rgba(255,255,255,0.28)';
          ctx.lineWidth = 1.6;
          ctx.strokeRect(bar.x, bar.y, bar.w, bar.h);
        }
        ctx.restore();
      }
    }

    function getSpecialBarPhase() {
      return SPECIAL_BAR_PHASES[SPECIAL_BAR.stateIndex] || SPECIAL_BAR_PHASES[0];
    }

    function getSpecialBarColor() {
      return getSpecialBarPhase().color;
    }

    function isSpecialBarFlashing() {
      return getSpecialBarPhase().type === 'flash';
    }

    function isSpecialBarGreen() {
      return getSpecialBarColor() === 'green';
    }

    function updateSpecialBarState(dt) {
      if (SPECIAL_BAR.hp <= 0) return;
      const phase = getSpecialBarPhase();
      SPECIAL_BAR.stateTime += dt;
      if (phase.type === 'flash') {
        SPECIAL_BAR.flashTimer -= dt;
        if (SPECIAL_BAR.flashTimer <= 0) {
          SPECIAL_BAR.flashVisible = !SPECIAL_BAR.flashVisible;
          SPECIAL_BAR.flashTimer += SPECIAL_BAR.flashInterval;
        }
      } else {
        SPECIAL_BAR.flashVisible = true;
        SPECIAL_BAR.flashTimer = SPECIAL_BAR.flashInterval;
      }
      if (SPECIAL_BAR.stateTime >= phase.duration) {
        SPECIAL_BAR.stateIndex = (SPECIAL_BAR.stateIndex + 1) % SPECIAL_BAR_PHASES.length;
        SPECIAL_BAR.stateTime = 0;
        SPECIAL_BAR.flashTimer = SPECIAL_BAR.flashInterval;
        SPECIAL_BAR.flashVisible = true;
      }
    }

    function updateSpecialBarMovement(dt) {
      const leftBound = 16;
      const rightBound = canvas.width - SPECIAL_BAR.w - 16;
      SPECIAL_BAR.x += SPECIAL_BAR.speed * SPECIAL_BAR.dir * dt;
      if (SPECIAL_BAR.x <= leftBound) {
        SPECIAL_BAR.x = leftBound;
        SPECIAL_BAR.dir = 1;
      } else if (SPECIAL_BAR.x >= rightBound) {
        SPECIAL_BAR.x = rightBound;
        SPECIAL_BAR.dir = -1;
      }
    }

    function spawnSplitBars() {
      const baseSpeed = SPECIAL_BAR.speed * 0.95;
      const segmentWidth = SPECIAL_BAR.w * 0.45;
      const gap = Math.max(10, SPECIAL_BAR.w * 0.1);
      const center = SPECIAL_BAR.x + SPECIAL_BAR.w / 2;
      const leftStart = Math.max(16, center - gap / 2 - segmentWidth);
      const rightStart = Math.min(canvas.width - segmentWidth - 16, center + gap / 2);
      splitBars = [
        { x: leftStart, y: SPECIAL_BAR.y, w: segmentWidth, h: SPECIAL_BAR.h, dir: -1, speed: baseSpeed, hp: 1, maxHp: 1 },
        { x: rightStart, y: SPECIAL_BAR.y, w: segmentWidth, h: SPECIAL_BAR.h, dir: 1, speed: baseSpeed, hp: 1, maxHp: 1 }
      ];
    }

    function updateSplitBars(dt) {
      const leftWall = 16;
      const rightWall = canvas.width - 16;
      for (const bar of splitBars) {
        if (bar.hp <= 0) continue;
        bar.x += bar.speed * bar.dir * dt;
        if (bar.x <= leftWall) {
          bar.x = leftWall;
          bar.dir = 1;
        } else if (bar.x + bar.w >= rightWall) {
          bar.x = rightWall - bar.w;
          bar.dir = -1;
        }
      }

      if (splitBars.length >= 2) {
        const a = splitBars[0];
        const b = splitBars[1];
        let left = a;
        let right = b;
        if (a.x > b.x) {
          left = b;
          right = a;
        }
        if (left.x + left.w >= right.x) {
          const overlap = (left.x + left.w) - right.x;
          if (overlap > 0) {
            left.x -= overlap / 2;
            right.x += overlap / 2;
          }
          left.dir = -1;
          right.dir = 1;
        }
      }
      cleanupSplitBars();
    }

    function handleSpecialBarDestroyed() {
      const destroyedWhileGreen = isSpecialBarGreen();
      if (destroyedWhileGreen) {
        lives += 1;
        livesEl.textContent = lives;
        showUpgradeBanner('Bonus Life!');
      } else {
        spawnSplitBars();
        increaseBallSpeedByPercentage(0.2);
        showUpgradeBanner('Ball Speed +20%!');
      }
      playRandomEventSfx();
    }

    function increaseBallSpeedByPercentage(percent) {
      const multiplier = 1 + percent;
      for (const ball of balls) {
        if (ball.lockedToPaddle) continue;
        ball.vx *= multiplier;
        ball.vy *= multiplier;
        const newSpeed = Math.hypot(ball.vx, ball.vy);
        if (newSpeed > 0) {
          minimumBallSpeed = minimumBallSpeed === null
            ? newSpeed
            : Math.max(minimumBallSpeed, newSpeed);
        }
      }
    }

    function boostBallSpeed(ball, percent) {
      if (!ball) return;
      const speed = Math.hypot(ball.vx, ball.vy);
      if (speed <= 0) return;
      const multiplier = 1 + percent;
      const newSpeed = speed * multiplier;
      const dirX = ball.vx / speed;
      const dirY = ball.vy / speed;
      ball.vx = dirX * newSpeed;
      ball.vy = dirY * newSpeed;
      if (newSpeed > 0) {
        minimumBallSpeed = minimumBallSpeed === null
          ? newSpeed
          : Math.max(minimumBallSpeed, newSpeed);
      }
    }

    function applyGhostBrickEffect(brick) {
      if (!brick || !brick.isGhost) return;
      activateGhostMode();
    }

    function applyEnergyBrickEffect(brick, ball) {
      if (!brick || !brick.isEnergy || !ball) return;
      boostBallSpeed(ball, ENERGY_BRICK_SPEED_BOOST);
      const existingTimer = Number.isFinite(ball.energyTrailTimer) ? ball.energyTrailTimer : 0;
      ball.energyTrailTimer = Math.max(existingTimer, ENERGY_TRAIL_DURATION);
      if (!Number.isFinite(brick.energyGlowPhase)) {
        brick.energyGlowPhase = Math.random() * Math.PI * 2;
      }
      const boost = Math.max(0.6, brick.energyGlowBoost || 0);
      brick.energyGlowBoost = Math.max(boost, 1.2);
      brick.energyActivated = true;
      triggerEnergyArcBurst(brick);
    }

    function handleSplitBarsCollision(ball, prevBallX, prevBallY) {
      for (const bar of splitBars) {
        if (bar.hp <= 0) continue;
        const barTop = bar.y;
        const barBottom = bar.y + bar.h;
        const barLeft = bar.x;
        const barRight = bar.x + bar.w;
        const intersects =
          ball.x + BALL_R >= barLeft &&
          ball.x - BALL_R <= barRight &&
          ball.y + BALL_R >= barTop &&
          ball.y - BALL_R <= barBottom;
        if (!intersects) continue;

        const prevTop = prevBallY - BALL_R;
        const prevBottom = prevBallY + BALL_R;
        let verticalBounce = false;

        if (ball.vy > 0 && prevBottom <= barTop) {
          ball.y = barTop - BALL_R;
          ball.vy = -Math.abs(ball.vy);
          verticalBounce = true;
        } else if (ball.vy < 0 && prevTop >= barBottom) {
          ball.y = barBottom + BALL_R;
          ball.vy = Math.abs(ball.vy);
          verticalBounce = true;
        } else {
          if (prevBallX + BALL_R <= barLeft) {
            ball.x = barLeft - BALL_R;
          } else if (prevBallX - BALL_R >= barRight) {
            ball.x = barRight + BALL_R;
          }
          ball.vx *= -1;
        }

        if (verticalBounce) {
          const offset = (ball.x - (barLeft + bar.w / 2)) / (bar.w / 2);
          ball.vx += offset * 1.1 * 60;
        }

        enforceMinimumBallSpeed(ball);
        bar.hp = Math.max(0, bar.hp - 1);
        if (bar.hp <= 0) {
          score += 50;
          scoreEl.textContent = score;
        }
        break;
      }
      cleanupSplitBars();
    }

    function cleanupSplitBars() {
      if (!splitBars.length) return;
      splitBars = splitBars.filter(bar => bar.hp > 0);
    }

    function resizeGame() {
      const wrapStyles = getComputedStyle(wrapEl);
      const panelStyles = getComputedStyle(panelEl);
      const stageStyles = getComputedStyle(stageEl);

      const wrapPaddingX = parseFloat(wrapStyles.paddingLeft) + parseFloat(wrapStyles.paddingRight);
      const wrapPaddingY = parseFloat(wrapStyles.paddingTop) + parseFloat(wrapStyles.paddingBottom);
      const panelPaddingX = parseFloat(panelStyles.paddingLeft) + parseFloat(panelStyles.paddingRight);
      const panelPaddingY = parseFloat(panelStyles.paddingTop) + parseFloat(panelStyles.paddingBottom);
      const stagePaddingX = parseFloat(stageStyles.paddingLeft) + parseFloat(stageStyles.paddingRight);
      const stagePaddingY = parseFloat(stageStyles.paddingTop) + parseFloat(stageStyles.paddingBottom);
      const stageBorderX = parseFloat(stageStyles.borderLeftWidth) + parseFloat(stageStyles.borderRightWidth);
      const stageBorderY = parseFloat(stageStyles.borderTopWidth) + parseFloat(stageStyles.borderBottomWidth);

      const stageOffsetHeight = stageEl.offsetHeight || (canvas.height + stagePaddingY + stageBorderY);
      const panelOffsetHeight = panelEl.offsetHeight || stageOffsetHeight;
      const panelNonStageHeight = Math.max(panelOffsetHeight - stageOffsetHeight, 0);

      const stageExtrasY = stagePaddingY + stageBorderY;

      const viewportW = window.innerWidth || document.documentElement.clientWidth || canvas.width;
      const viewportH = (window.visualViewport ? window.visualViewport.height : window.innerHeight) || document.documentElement.clientHeight || canvas.height;
      const isMobile = viewportW <= 640;

      const horizontalMargin = isMobile ? 0 : 16;
      const fullScaleWrapWidth = canvas.width + stagePaddingX + stageBorderX + panelPaddingX + wrapPaddingX;
      const widthAllowance = Math.max(viewportW - horizontalMargin, 240);

      let maxWrapWidth;
      if (isMobile) {
        maxWrapWidth = viewportW;
      } else if (widthAllowance >= fullScaleWrapWidth) {
        const desktopCap = fullScaleWrapWidth + 260;
        maxWrapWidth = Math.min(widthAllowance, desktopCap);
      } else {
        maxWrapWidth = widthAllowance;
      }

      wrapEl.style.maxWidth = maxWrapWidth + 'px';
      wrapEl.style.width = '100%';

      const actualWrapWidth = wrapEl.clientWidth || maxWrapWidth;
      const availableWidth = actualWrapWidth - wrapPaddingX - panelPaddingX - stagePaddingX - stageBorderX;
      const verticalBuffer = isMobile ? 8 : 24;
      const availableHeight = viewportH - wrapPaddingY - panelNonStageHeight - stageExtrasY - verticalBuffer;

      const widthScale = availableWidth > 0 ? availableWidth / canvas.width : Number.POSITIVE_INFINITY;
      const heightScale = availableHeight > 0 ? availableHeight / canvas.height : Number.POSITIVE_INFINITY;

      let scale = Math.min(widthScale, heightScale, 1);
      if (!Number.isFinite(scale)) {
        scale = Math.min(
          widthScale === Number.POSITIVE_INFINITY ? heightScale : widthScale,
          1
        );
      }
      if (!Number.isFinite(scale) || scale <= 0) {
        const safeWidth = widthScale > 0 && Number.isFinite(widthScale) ? widthScale : 1;
        const safeHeight = heightScale > 0 && Number.isFinite(heightScale) ? heightScale : 1;
        scale = Math.min(safeWidth, safeHeight, 1);
        if (scale <= 0) scale = 0.25;
      }

      const containerInnerWidth = actualWrapWidth - wrapPaddingX - panelPaddingX;
      const stageContentMax = Math.max(containerInnerWidth - stagePaddingX - stageBorderX, 0);
      const horizontalLimit = stageContentMax > 0 ? stageContentMax : Math.max(containerInnerWidth, 0);

      function applyScale(nextScale) {
        const safeScale = Math.max(0.1, Math.min(nextScale, 1));
        const displayWidth = canvas.width * safeScale;
        const displayHeight = canvas.height * safeScale;

        canvas.style.width = `${displayWidth}px`;
        canvas.style.height = `${displayHeight}px`;

        const maxStageContentWidth = Math.min(displayWidth, horizontalLimit);
        stageEl.style.maxWidth = '100%';
        stageEl.style.width = `${maxStageContentWidth}px`;
        stageEl.style.margin = '0 auto';

        return { scale: safeScale, displayWidth, displayHeight };
      }

      let applied = applyScale(scale);

      if (!isMobile) {
        const maxIterations = 2;
        for (let i = 0; i < maxIterations; i++) {
          const panelRect = panelEl.getBoundingClientRect();
          const chromeHeight = Math.max(panelRect.height - applied.displayHeight, 0);
          const heightAllowance = viewportH - wrapPaddingY - verticalBuffer - chromeHeight;
          if (heightAllowance >= applied.displayHeight - 0.5) {
            break;
          }
          const maxHeightScale = heightAllowance > 0 ? Math.min(heightAllowance / canvas.height, 1) : 0;
          const nextScale = Math.min(applied.scale, maxHeightScale);

          if (!Number.isFinite(nextScale) || nextScale <= 0) {
            if (applied.scale <= 0.1) break;
            applied = applyScale(0.1);
            continue;
          }

          if (nextScale < applied.scale - 0.001) {
            applied = applyScale(nextScale);
            continue;
          }
          break;
        }
      }
    }

    window.updateWallPulseIntervalForLevel = updateWallPulseIntervalForLevel;

    let resizeScheduled = false;
    function scheduleResize() {
      if (resizeScheduled) return;
      resizeScheduled = true;
      window.requestAnimationFrame(() => {
        resizeScheduled = false;
        resizeGame();
      });
    }

    if ('ResizeObserver' in window) {
      const observer = new ResizeObserver(scheduleResize);
      [headerEl, hudEl, notificationBar].filter(Boolean).forEach(el => observer.observe(el));
    }

    window.addEventListener('resize', scheduleResize);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scheduleResize);
    }

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => scheduleResize());
    }

    resizeGame();
  </script>
</body>
</html>
