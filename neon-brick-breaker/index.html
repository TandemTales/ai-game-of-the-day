  <meta charset="UTF-8" />

  <title>Neon Brick Breaker - Bot Built Arcade</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../images/botbuiltarcade-icon-face.png">
  <style>
    :root {
      --gold: #FFD700;
      --teal: #00FFFF;
      --dark-bg: #0a0a12;
      --accent: #ff3edf;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: radial-gradient(circle at 50% 20%, rgba(0,255,255,0.08), transparent 50%),
                  radial-gradient(circle at 20% 80%, rgba(255,62,223,0.08), transparent 50%),
                  linear-gradient(135deg, #0a0a12 0%, #111122 100%);
      color: #F5F5DC;
      font-family: 'Press Start 2P', cursive;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 0 8px;
    }
    #wrap {
      width: 100%;
      max-width: 980px;
      padding: clamp(14px, 4vw, 24px);
      margin: 0 auto;
      transition: padding 0.2s ease;
    }
    .panel {
      background: rgba(0,0,0,0.7);
      border: 4px solid var(--gold);
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(255,215,0,0.25);
      padding: 18px;
      transition: padding 0.2s ease, border-width 0.2s ease;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .title h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 1px;
      background: linear-gradient(90deg, var(--gold), #ffa500);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .btn {
      display: inline-block;
      text-decoration: none;
      color: white;
      border: 2px solid var(--gold);
      background: linear-gradient(45deg, #5F9EA0, #4682B4);
      padding: 10px 14px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(95,158,160,0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
      font-family: 'Press Start 2P', cursive;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(95,158,160,0.6); }
    .btn:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-left: auto;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 8px 0 12px 0;
      font-size: 12px;
      color: #A7E7FF;
      flex-wrap: wrap;
      gap: 8px 16px;
    }
    .hud > div { flex: 1 1 120px; text-align: center; }

    .stage {
      position: relative;
      background: radial-gradient(circle at 50% 20%, rgba(0,255,255,0.05), rgba(0,0,0,0.2)),
                  repeating-linear-gradient( to bottom, rgba(0,255,255,0.06) 0px, rgba(0,255,255,0.06) 2px, transparent 2px, transparent 26px ),
                  radial-gradient(circle at 50% 50%, rgba(255,255,255,0.02), transparent 60%),
                  linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
                  #07070d;
      border-radius: 14px;
      border: 2px solid rgba(0,255,255,0.25);
      box-shadow: inset 0 0 30px rgba(0,255,255,0.25);
      padding: 12px;
      max-width: 100%;
      margin: 0 auto;
      transition: padding 0.2s ease, border-width 0.2s ease;
    }

    canvas { width: 100%; height: auto; display: block; background: transparent; touch-action: none; }

    #paddle-buff-tag {
      position: absolute;
      top: 18px;
      right: 24px;
      padding: 6px 12px;
      border-radius: 12px;
      border: 2px solid var(--teal);
      background: rgba(10, 10, 18, 0.75);
      color: var(--teal);
      text-shadow: 0 0 12px rgba(0, 255, 255, 0.8);
      font-size: clamp(7px, 1.2vw, 12px);
      letter-spacing: 0.8px;
      opacity: 0;
      transform: translateY(-16px) scale(0.9);
      transition: opacity 0.22s ease, transform 0.22s ease;
      pointer-events: none;
    }

    #paddle-buff-tag.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    #upgrade-banner {
      position: absolute;
      top: 22%;
      left: 50%;
      transform: translate(-50%, -20px) scale(0.9);
      font-size: clamp(6.5px, 1.5vw, 11px);
      color: var(--gold);
      text-shadow: 0 0 16px rgba(0, 255, 255, 0.8), 0 0 32px rgba(255, 62, 223, 0.6);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }

    #upgrade-banner.show {
      animation: upgradeFade 2.6s ease forwards;
    }

    @keyframes upgradeFade {
      0% {
        opacity: 0;
        transform: translate(-50%, -40px) scale(0.7);
      }
      10% {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
      70% {
        opacity: 1;
        transform: translate(-50%, 6px) scale(1.04);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, 40px) scale(0.92);
      }
    }

    .overlay {
      position: absolute;
      inset: 12px;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 10px;
      background: rgba(0,0,0,0.6);
      border: 2px dashed rgba(255,215,0,0.4);
      touch-action: none;
    }
    .overlay.show { display: flex; }
    .overlay h2 { margin: 0 0 12px 0; font-size: 18px; color: var(--gold); }
    .overlay p { margin: 4px 0; font-size: 12px; color: #9fd; }

    .controls { margin-top: 10px; font-size: 11px; color: #8ec; opacity: 0.9; }

    @media (max-width: 640px) {
      body {
        align-items: stretch;
        justify-content: flex-start;
        padding: 6px;
      }

      #wrap {
        max-width: none;
        padding: 8px;
      }

      .panel {
        padding: 14px;
        border-width: 3px;
      }

      header {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      .actions {
        width: 100%;
        justify-content: center;
      }

      .actions .btn {
        width: 100%;
        text-align: center;
        font-size: 11px;
        padding: 10px;
      }

      .hud {
        font-size: 11px;
        gap: 6px 10px;
      }

      .hud > div {
        flex: 1 1 80px;
      }

      .stage {
        padding: 6px;
        border-width: 1.5px;
      }
    }

    @media (max-width: 560px) {
      .title h1 { font-size: 18px; }
      .btn {
        font-size: 10px;
        padding: 8px 10px;
      }
    }

    @media (max-height: 640px) {
      body { align-items: flex-start; padding-top: 16px; }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div class="panel">
      <header>
        <div class="title">
          <img src="../images/botbuiltarcade-icon-face.png" alt="BotBuilt" width="36" height="36" style="border-radius:50%; border:2px solid var(--gold)">
          <div>
            <h1>Neon Brick Breaker</h1>
          </div>
        </div>
        <div class="actions">
          <button class="btn" id="mute-btn" type="button" aria-pressed="false">🔇 Mute</button>
          <a class="btn" href="../index.html">⟵ Back to Home</a>
        </div>
      </header>

      <div class="hud">
        <div>Score: <span id="score">0</span></div>
        <div>Level: <span id="level">1</span></div>
        <div>Lives: <span id="lives">3</span></div>
      </div>

      <div class="stage">
        <canvas id="game" width="900" height="600"></canvas>
        <div id="upgrade-banner"></div>
        <div id="paddle-buff-tag" aria-hidden="true">Paddle Engaged</div>
        <div class="overlay" id="overlay">
          <div>
            <h2 id="ov-title">Neon Brick Breaker</h2>
            <p id="ov-sub">Tap/Click or press Space to launch</p>
            <div class="controls">Move: Arrow Keys / A & D / Drag. Pause: P</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../src/neonBrickBreaker/paddleBuff.js"></script>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Assets
    const imgPaddle = new Image(); imgPaddle.src = 'assets/neon_paddle.svg';
    const imgBall = new Image();   imgBall.src   = 'assets/neon_ball.svg';
    const imgBrick1 = new Image(); imgBrick1.src = 'assets/neon_brick_blue.svg';
    const imgBrick2 = new Image(); imgBrick2.src = 'assets/neon_brick_pink.svg';
    const imgBrickCrack = new Image(); imgBrickCrack.src = 'assets/neon_brick_shield_crack.svg';

    let assetsLoaded = 0;
    const needed = 5;
    [imgPaddle, imgBall, imgBrick1, imgBrick2, imgBrickCrack].forEach(img => {
      img.addEventListener('load', () => {
        assetsLoaded++;
        if (assetsLoaded === needed) init();
      });
    });

    // HUD
    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const livesEl = document.getElementById('lives');
    const overlayEl = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const ovSub = document.getElementById('ov-sub');
    const wrapEl = document.getElementById('wrap');
    const panelEl = document.querySelector('.panel');
    const stageEl = document.querySelector('.stage');
    const headerEl = document.querySelector('header');
    const hudEl = document.querySelector('.hud');
    const upgradeBanner = document.getElementById('upgrade-banner');
    const paddleBuffTag = document.getElementById('paddle-buff-tag');
    const muteBtn = document.getElementById('mute-btn');

    if (paddleBuffTag) {
      paddleBuffTag.setAttribute('aria-hidden', 'true');
    }

    const SOUNDTRACK_FILES = [
      'assets/NBB_soundtrack01.mp3',
      'assets/NBB_soundtrack02.mp3',
      'assets/NBB_soundtrack03.mp3',
      'assets/NBB_soundtrack04.mp3'
    ].filter(src => src && src.toLowerCase().includes('soundtrack'));

    const backgroundAudio = new Audio();
    backgroundAudio.preload = 'auto';
    backgroundAudio.loop = false;
    backgroundAudio.volume = 0.45;

    let soundtrackQueue = [];
    let soundtrackStarted = false;
    let isMuted = false;

    function shuffleTracks(list) {
      const arr = list.slice();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function refreshSoundtrackQueue() {
      soundtrackQueue = shuffleTracks(SOUNDTRACK_FILES);
    }

    function playNextTrack() {
      if (!SOUNDTRACK_FILES.length) return;
      if (!soundtrackQueue.length) refreshSoundtrackQueue();
      const nextSrc = soundtrackQueue.shift();
      if (!nextSrc) return;
      backgroundAudio.src = nextSrc;
      backgroundAudio.currentTime = 0;
      backgroundAudio.muted = isMuted;
      const playPromise = backgroundAudio.play();
      if (playPromise) {
        playPromise.catch(() => {
          soundtrackStarted = false;
          if (!soundtrackQueue.includes(nextSrc)) {
            soundtrackQueue.unshift(nextSrc);
          }
        });
      }
    }

    backgroundAudio.addEventListener('ended', playNextTrack);

    function ensureSoundtrackStarted() {
      if (soundtrackStarted || !SOUNDTRACK_FILES.length) return;
      soundtrackStarted = true;
      playNextTrack();
    }

    function updateMuteButton() {
      if (!muteBtn) return;
      muteBtn.textContent = isMuted ? '🔊 Unmute' : '🔇 Mute';
      muteBtn.setAttribute('aria-pressed', String(isMuted));
    }

    updateMuteButton();

    const ShieldAudioContext = window.AudioContext || window.webkitAudioContext || null;
    const shieldAudioCtx = ShieldAudioContext ? new ShieldAudioContext({ latencyHint: 'interactive' }) : null;

    function resumeShieldAudio() {
      if (!shieldAudioCtx) return;
      if (shieldAudioCtx.state === 'suspended') {
        shieldAudioCtx.resume().catch(() => {});
      }
    }

    function playShieldCrackSound() {
      if (!shieldAudioCtx || isMuted) return;
      resumeShieldAudio();
      const now = shieldAudioCtx.currentTime;
      const osc = shieldAudioCtx.createOscillator();
      const gain = shieldAudioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(760, now);
      osc.frequency.exponentialRampToValueAtTime(1320, now + 0.12);
      gain.gain.setValueAtTime(0.26, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      osc.connect(gain).connect(shieldAudioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.32);
    }

    function primeAudio() {
      resumeShieldAudio();
      ensureSoundtrackStarted();
    }

    if (muteBtn) {
      muteBtn.addEventListener('click', () => {
        isMuted = !isMuted;
        backgroundAudio.muted = isMuted;
        updateMuteButton();
        if (!isMuted) {
          primeAudio();
        }
      });
    }

    // Game constants (canvas is 900x600 logical)
    const PADDLE_CONFIG = {
      baseWidth: 200,
      height: 28,
      growthFactor: 1.5,
    };
    const PADDLE_Y = 560;
    const PADDLE_H = PADDLE_CONFIG.height;
    const PADDLE_GROW_ANIM_TIME = 0.35;

    const BALL_R = 16; // ball image ~48 px, we will scale

    const BRICK_W = 110, BRICK_H = 30, BRICK_GAP = 10;
    const BRICK_ROWS_START = 4, BRICK_COLS = 7;

    const BRICK_BASE_POINTS = 50;
    const BRICK_HIT_POINTS = 20;
    const SHIELDED_BRICK_MULTIPLIER = 1.5;
    const TELEPORT_BRICK_INTERVAL = 1.0;
    const TELEPORT_FLASH_DURATION = 0.3;
    const TELEPORT_FLASH_MAX_ALPHA = 0.45;
    const EXPLOSIVE_NEIGHBOR_CHANCE = 0.5;
    const EXPLOSIVE_POINT_RATIO = 0.5;
    const EXPLOSIVE_CRACK_DURATION = 0.65;
    const EXPLOSION_PARTICLE_COUNT = 24;
    const EXPLOSION_PARTICLE_LIFE = 0.55;
    const EXPLOSION_PARTICLE_BASE_RADIUS = 16;
    const EXPLOSION_PARTICLE_RADIUS_VARIANCE = 26;
    const EXPLOSION_SHOCKWAVE_LIFE = 0.4;
    const EXPLOSION_SHOCKWAVE_MAX_RADIUS = 150;
    const BRICK_SHAKE_DURATION = 0.3;
    const BRICK_SHAKE_INTENSITY = 6;
    const BRICK_SHAKE_FREQUENCY = 46;
    const EXPLOSIVE_GLOW_SPEED = 3.4;
    const EXPLOSIVE_GLOW_MIN_ALPHA = 0.18;
    const EXPLOSIVE_GLOW_MAX_ALPHA = 0.55;
    const EXPLOSIVE_WARNING_INTERVAL_MIN = 1.6;
    const EXPLOSIVE_WARNING_INTERVAL_MAX = 3.4;
    const EXPLOSIVE_WARNING_SHAKE_MULTIPLIER = 0.65;
    const EXPLOSION_DEBRIS_COUNT = 16;
    const EXPLOSION_DEBRIS_LIFE = 0.65;
    const SHIELDED_BASE_CHANCE = 0.2;
    const SHIELDED_LEVEL_BONUS = 0.03;
    const SHIELDED_MAX_CHANCE = 0.45;
    const SHIELD_CRACK_DURATION = 0.35;

    const SPECIAL_BAR_PHASES = [
      { color: 'red', type: 'solid', duration: 4 },
      { color: 'green', type: 'flash', duration: 0.8 },
      { color: 'green', type: 'solid', duration: 2 },
      { color: 'red', type: 'flash', duration: 0.8 },
    ];

    const SPECIAL_BAR = {
      w: 180,
      h: 24,
      x: 0,
      y: 42,
      speed: 3.4 * 60,
      dir: 1,
      maxHp: 1,
      hp: 1,
      stateIndex: 0,
      stateTime: 0,
      flashTimer: 0.12,
      flashInterval: 0.12,
      flashVisible: true
    };

    let splitBars = [];

    // Game state
    let running = false, paused = false;
    let score = 0, level = 1, lives = 3;
    let paddleWidth = PADDLE_CONFIG.baseWidth;
    let paddleGrowTimer = 0;
    let paddleX = (canvas.width - paddleWidth) / 2;
    let balls = [];
    let minimumBallSpeed = null;
    let bricks = [];
    let brickGrid = [];
    let brickGridLeft = 0;
    let brickGridTop = 0;
    let brickIdCounter = 0;
    let frameCounter = 0;
    let lastTime = 0;
    let magnetActive = false;
    let magnetTimer = 0;
    let magnetPulse = 0;
    let magnetLockedSpeed = null;
    const explosionParticles = [];
    const explosionShockwaves = [];
    const brickDebrisParticles = [];

    const paddleBuff = typeof createPaddleSizeBuffManager === 'function'
      ? createPaddleSizeBuffManager({
          baseWidth: PADDLE_CONFIG.baseWidth,
          growthFactor: PADDLE_CONFIG.growthFactor,
          onWidthChange: handlePaddleWidthChange,
        })
      : null;

    const COMBO_SETTINGS = {
      decayWindow: 5,
    };

    const comboState = {
      multiplier: 0,
      timer: 0,
    };

    const input = { left:false, right:false };
    // Leaderboard integration
    const GAME_ID = 'neon-brick-breaker';
    let gameOverHandled = false;

    function init() {
      resetLevel(1);
      showOverlay('Neon Brick Breaker', 'Tap/Click or press Space to launch');
      render();
      lastTime = 0;
      requestAnimationFrame(loop);
      attachControls();
      resizeGame();
    }

    function attachControls() {
      window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
        if (e.code === 'Space') launch();
        if (e.code === 'KeyP') togglePause();
        primeAudio();
      });
      window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
      });
      function movePaddle(e) {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        // Convert to canvas space
        const scale = canvas.width / rect.width;
        const cx = x * scale;
        paddleX = Math.max(0, Math.min(canvas.width - paddleWidth, cx - paddleWidth / 2));
        updateLockedBallsPosition();
      }
      [canvas, overlayEl].forEach(el => {
        el.addEventListener('pointerdown', (e) => { movePaddle(e); launch(); primeAudio(); });
        el.addEventListener('pointermove', movePaddle);
      });
    }

    function togglePause() {
      paused = !paused;
      if (paused) {
        showOverlay('Paused', 'Press P to resume');
      } else {
        hideOverlay();
        lastTime = performance.now();
      }
    }

    function showOverlay(title, sub) {
      ovTitle.textContent = title;
      ovSub.textContent = sub;
      overlayEl.classList.add('show');
    }
    function hideOverlay(){ overlayEl.classList.remove('show'); }

    function createBall(x, y, lockedToPaddle = false) {
      return {
        x,
        y,
        vx: 0,
        vy: 0,
        lockedToPaddle,
        shieldHitFrame: -1,
        shieldHits: new Set(),
      };
    }

    function handlePaddleWidthChange(newWidth, previousWidth = paddleWidth) {
      const prevWidth = Number.isFinite(previousWidth) ? previousWidth : paddleWidth;
      const center = paddleX + prevWidth / 2;
      paddleWidth = newWidth;
      paddleX = Math.max(0, Math.min(canvas.width - paddleWidth, center - paddleWidth / 2));
      updateLockedBallsPosition();
      if (newWidth > PADDLE_CONFIG.baseWidth + 0.01) {
        paddleGrowTimer = PADDLE_GROW_ANIM_TIME;
      } else if (newWidth < prevWidth - 0.01) {
        paddleGrowTimer = 0;
      }
      if (paddleBuffTag) {
        if (newWidth > PADDLE_CONFIG.baseWidth + 0.01) {
          paddleBuffTag.classList.add('show');
          paddleBuffTag.setAttribute('aria-hidden', 'false');
        } else {
          paddleBuffTag.classList.remove('show');
          paddleBuffTag.setAttribute('aria-hidden', 'true');
        }
      }
    }

    function updateLockedBallsPosition() {
      for (const ball of balls) {
        if (ball.lockedToPaddle) {
          ball.x = paddleX + paddleWidth / 2;
          ball.y = PADDLE_Y - BALL_R - 2;
        }
      }
    }

    function captureInitialBallSpeed(ball) {
      if (minimumBallSpeed === null) {
        const speed = Math.hypot(ball.vx, ball.vy);
        if (speed > 0) minimumBallSpeed = speed;
      }
    }

    function enforceMinimumBallSpeed(ball) {
      if (minimumBallSpeed === null) return;
      const currentSpeed = Math.hypot(ball.vx, ball.vy);
      if (currentSpeed === 0) return;
      if (currentSpeed < minimumBallSpeed) {
        const scale = minimumBallSpeed / currentSpeed;
        ball.vx *= scale;
        ball.vy *= scale;
      }
    }

    function registerBrickCombo() {
      comboState.multiplier += 1;
      comboState.timer = COMBO_SETTINGS.decayWindow;
      if (paddleBuff) {
        paddleBuff.handleComboChange(comboState.multiplier);
      }
    }

    function resetComboMultiplier() {
      if (comboState.multiplier !== 0 || comboState.timer !== 0) {
        comboState.multiplier = 0;
        comboState.timer = 0;
      }
      if (paddleBuff) {
        paddleBuff.handleComboChange(0);
      }
    }

    function updateComboTimer(dt) {
      if (comboState.multiplier <= 0) return;
      comboState.timer -= dt;
      if (comboState.timer <= 0) {
        comboState.multiplier = 0;
        comboState.timer = 0;
        if (paddleBuff) {
          paddleBuff.handleComboChange(0);
        }
      }
    }

    function launchFromPaddle(ball, servingRight = Math.random() > 0.5) {
      ball.x = paddleX + paddleWidth / 2;
      ball.y = PADDLE_Y - BALL_R - 2;
      const angle = (Math.random()*0.5 + 0.8) * (servingRight ? 1 : -1);
      const baseSpeed = (6 + level * 0.8) * 0.75 * 60;
      const levelSpeedMultiplier = 1 + Math.max(0, level - 1) * 0.02;
      const speed = baseSpeed * levelSpeedMultiplier;
      ball.vx = Math.cos(angle) * speed;
      ball.vy = -Math.abs(Math.sin(angle) * speed) - 120;
      ball.lockedToPaddle = false;
      captureInitialBallSpeed(ball);
      enforceMinimumBallSpeed(ball);
      running = true;
    }

    function resetLevel(n) {
      level = n;
      levelEl.textContent = level;
      const rows = BRICK_ROWS_START + Math.floor((level-1)%4);
      const topOffset = 80;
      const totalWidth = BRICK_COLS*BRICK_W + (BRICK_COLS-1)*BRICK_GAP;
      const leftOffset = (canvas.width - totalWidth)/2;
      brickGridLeft = leftOffset;
      brickGridTop = topOffset;
      const baseShieldChance = Math.min(
        SHIELDED_MAX_CHANCE,
        SHIELDED_BASE_CHANCE + Math.max(0, level - 1) * SHIELDED_LEVEL_BONUS
      );
      bricks = [];
      brickGrid = [];
      brickIdCounter = 0;
      frameCounter = 0;
      for (let r=0; r<rows; r++) {
        if (!brickGrid[r]) {
          brickGrid[r] = [];
        }
        for (let c=0; c<BRICK_COLS; c++) {
          const rowBonus = (rows - r) / rows * 0.06;
          const shieldChance = Math.min(SHIELDED_MAX_CHANCE, baseShieldChance + rowBonus);
          const shielded = Math.random() < shieldChance;
          const maxShieldHealth = shielded ? 1 : 0;
          const brickHp = 1;
          const brick = {
            id: brickIdCounter++,
            x: leftOffset + c*(BRICK_W+BRICK_GAP),
            y: topOffset + r*(BRICK_H+BRICK_GAP),
            w: BRICK_W,
            h: BRICK_H,
            hp: brickHp,
            img: (r%2===0) ? imgBrick1 : imgBrick2,
            alive: true,
            embeddedBall: false,
            embeddedBallReleased: false,
            basePoints: BRICK_BASE_POINTS,
            shieldHealth: maxShieldHealth,
            maxShieldHealth,
            shieldFade: maxShieldHealth > 0 ? 1 : 0,
            shieldGlowPhase: Math.random() * Math.PI * 2,
            shieldCrackTimer: 0,
            gridRow: r,
            gridCol: c,
            explosive: false,
            explosiveGlowPhase: Math.random() * Math.PI * 2,
            explosiveGlowPulse: 0,
            explosiveWarningTimer: 0,
            lastExplosionFrame: -1,
            crackTimer: 0,
            shakeTimer: 0,
            shakeIntensity: 0,
            shakePhase: Math.random() * Math.PI * 2,
            shakeOffsetX: 0,
            shakeOffsetY: 0,
            isTeleport: false,
            teleportActive: false,
            teleportTimer: 0,
            teleportFlashTimer: 0,
          };
          bricks.push(brick);
          brickGrid[r][c] = brick;
        }
      }

      assignTeleportBricks();
      assignExplosiveBricks();
      assignEmbeddedBalls();
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      resetComboMultiplier();
      if (paddleBuff) {
        paddleBuff.reset();
        paddleWidth = paddleBuff.getCurrentWidth();
      } else {
        paddleWidth = PADDLE_CONFIG.baseWidth;
        paddleGrowTimer = 0;
        if (paddleBuffTag) {
          paddleBuffTag.classList.remove('show');
          paddleBuffTag.setAttribute('aria-hidden', 'true');
        }
      }
      paddleX = (canvas.width - paddleWidth) / 2;
      balls = [createBall(paddleX + paddleWidth / 2, PADDLE_Y - BALL_R - 2, true)];
      running = false; paused = false;
      minimumBallSpeed = null;
      SPECIAL_BAR.x = (canvas.width - SPECIAL_BAR.w) / 2;
      SPECIAL_BAR.dir = Math.random() > 0.5 ? 1 : -1;
      SPECIAL_BAR.speed = (3.4 + Math.min(level - 1, 6) * 0.35) * 60;
      SPECIAL_BAR.hp = SPECIAL_BAR.maxHp;
      SPECIAL_BAR.stateIndex = 0;
      SPECIAL_BAR.stateTime = 0;
      SPECIAL_BAR.flashTimer = SPECIAL_BAR.flashInterval;
      SPECIAL_BAR.flashVisible = true;
      splitBars = [];
      showOverlay('Level ' + level, 'Tap/Click or press Space to launch');
      magnetActive = false;
      magnetTimer = 0;
      magnetPulse = 0;
      magnetLockedSpeed = null;
      resizeGame();
    }

    function assignEmbeddedBalls() {
      if (!bricks.length) return;
      const aliveBricks = bricks.filter(br => br.alive && !br.isTeleport);
      if (!aliveBricks.length) return;
      const targetCount = Math.min(aliveBricks.length, 2 + Math.floor(Math.random() * 3));
      const chosen = new Set();
      while (chosen.size < targetCount) {
        chosen.add(Math.floor(Math.random() * aliveBricks.length));
      }
      for (const idx of chosen) {
        aliveBricks[idx].embeddedBall = true;
      }
    }

    function getExplosiveWarningDelay() {
      const range = EXPLOSIVE_WARNING_INTERVAL_MAX - EXPLOSIVE_WARNING_INTERVAL_MIN;
      return EXPLOSIVE_WARNING_INTERVAL_MIN + Math.random() * Math.max(0.0001, range);
    }

    function assignExplosiveBricks() {
      if (!bricks.length) return;
      const pool = bricks.filter(br => br.alive && !br.isTeleport);
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      const count = Math.min(pool.length, Math.random() < 0.5 ? 1 : 2);
      for (let i = 0; i < count; i++) {
        const br = pool[i];
        if (br) {
          br.explosive = true;
          br.explosiveGlowPulse = 0.8;
          br.explosiveWarningTimer = getExplosiveWarningDelay();
        }
      }
    }

    function getTeleportBrickCountForLevel(currentLevel) {
      if (currentLevel < 2) return 0;
      const growth = Math.floor((currentLevel - 2) / 2);
      return Math.min(6, 1 + growth);
    }

    function assignTeleportBricks() {
      const desired = Math.min(getTeleportBrickCountForLevel(level), bricks.length);
      if (desired <= 0) return;
      const pool = bricks.slice();
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      let assigned = 0;
      for (let i = 0; i < pool.length && assigned < desired; i++) {
        const br = pool[i];
        if (!br) continue;
        br.isTeleport = true;
        br.teleportActive = true;
        br.teleportTimer = TELEPORT_BRICK_INTERVAL;
        br.teleportFlashTimer = 0;
        assigned++;
      }
    }

    function updateTeleportBricks(dt) {
      for (const br of bricks) {
        if (!br || !br.alive || !br.isTeleport) continue;
        if (!br.teleportActive) {
          br.teleportActive = true;
          if (!Number.isFinite(br.teleportTimer) || br.teleportTimer <= 0) {
            br.teleportTimer = TELEPORT_BRICK_INTERVAL;
          }
        }
        if (br.teleportFlashTimer > 0) {
          br.teleportFlashTimer = Math.max(0, br.teleportFlashTimer - dt);
        }
        if (!Number.isFinite(br.teleportTimer)) {
          br.teleportTimer = TELEPORT_BRICK_INTERVAL;
        }
        br.teleportTimer -= dt;
        let safety = 0;
        while (br.teleportTimer <= 0 && safety < 8) {
          const moved = teleportBrickToRandomCell(br);
          if (!moved) {
            br.teleportTimer = TELEPORT_BRICK_INTERVAL;
            break;
          }
          br.teleportTimer += TELEPORT_BRICK_INTERVAL;
          safety++;
        }
      }
    }

    function teleportBrickToRandomCell(brick) {
      const oldRow = brick.gridRow;
      const oldCol = brick.gridCol;
      if (brickGrid[oldRow] && brickGrid[oldRow][oldCol] === brick) {
        brickGrid[oldRow][oldCol] = null;
      }
      const emptyCells = [];
      const rowCount = brickGrid.length;
      for (let r = 0; r < rowCount; r++) {
        const rowData = brickGrid[r] || [];
        for (let c = 0; c < BRICK_COLS; c++) {
          const occupant = rowData[c];
          const occupied = occupant && occupant !== brick && occupant.alive;
          if (!occupied) {
            emptyCells.push({ row: r, col: c });
          }
        }
      }
      if (!emptyCells.length) {
        if (!brickGrid[oldRow]) brickGrid[oldRow] = [];
        brickGrid[oldRow][oldCol] = brick;
        return false;
      }
      let candidates = emptyCells;
      if (candidates.length > 1) {
        const filtered = candidates.filter(cell => cell.row !== oldRow || cell.col !== oldCol);
        if (filtered.length) {
          candidates = filtered;
        }
      }
      const target = candidates[Math.floor(Math.random() * candidates.length)];
      if (!target) {
        if (!brickGrid[oldRow]) brickGrid[oldRow] = [];
        brickGrid[oldRow][oldCol] = brick;
        return false;
      }
      if (target.row === oldRow && target.col === oldCol) {
        if (!brickGrid[oldRow]) brickGrid[oldRow] = [];
        brickGrid[oldRow][oldCol] = brick;
        return false;
      }
      if (!brickGrid[target.row]) brickGrid[target.row] = [];
      const occupant = brickGrid[target.row][target.col];
      if (occupant && occupant !== brick && occupant.alive) {
        if (!brickGrid[oldRow]) brickGrid[oldRow] = [];
        brickGrid[oldRow][oldCol] = brick;
        return false;
      }
      brick.gridRow = target.row;
      brick.gridCol = target.col;
      brick.x = brickGridLeft + target.col * (BRICK_W + BRICK_GAP);
      brick.y = brickGridTop + target.row * (BRICK_H + BRICK_GAP);
      brickGrid[target.row][target.col] = brick;
      brick.teleportFlashTimer = TELEPORT_FLASH_DURATION;
      adjustBallsAfterTeleport(brick);
      return true;
    }

    function adjustBallsAfterTeleport(brick) {
      if (!balls.length) return;
      const left = brick.x;
      const right = brick.x + brick.w;
      const top = brick.y;
      const bottom = brick.y + brick.h;
      for (const ball of balls) {
        if (!ball) continue;
        if (ball.x + BALL_R <= left || ball.x - BALL_R >= right || ball.y + BALL_R <= top || ball.y - BALL_R >= bottom) {
          continue;
        }
        const overlaps = [];
        const overlapLeft = (ball.x + BALL_R) - left;
        if (overlapLeft > 0) overlaps.push({ axis: 'x', dir: -1, amount: overlapLeft });
        const overlapRight = right - (ball.x - BALL_R);
        if (overlapRight > 0) overlaps.push({ axis: 'x', dir: 1, amount: overlapRight });
        const overlapTop = (ball.y + BALL_R) - top;
        if (overlapTop > 0) overlaps.push({ axis: 'y', dir: -1, amount: overlapTop });
        const overlapBottom = bottom - (ball.y - BALL_R);
        if (overlapBottom > 0) overlaps.push({ axis: 'y', dir: 1, amount: overlapBottom });
        if (!overlaps.length) continue;
        overlaps.sort((a, b) => a.amount - b.amount);
        const best = overlaps[0];
        if (best.axis === 'x') {
          ball.x += best.dir * best.amount;
        } else {
          ball.y += best.dir * best.amount;
        }
      }
    }

    function getBrickAt(row, col) {
      if (row < 0 || col < 0) return null;
      const rowData = brickGrid[row];
      if (!rowData) return null;
      return rowData[col] || null;
    }

    function awardBrickPoints(brick, ratio = 1) {
      const teleportBonus = brick.isTeleport ? 1.5 : 1;
      const multiplier = (brick.maxShieldHealth > 0 ? SHIELDED_BRICK_MULTIPLIER : 1) * teleportBonus;
      const rawPoints = brick.basePoints * multiplier * ratio;
      const awarded = Math.max(1, Math.round(rawPoints));
      score += awarded;
      scoreEl.textContent = score;
      return awarded;
    }

    function applyCrackedState(brick) {
      if (!brick || !brick.alive) return;
      if (brick.maxShieldHealth > 0 && brick.shieldHealth > 0) {
        brick.shieldCrackTimer = Math.max(brick.shieldCrackTimer, SHIELD_CRACK_DURATION);
        brick.shieldFade = 1;
      } else {
        brick.crackTimer = Math.max(brick.crackTimer, EXPLOSIVE_CRACK_DURATION);
      }
    }

    function applyShake(brick, multiplier = 1) {
      if (!brick || !brick.alive) return;
      brick.shakeTimer = Math.max(brick.shakeTimer, BRICK_SHAKE_DURATION);
      const targetIntensity = BRICK_SHAKE_INTENSITY * Math.max(0.1, multiplier);
      brick.shakeIntensity = Math.max(brick.shakeIntensity, targetIntensity);
      if (!Number.isFinite(brick.shakePhase)) {
        brick.shakePhase = Math.random() * Math.PI * 2;
      }
    }

    function triggerExplosiveBrick(brick) {
      if (!brick || !brick.explosive) return;
      if (brick.lastExplosionFrame === frameCounter) return;
      brick.lastExplosionFrame = frameCounter;
      brick.explosiveGlowPulse = 1;
      brick.explosiveWarningTimer = getExplosiveWarningDelay();
      const centerX = brick.x + brick.w / 2;
      const centerY = brick.y + brick.h / 2;
      spawnExplosionParticles(centerX, centerY);
      spawnExplosionShockwave(centerX, centerY);
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const neighbor = getBrickAt(brick.gridRow + dr, brick.gridCol + dc);
          if (!neighbor || !neighbor.alive) continue;
          if (neighbor.lastExplosionFrame === frameCounter) continue;
          neighbor.lastExplosionFrame = frameCounter;
          if (Math.random() < EXPLOSIVE_NEIGHBOR_CHANCE) {
            neighbor.hp = 0;
            neighbor.shieldHealth = 0;
            neighbor.shieldFade = 0;
            neighbor.shieldCrackTimer = 0;
            neighbor.alive = false;
            awardBrickPoints(neighbor, EXPLOSIVE_POINT_RATIO);
            handleBrickDestroyed(neighbor, null, { triggeredByExplosion: true });
          } else {
            applyCrackedState(neighbor);
            applyShake(neighbor, 1);
          }
        }
      }
    }

    function spawnExplosionParticles(x, y) {
      const mainCount = EXPLOSION_PARTICLE_COUNT + Math.floor(Math.random() * 8);
      for (let i = 0; i < mainCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 220 + Math.random() * 200;
        const life = EXPLOSION_PARTICLE_LIFE + Math.random() * 0.18;
        explosionParticles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life,
          maxLife: life,
          baseRadius: EXPLOSION_PARTICLE_BASE_RADIUS * (0.75 + Math.random() * 0.65),
          radiusRange: EXPLOSION_PARTICLE_RADIUS_VARIANCE * (0.7 + Math.random() * 0.9),
          hueBias: Math.random(),
        });
      }
      const emberCount = Math.floor(EXPLOSION_PARTICLE_COUNT * 0.6);
      for (let i = 0; i < emberCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 120 + Math.random() * 140;
        const life = (EXPLOSION_PARTICLE_LIFE * 0.75) + Math.random() * 0.18;
        explosionParticles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life,
          maxLife: life,
          baseRadius: EXPLOSION_PARTICLE_BASE_RADIUS * (0.45 + Math.random() * 0.35),
          radiusRange: EXPLOSION_PARTICLE_RADIUS_VARIANCE * (0.35 + Math.random() * 0.4),
          hueBias: Math.random(),
          spark: true,
        });
      }
    }

    function spawnExplosionShockwave(x, y) {
      explosionShockwaves.push({
        x,
        y,
        life: EXPLOSION_SHOCKWAVE_LIFE,
        maxLife: EXPLOSION_SHOCKWAVE_LIFE,
        radius: 0,
      });
    }

    function spawnBrickDebris(brick) {
      if (!brick) return;
      const centerX = brick.x + brick.w / 2;
      const centerY = brick.y + brick.h / 2;
      const count = EXPLOSION_DEBRIS_COUNT + Math.floor(Math.random() * 6);
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 160 + Math.random() * 160;
        const life = EXPLOSION_DEBRIS_LIFE + Math.random() * 0.2;
        brickDebrisParticles.push({
          x: centerX,
          y: centerY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life,
          maxLife: life,
          size: 3 + Math.random() * 4,
          rotation: Math.random() * Math.PI * 2,
          rotationSpeed: (Math.random() - 0.5) * 12,
          colorMix: Math.random(),
        });
      }
    }

    function updateExplosionParticles(dt) {
      for (let i = explosionParticles.length - 1; i >= 0; i--) {
        const p = explosionParticles[i];
        p.life -= dt;
        if (p.life <= 0) {
          explosionParticles.splice(i, 1);
          continue;
        }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.9;
        p.vy *= 0.9;
      }
    }

    function updateExplosionShockwaves(dt) {
      for (let i = explosionShockwaves.length - 1; i >= 0; i--) {
        const sw = explosionShockwaves[i];
        sw.life -= dt;
        if (sw.life <= 0) {
          explosionShockwaves.splice(i, 1);
          continue;
        }
        const lifeRatio = 1 - Math.max(0, sw.life / sw.maxLife);
        sw.radius = lifeRatio * EXPLOSION_SHOCKWAVE_MAX_RADIUS;
      }
    }

    function updateBrickDebris(dt) {
      for (let i = brickDebrisParticles.length - 1; i >= 0; i--) {
        const p = brickDebrisParticles[i];
        p.life -= dt;
        if (p.life <= 0) {
          brickDebrisParticles.splice(i, 1);
          continue;
        }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.88;
        p.vy = p.vy * 0.88 + 240 * dt;
        p.rotation += p.rotationSpeed * dt;
      }
    }

    function renderExplosionParticles() {
      if (!explosionParticles.length) return;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const p of explosionParticles) {
        const lifeRatio = Math.max(0, p.life / p.maxLife);
        const radius = (p.baseRadius || EXPLOSION_PARTICLE_BASE_RADIUS) + (1 - lifeRatio) * (p.radiusRange || EXPLOSION_PARTICLE_RADIUS_VARIANCE);
        const alphaBase = (p.spark ? 0.55 : 0.65) * lifeRatio + 0.2;
        const mix = p.hueBias ?? 0.5;
        const cyanAlpha = alphaBase * (1 - mix * 0.25);
        const magentaAlpha = alphaBase * (0.7 + mix * 0.4);
        const gradient = ctx.createRadialGradient(p.x, p.y, radius * 0.22, p.x, p.y, radius);
        gradient.addColorStop(0, `rgba(0, 255, 255, ${cyanAlpha})`);
        gradient.addColorStop(0.55, `rgba(120, 255, 255, ${cyanAlpha * 0.85})`);
        gradient.addColorStop(0.9, `rgba(255, 62, 223, ${magentaAlpha})`);
        gradient.addColorStop(1, 'rgba(255, 62, 223, 0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function renderExplosionShockwaves() {
      if (!explosionShockwaves.length) return;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const sw of explosionShockwaves) {
        const lifeRatio = Math.max(0, sw.life / sw.maxLife);
        const radius = Math.max(4, sw.radius || 0);
        const alpha = 0.4 * lifeRatio + 0.1;
        const innerRadius = radius * 0.35;
        const gradient = ctx.createRadialGradient(sw.x, sw.y, innerRadius, sw.x, sw.y, radius);
        gradient.addColorStop(0, `rgba(0, 255, 255, ${alpha})`);
        gradient.addColorStop(0.6, `rgba(0, 255, 255, ${alpha * 0.4})`);
        gradient.addColorStop(0.85, `rgba(255, 62, 223, ${alpha * 0.6})`);
        gradient.addColorStop(1, 'rgba(255, 62, 223, 0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function renderBrickDebris() {
      if (!brickDebrisParticles.length) return;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const p of brickDebrisParticles) {
        const lifeRatio = Math.max(0, p.life / p.maxLife);
        const mix = Math.min(1, Math.max(0, p.colorMix));
        const r = Math.round(0 * (1 - mix) + 255 * mix);
        const g = Math.round(255 * (1 - mix) + 62 * mix);
        const b = Math.round(255 * (1 - mix) + 223 * mix);
        const alpha = 0.7 * lifeRatio + 0.15;
        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        const width = p.size * (1 + (1 - lifeRatio) * 0.5);
        const height = p.size * 0.45;
        ctx.fillRect(-width / 2, -height / 2, width, height);
        ctx.restore();
      }
      ctx.restore();
    }

    function updateBrickVisualState(dt) {
      for (const br of bricks) {
        if (!br.alive) continue;
        if (br.shakeTimer > 0) {
          br.shakeTimer = Math.max(0, br.shakeTimer - dt);
          br.shakePhase += dt * BRICK_SHAKE_FREQUENCY;
          const normalized = Math.max(0, Math.min(1, br.shakeTimer / BRICK_SHAKE_DURATION));
          const intensity = br.shakeIntensity * Math.pow(normalized, 0.65);
          br.shakeOffsetX = Math.sin(br.shakePhase * 1.9) * intensity;
          br.shakeOffsetY = Math.cos(br.shakePhase * 2.3) * intensity * 0.75;
          if (br.shakeTimer <= 0) {
            br.shakeOffsetX = 0;
            br.shakeOffsetY = 0;
            br.shakeIntensity = 0;
          }
        } else if (Math.abs(br.shakeOffsetX) > 0.01 || Math.abs(br.shakeOffsetY) > 0.01) {
          br.shakeOffsetX *= 0.6;
          br.shakeOffsetY *= 0.6;
          if (Math.abs(br.shakeOffsetX) < 0.01 && Math.abs(br.shakeOffsetY) < 0.01) {
            br.shakeOffsetX = 0;
            br.shakeOffsetY = 0;
            br.shakeIntensity = 0;
          }
        }
        if (br.explosive) {
          if (!Number.isFinite(br.explosiveGlowPhase)) {
            br.explosiveGlowPhase = Math.random() * Math.PI * 2;
          }
          br.explosiveGlowPhase = (br.explosiveGlowPhase + dt * EXPLOSIVE_GLOW_SPEED) % (Math.PI * 2);
          const basePulse = (Math.sin(br.explosiveGlowPhase) + 1) / 2;
          const flicker = (Math.sin(br.explosiveGlowPhase * 3.1) + 1) / 2 * 0.35;
          const normalized = Math.min(1, Math.max(0, Math.pow(basePulse, 1.4) * (0.7 + flicker)));
          br.explosiveGlowPulse = normalized;
          if (!Number.isFinite(br.explosiveWarningTimer) || br.explosiveWarningTimer <= 0) {
            br.explosiveWarningTimer = getExplosiveWarningDelay();
          } else {
            br.explosiveWarningTimer -= dt;
            if (br.explosiveWarningTimer <= 0) {
              br.explosiveWarningTimer = getExplosiveWarningDelay();
              br.explosiveGlowPulse = 1;
              applyShake(br, EXPLOSIVE_WARNING_SHAKE_MULTIPLIER + Math.random() * 0.35);
            }
          }
        } else if (br.explosiveGlowPulse) {
          br.explosiveGlowPulse = Math.max(0, br.explosiveGlowPulse - dt * 1.2);
        }
        if (br.crackTimer > 0) {
          br.crackTimer = Math.max(0, br.crackTimer - dt);
        }
        if (!br.maxShieldHealth) continue;
        if (br.shieldHealth > 0) {
          br.shieldFade = Math.min(1, br.shieldFade + dt * 4);
        } else if (br.shieldFade > 0) {
          br.shieldFade = Math.max(0, br.shieldFade - dt * 3.2);
        }
        br.shieldGlowPhase = (br.shieldGlowPhase + dt * 2.6) % (Math.PI * 2);
        if (br.shieldCrackTimer > 0) {
          br.shieldCrackTimer = Math.max(0, br.shieldCrackTimer - dt);
        }
      }
    }

    function launch() {
      if (paused) { togglePause(); return; }
      if (!running) {
        const ball = balls.find(b => b.lockedToPaddle) || balls[0];
        if (ball) {
          hideOverlay();
          minimumBallSpeed = null;
          launchFromPaddle(ball);
        }
      }
    }

    function update(dt) {
      frameCounter++;
      updateBrickVisualState(dt);
      const paddleSpeed = (9 + level*0.4) * 60;
      if (input.left) paddleX -= paddleSpeed * dt;
      if (input.right) paddleX += paddleSpeed * dt;
      paddleX = Math.max(0, Math.min(canvas.width - paddleWidth, paddleX));

      const ballsToRemove = [];

      for (const ball of balls) {
        if (!ball.shieldHits) {
          ball.shieldHits = new Set();
        }
        if (ball.shieldHitFrame !== frameCounter) {
          ball.shieldHits.clear();
          ball.shieldHitFrame = frameCounter;
        }
        if (ball.lockedToPaddle) {
          ball.x = paddleX + paddleWidth / 2;
          ball.y = PADDLE_Y - BALL_R - 2;
          continue;
        }

        if (magnetActive && ball.vy > 0) {
          const targetX = paddleX + paddleWidth / 2;
          const targetY = PADDLE_Y + PADDLE_H / 2;
          let speed = magnetLockedSpeed;
          if (!speed || speed <= 0) {
            const currentSpeed = Math.hypot(ball.vx, ball.vy);
            if (currentSpeed > 0) {
              speed = currentSpeed;
            } else if (minimumBallSpeed) {
              speed = minimumBallSpeed;
            } else {
              speed = 0;
            }
            if (speed > 0) magnetLockedSpeed = speed;
          }
          if (speed > 0) {
            const dx = targetX - ball.x;
            const dy = targetY - ball.y;
            const dist = Math.hypot(dx, dy);
            if (dist > 1) {
              ball.vx = (dx / dist) * speed;
              ball.vy = (dy / dist) * speed;
            } else {
              ball.vx = 0;
              ball.vy = speed;
            }
          }
        }

        const prevBallX = ball.x;
        const prevBallY = ball.y;
        ball.x += ball.vx * dt; ball.y += ball.vy * dt;

        if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx *= -1; }
        if (ball.x + BALL_R > canvas.width) { ball.x = canvas.width - BALL_R; ball.vx *= -1; }
        if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy *= -1; }

        if (SPECIAL_BAR.hp > 0) {
          const barLeft = SPECIAL_BAR.x;
          const barRight = SPECIAL_BAR.x + SPECIAL_BAR.w;
          const barTop = SPECIAL_BAR.y;
          const barBottom = SPECIAL_BAR.y + SPECIAL_BAR.h;
          const intersectsBar =
            ball.x + BALL_R >= barLeft &&
            ball.x - BALL_R <= barRight &&
            ball.y + BALL_R >= barTop &&
            ball.y - BALL_R <= barBottom;
          if (intersectsBar) {
            const prevTop = prevBallY - BALL_R;
            const prevBottom = prevBallY + BALL_R;
            let verticalBounce = false;

            if (ball.vy > 0 && prevBottom <= barTop) {
              ball.y = barTop - BALL_R;
              ball.vy = -Math.abs(ball.vy);
              verticalBounce = true;
            } else if (ball.vy < 0 && prevTop >= barBottom) {
              ball.y = barBottom + BALL_R;
              ball.vy = Math.abs(ball.vy);
              verticalBounce = true;
            } else {
              if (prevBallX + BALL_R <= barLeft) {
                ball.x = barLeft - BALL_R;
              } else if (prevBallX - BALL_R >= barRight) {
                ball.x = barRight + BALL_R;
              }
              ball.vx *= -1;
            }

            if (verticalBounce) {
              const offset = (ball.x - (barLeft + SPECIAL_BAR.w / 2)) / (SPECIAL_BAR.w / 2);
              ball.vx += offset * 1.2 * 60;
            }

            SPECIAL_BAR.hp = Math.max(0, SPECIAL_BAR.hp - 1);
            if (SPECIAL_BAR.hp > 0) {
              score += 20;
            } else {
              score += 50;
              handleSpecialBarDestroyed();
            }
            scoreEl.textContent = score;
          }
        } else if (splitBars.length) {
          handleSplitBarsCollision(ball, prevBallX, prevBallY);
        }

        if (ball.y - BALL_R > canvas.height) {
          ballsToRemove.push(ball);
          continue;
        }

        if (ball.y + BALL_R >= PADDLE_Y && ball.y + BALL_R <= PADDLE_Y + PADDLE_H) {
          if (ball.x >= paddleX && ball.x <= paddleX + paddleWidth && ball.vy > 0) {
            ball.y = PADDLE_Y - BALL_R - 1;
            if (magnetActive) {
              const reboundSpeed = magnetLockedSpeed ?? Math.hypot(ball.vx, ball.vy);
              ball.x = paddleX + paddleWidth / 2;
              ball.vx = 0;
              if (reboundSpeed && reboundSpeed > 0) {
                ball.vy = -Math.abs(reboundSpeed);
              } else {
                const fallbackSpeed = minimumBallSpeed || (6 + level * 0.8) * 0.75 * 60;
                ball.vy = -Math.abs(fallbackSpeed);
              }
              magnetLockedSpeed = Math.abs(ball.vy);
            } else {
              const hit = (ball.x - (paddleX + paddleWidth / 2)) / (paddleWidth / 2);
              const speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy) * 1.03;
              const angle = hit * 1.0;
              ball.vx = speed * Math.sin(angle);
              ball.vy = -Math.abs(speed * Math.cos(angle));
              enforceMinimumBallSpeed(ball);
            }
          }
        }

        for (const br of bricks) {
          if (!br.alive) continue;
          if (ball.x + BALL_R > br.x && ball.x - BALL_R < br.x + br.w &&
              ball.y + BALL_R > br.y && ball.y - BALL_R < br.y + br.h) {
            const prevX = prevBallX;
            const prevY = prevBallY;
            const wasAbove = prevY + BALL_R <= br.y;
            const wasBelow = prevY - BALL_R >= br.y + br.h;
            if (wasAbove || wasBelow) {
              ball.vy *= -1;
            } else {
              ball.vx *= -1;
            }

            if (br.shieldHealth > 0) {
              if (!ball.shieldHits.has(br.id)) {
                ball.shieldHits.add(br.id);
                br.shieldHealth = Math.max(0, br.shieldHealth - 1);
                br.shieldFade = 1;
                br.shieldCrackTimer = SHIELD_CRACK_DURATION;
                playShieldCrackSound();
                score += BRICK_HIT_POINTS;
                scoreEl.textContent = score;
              }
              enforceMinimumBallSpeed(ball);
              break;
            }

            br.hp -= 1;
            if (br.hp <= 0) {
              br.alive = false;
              awardBrickPoints(br, 1);
              handleBrickDestroyed(br, ball);
            } else {
              score += BRICK_HIT_POINTS;
              scoreEl.textContent = score;
            }
            enforceMinimumBallSpeed(ball);
            break;
          }
        }

        enforceMinimumBallSpeed(ball);
      }

      if (ballsToRemove.length) {
        balls = balls.filter(ball => !ballsToRemove.includes(ball));
      }

      if (!balls.length) {
        lives--; livesEl.textContent = lives;
        resetComboMultiplier();
        if (lives <= 0) {
          running = false;
          showOverlay('Game Over', 'Press Space to restart');
          if (!gameOverHandled) { gameOverHandled = true; maybeSubmitLeaderboard().catch(console.error); }
          window.addEventListener('keydown', restartOnce, { once: true });
        } else {
          running = false;
          showOverlay('Life Lost', 'Tap/Click or press Space to relaunch');
          balls = [createBall(paddleX + paddleWidth / 2, PADDLE_Y - BALL_R - 2, true)];
          magnetActive = false;
          magnetTimer = 0;
          magnetPulse = 0;
          magnetLockedSpeed = null;
          minimumBallSpeed = null;
        }
        return;
      }

      const remaining = bricks.reduce((acc, br) => br.alive ? acc + 1 : acc, 0);
      if (remaining === 0 && splitBars.length === 0) {
        score += 200; scoreEl.textContent = score;
        running = false;
        resetLevel(level + 1);
      }
    }

    function handleBrickDestroyed(brick, ball, options = {}) {
      const { triggeredByExplosion = false } = options;
      if (ball) {
        increaseBallSpeedForBrickBreak(ball);
      }
      registerBrickCombo();
      if (brickGrid[brick.gridRow] && brickGrid[brick.gridRow][brick.gridCol] === brick) {
        brickGrid[brick.gridRow][brick.gridCol] = null;
      }
      if (brick.isTeleport) {
        brick.teleportActive = false;
      }
      if (triggeredByExplosion) {
        spawnBrickDebris(brick);
      }
      if (brick.embeddedBall && !brick.embeddedBallReleased) {
        brick.embeddedBallReleased = true;
        brick.embeddedBall = false;
        const referenceBall = ball || getReferenceBallForExplosion();
        releaseEmbeddedBall(brick, referenceBall);
      }
      if (brick.explosive && !triggeredByExplosion) {
        triggerExplosiveBrick(brick);
      }
    }

    function increaseBallSpeedForBrickBreak(ball) {
      const boostMultiplier = 1 + level * 0.005;
      ball.vx *= boostMultiplier;
      ball.vy *= boostMultiplier;
      const currentSpeed = Math.hypot(ball.vx, ball.vy);
      if (currentSpeed > 0) {
        minimumBallSpeed = minimumBallSpeed === null
          ? currentSpeed
          : Math.max(minimumBallSpeed, currentSpeed);
      }
    }

    function getReferenceBallForExplosion() {
      const active = balls.find(b => !b.lockedToPaddle && (b.vx || b.vy));
      return active || balls[0] || null;
    }

    function releaseEmbeddedBall(brick, sourceBall) {
      const spawnX = brick.x + brick.w / 2;
      const spawnY = brick.y + brick.h / 2;
      const newBall = createBall(spawnX, spawnY, false);
      const defaultSpeed = (6 + level * 0.8) * 0.75 * 60;
      const sourceSpeed = sourceBall ? Math.hypot(sourceBall.vx, sourceBall.vy) : 0;
      const reference = sourceBall || getReferenceBallForExplosion();
      const referenceBallSpeed = reference ? Math.hypot(reference.vx, reference.vy) : 0;
      const referenceSpeed = Math.max(defaultSpeed, sourceSpeed, referenceBallSpeed, minimumBallSpeed || 0);
      const angle = Math.PI * 0.25 + Math.random() * Math.PI * 0.5;
      const direction = Math.random() < 0.5 ? -1 : 1;
      newBall.vx = Math.cos(angle) * referenceSpeed * direction;
      newBall.vy = Math.sin(angle) * referenceSpeed;
      captureInitialBallSpeed(newBall);
      enforceMinimumBallSpeed(newBall);
      const speed = Math.hypot(newBall.vx, newBall.vy);
      if (speed > 0) {
        minimumBallSpeed = minimumBallSpeed === null
          ? speed
          : Math.max(minimumBallSpeed, speed);
      }
      balls.push(newBall);
      running = true;
    }

    function restartOnce(e) {
      if (e.code === 'Space') {
        score = 0; lives = 3; level = 1;
        scoreEl.textContent = score; livesEl.textContent = lives; levelEl.textContent = level;
        gameOverHandled = false;
        resetLevel(1);
      }
    }

    async function maybeSubmitLeaderboard() {
      let dest = `../leaderboard.html?gameId=${encodeURIComponent(GAME_ID)}`;
      try {
        const res = await fetch(`/api/leaderboard/rank?gameId=${encodeURIComponent(GAME_ID)}&score=${encodeURIComponent(score)}`, {
          headers: { 'Accept': 'application/json' }
        });
        if (res.ok) {
          const data = await res.json();
          const rank = Number(data?.rank);
          const qualifies = Number.isFinite(rank) && rank > 0 && rank <= 20;
          if (qualifies) {
            let name = prompt(`New High Score! You placed #${rank}. Enter your name (max 20 chars):`, '');
            if (name != null) {
              name = name.trim().replace(/[^\w \-'.!]/g, '').slice(0, 20);
              if (name) {
                let submitted = false;
                try {
                  await fetch('/api/leaderboard/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ gameId: GAME_ID, name, score })
                  });
                  submitted = true;
                } catch {}
                if (submitted) {
                  dest += `&highlightRank=${encodeURIComponent(rank)}`;
                }
              }
            }
          }
        }
      } catch (e) {
        console.error(e);
      } finally {
        location.href = dest;
      }
    }

    function activateMagnetUpgrade() {
      magnetActive = true;
      magnetTimer = 15;
      magnetPulse = 0;
      const referenceBall = balls.find(b => !b.lockedToPaddle && (b.vx || b.vy)) || balls[0];
      if (referenceBall) {
        const currentSpeed = Math.hypot(referenceBall.vx, referenceBall.vy);
        if (currentSpeed > 0) {
          magnetLockedSpeed = currentSpeed;
        } else if (minimumBallSpeed) {
          magnetLockedSpeed = minimumBallSpeed;
        }
      }
      showUpgradeBanner('Upgrade: Magnet Paddle!');
    }

    function showUpgradeBanner(text) {
      upgradeBanner.textContent = text;
      upgradeBanner.classList.remove('show');
      void upgradeBanner.offsetWidth;
      upgradeBanner.classList.add('show');
    }

    function drawNeonGrid() {
      // subtle glow grid for retro vibe
      ctx.save();
      ctx.strokeStyle = 'rgba(0,255,255,0.05)';
      ctx.lineWidth = 1;
      const step = 40;
      for (let x=0; x<=canvas.width; x+=step) {
        ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
      }
      for (let y=0; y<=canvas.height; y+=step) {
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
      }
      ctx.restore();
    }

    function render() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      drawNeonGrid();

      // Draw bricks
      for (const br of bricks) {
        if (!br.alive) continue;
        const drawX = br.x + (br.shakeOffsetX || 0);
        const drawY = br.y + (br.shakeOffsetY || 0);
        ctx.drawImage(br.img, drawX, drawY, br.w, br.h);
        if (br.isTeleport) {
          if (br.teleportFlashTimer > 0) {
            const flashNormalized = Math.max(0, Math.min(1, br.teleportFlashTimer / TELEPORT_FLASH_DURATION));
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = TELEPORT_FLASH_MAX_ALPHA * flashNormalized;
            const gradient = ctx.createRadialGradient(
              drawX + br.w / 2,
              drawY + br.h / 2,
              Math.max(8, br.w * 0.2),
              drawX + br.w / 2,
              drawY + br.h / 2,
              Math.max(br.w, br.h) * 0.9
            );
            gradient.addColorStop(0, 'rgba(0, 255, 255, 0.8)');
            gradient.addColorStop(1, 'rgba(0, 255, 255, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(drawX + br.w / 2, drawY + br.h / 2, Math.max(br.w, br.h), 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }
        if (br.explosive) {
          const glowPulse = Math.max(0, Math.min(1, br.explosiveGlowPulse || 0));
          if (glowPulse > 0.01) {
            const glowStrength = EXPLOSIVE_GLOW_MIN_ALPHA + glowPulse * (EXPLOSIVE_GLOW_MAX_ALPHA - EXPLOSIVE_GLOW_MIN_ALPHA);
            const glowX = drawX + br.w / 2;
            const glowY = drawY + br.h / 2;
            const innerRadius = Math.max(6, Math.min(br.w, br.h) * 0.3);
            const outerRadius = Math.max(br.w, br.h) * 1.1;
            const gradient = ctx.createRadialGradient(glowX, glowY, innerRadius, glowX, glowY, outerRadius);
            gradient.addColorStop(0, 'rgba(255, 120, 120, 1)');
            gradient.addColorStop(0.45, 'rgba(255, 60, 60, 0.7)');
            gradient.addColorStop(1, 'rgba(255, 0, 0, 0)');
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = glowStrength;
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(glowX, glowY, outerRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.globalAlpha = glowStrength * 0.8;
            ctx.fillStyle = 'rgba(255, 40, 40, 0.85)';
            ctx.fillRect(drawX, drawY, br.w, br.h);
            ctx.restore();

            if (glowPulse > 0.65) {
              ctx.save();
              ctx.globalAlpha = glowStrength * 0.75;
              ctx.strokeStyle = 'rgba(255, 160, 160, 1)';
              ctx.lineWidth = 2;
              ctx.strokeRect(drawX - 1, drawY - 1, br.w + 2, br.h + 2);
              ctx.restore();
            }
          }
        }
        if (br.maxShieldHealth > 0 && (br.shieldHealth > 0 || br.shieldFade > 0.01)) {
          const pulse = 0.75 + Math.sin(br.shieldGlowPhase * 2) * 0.25;
          const overlayStrength = br.shieldHealth > 0 ? 0.22 : 0.18 * br.shieldFade;
          ctx.save();
          ctx.globalAlpha = Math.min(0.35, overlayStrength * pulse);
          ctx.fillStyle = 'rgba(0, 255, 255, 1)';
          ctx.fillRect(drawX, drawY, br.w, br.h);
          ctx.restore();

          ctx.save();
          const edgeAlpha = Math.min(0.55, (br.shieldHealth > 0 ? 0.45 : 0.45 * br.shieldFade) * pulse);
          ctx.strokeStyle = `rgba(0, 255, 255, ${edgeAlpha})`;
          ctx.lineWidth = 2;
          ctx.strokeRect(drawX - 1, drawY - 1, br.w + 2, br.h + 2);
          ctx.restore();
        }
        if (br.crackTimer > 0) {
          ctx.save();
          const crackIntensity = Math.min(1, br.crackTimer / EXPLOSIVE_CRACK_DURATION);
          ctx.strokeStyle = `rgba(255, 62, 223, ${0.55 * crackIntensity})`;
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(drawX + br.w * 0.18, drawY + br.h * 0.22);
          ctx.lineTo(drawX + br.w * 0.38, drawY + br.h * 0.5);
          ctx.lineTo(drawX + br.w * 0.3, drawY + br.h * 0.82);
          ctx.moveTo(drawX + br.w * 0.66, drawY + br.h * 0.18);
          ctx.lineTo(drawX + br.w * 0.52, drawY + br.h * 0.48);
          ctx.lineTo(drawX + br.w * 0.7, drawY + br.h * 0.78);
          ctx.stroke();
          ctx.restore();
        }
        if (br.embeddedBall && !br.embeddedBallReleased) {
          ctx.save();
          ctx.globalAlpha = 0.85;
          const glowX = drawX + br.w / 2;
          const glowY = drawY + br.h / 2;
          const gradient = ctx.createRadialGradient(glowX, glowY, 4, glowX, glowY, 18);
          gradient.addColorStop(0, 'rgba(0, 255, 255, 0.85)');
          gradient.addColorStop(1, 'rgba(0, 255, 255, 0)');
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(glowX, glowY, 18, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        if (br.shieldCrackTimer > 0) {
          ctx.save();
          const crackAlpha = Math.min(1, br.shieldCrackTimer / SHIELD_CRACK_DURATION);
          ctx.globalAlpha = crackAlpha;
          ctx.drawImage(imgBrickCrack, drawX - 6, drawY - 4, br.w + 12, br.h + 8);
          ctx.restore();
        }
      }

      renderExplosionShockwaves();
      renderBrickDebris();
      renderExplosionParticles();

      drawSpecialBar();

      // Draw paddle
      let paddleDrawWidth = paddleWidth;
      let paddleDrawHeight = PADDLE_H;
      let paddleDrawX = paddleX;
      let paddleDrawY = PADDLE_Y;
      if (paddleGrowTimer > 0 && PADDLE_GROW_ANIM_TIME > 0) {
        const normalized = Math.min(1, Math.max(0, 1 - paddleGrowTimer / PADDLE_GROW_ANIM_TIME));
        const pulse = Math.sin(normalized * Math.PI);
        const widthScale = 1 + pulse * 0.12;
        const heightScale = 1 + pulse * 0.08;
        paddleDrawWidth = paddleWidth * widthScale;
        paddleDrawHeight = PADDLE_H * heightScale;
        paddleDrawX = paddleX - (paddleDrawWidth - paddleWidth) / 2;
        paddleDrawY = PADDLE_Y - (paddleDrawHeight - PADDLE_H) / 2;
      }

      if (magnetActive) {
        ctx.save();
        const pulse = 0.65 + Math.sin(magnetPulse * 6) * 0.25;
        const glowSize = 24 + Math.sin(magnetPulse * 8) * 6;
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = `rgba(0, 255, 255, ${0.18 + pulse * 0.18})`;
        ctx.shadowColor = 'rgba(0, 255, 255, 0.85)';
        ctx.shadowBlur = glowSize;
        ctx.fillRect(paddleDrawX - 6, paddleDrawY - 8, paddleDrawWidth + 12, paddleDrawHeight + 16);
        ctx.restore();
      }

      ctx.drawImage(imgPaddle, paddleDrawX, paddleDrawY, paddleDrawWidth, paddleDrawHeight);

      for (const ball of balls) {
        ctx.drawImage(imgBall, ball.x - BALL_R*1.5, ball.y - BALL_R*1.5, BALL_R*3, BALL_R*3);
      }
    }

    function loop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;

      updateExplosionShockwaves(dt);
      updateBrickDebris(dt);
      updateExplosionParticles(dt);

      if (SPECIAL_BAR.hp > 0) {
        updateSpecialBarState(dt);
        if (running && !paused) {
          updateSpecialBarMovement(dt);
        }
      } else if (splitBars.length) {
        if (running && !paused) {
          updateSplitBars(dt);
        }
      }

      updateMagnet(dt);
      if (paddleBuff) {
        paddleBuff.update(dt);
      }
      if (paddleGrowTimer > 0) {
        paddleGrowTimer = Math.max(0, paddleGrowTimer - dt);
      }
      if (!paused) {
        updateTeleportBricks(dt);
      }

      if (running && !paused) {
        updateComboTimer(dt);
        update(dt);
      }
      render();
      requestAnimationFrame(loop);
    }

    function updateMagnet(dt) {
      if (magnetActive) {
        magnetTimer -= dt;
        magnetPulse += dt;
        if (magnetTimer <= 0) {
          magnetActive = false;
          magnetTimer = 0;
          magnetLockedSpeed = null;
        }
      } else if (magnetPulse !== 0) {
        magnetPulse = 0;
        magnetLockedSpeed = null;
      }
    }

    function drawSpecialBar() {
      if (SPECIAL_BAR.hp > 0) {
        if (isSpecialBarFlashing() && !SPECIAL_BAR.flashVisible) return;
        ctx.save();
        const { x, y, w, h, hp, maxHp } = SPECIAL_BAR;
        const damageRatio = hp / maxHp;
        const alpha = damageRatio === 1 ? 0.92 : damageRatio >= 2/3 ? 0.78 : 0.62;
        const color = getSpecialBarColor();
        const grad = ctx.createLinearGradient(x, y, x + w, y);
        if (color === 'green') {
          grad.addColorStop(0, `rgba(80, 255, 140, ${alpha})`);
          grad.addColorStop(0.5, `rgba(20, 200, 120, ${alpha})`);
          grad.addColorStop(1, `rgba(120, 255, 200, ${alpha})`);
          ctx.shadowColor = 'rgba(80, 255, 180, 0.7)';
        } else {
          grad.addColorStop(0, `rgba(255, 90, 90, ${alpha})`);
          grad.addColorStop(0.5, `rgba(255, 30, 0, ${alpha})`);
          grad.addColorStop(1, `rgba(255, 160, 80, ${alpha})`);
          ctx.shadowColor = 'rgba(255, 80, 60, 0.7)';
        }
        ctx.fillStyle = grad;
        ctx.shadowBlur = 12 * damageRatio + (color === 'green' ? 6 : 0);
        ctx.fillRect(x, y, w, h);
        ctx.shadowBlur = 0;
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.strokeRect(x, y, w, h);

        // Draw crack detail as HP decreases
        if (hp <= maxHp - 1) {
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = 'rgba(255,255,255,0.35)';
          ctx.beginPath();
          ctx.moveTo(x + w * 0.22, y + h * 0.2);
          ctx.lineTo(x + w * 0.45, y + h * 0.45);
          ctx.lineTo(x + w * 0.38, y + h * 0.82);
          ctx.stroke();
        }
        if (hp <= maxHp - 2) {
          ctx.beginPath();
          ctx.moveTo(x + w * 0.68, y + h * 0.18);
          ctx.lineTo(x + w * 0.52, y + h * 0.5);
          ctx.lineTo(x + w * 0.56, y + h * 0.88);
          ctx.moveTo(x + w * 0.08, y + h * 0.62);
          ctx.lineTo(x + w * 0.28, y + h * 0.42);
          ctx.lineTo(x + w * 0.48, y + h * 0.5);
          ctx.stroke();
        }

        ctx.restore();
      } else if (splitBars.length) {
        ctx.save();
        for (const bar of splitBars) {
          if (bar.hp <= 0) continue;
          ctx.shadowColor = 'rgba(255, 80, 60, 0.55)';
          ctx.shadowBlur = 14;
          ctx.fillStyle = 'rgba(255, 70, 70, 0.9)';
          ctx.fillRect(bar.x, bar.y, bar.w, bar.h);
          ctx.shadowBlur = 0;
          ctx.strokeStyle = 'rgba(255,255,255,0.28)';
          ctx.lineWidth = 1.6;
          ctx.strokeRect(bar.x, bar.y, bar.w, bar.h);
        }
        ctx.restore();
      }
    }

    function getSpecialBarPhase() {
      return SPECIAL_BAR_PHASES[SPECIAL_BAR.stateIndex] || SPECIAL_BAR_PHASES[0];
    }

    function getSpecialBarColor() {
      return getSpecialBarPhase().color;
    }

    function isSpecialBarFlashing() {
      return getSpecialBarPhase().type === 'flash';
    }

    function isSpecialBarGreen() {
      return getSpecialBarColor() === 'green';
    }

    function updateSpecialBarState(dt) {
      if (SPECIAL_BAR.hp <= 0) return;
      const phase = getSpecialBarPhase();
      SPECIAL_BAR.stateTime += dt;
      if (phase.type === 'flash') {
        SPECIAL_BAR.flashTimer -= dt;
        if (SPECIAL_BAR.flashTimer <= 0) {
          SPECIAL_BAR.flashVisible = !SPECIAL_BAR.flashVisible;
          SPECIAL_BAR.flashTimer += SPECIAL_BAR.flashInterval;
        }
      } else {
        SPECIAL_BAR.flashVisible = true;
        SPECIAL_BAR.flashTimer = SPECIAL_BAR.flashInterval;
      }
      if (SPECIAL_BAR.stateTime >= phase.duration) {
        SPECIAL_BAR.stateIndex = (SPECIAL_BAR.stateIndex + 1) % SPECIAL_BAR_PHASES.length;
        SPECIAL_BAR.stateTime = 0;
        SPECIAL_BAR.flashTimer = SPECIAL_BAR.flashInterval;
        SPECIAL_BAR.flashVisible = true;
      }
    }

    function updateSpecialBarMovement(dt) {
      const leftBound = 16;
      const rightBound = canvas.width - SPECIAL_BAR.w - 16;
      SPECIAL_BAR.x += SPECIAL_BAR.speed * SPECIAL_BAR.dir * dt;
      if (SPECIAL_BAR.x <= leftBound) {
        SPECIAL_BAR.x = leftBound;
        SPECIAL_BAR.dir = 1;
      } else if (SPECIAL_BAR.x >= rightBound) {
        SPECIAL_BAR.x = rightBound;
        SPECIAL_BAR.dir = -1;
      }
    }

    function spawnSplitBars() {
      const baseSpeed = SPECIAL_BAR.speed * 0.95;
      const segmentWidth = SPECIAL_BAR.w * 0.45;
      const gap = Math.max(10, SPECIAL_BAR.w * 0.1);
      const center = SPECIAL_BAR.x + SPECIAL_BAR.w / 2;
      const leftStart = Math.max(16, center - gap / 2 - segmentWidth);
      const rightStart = Math.min(canvas.width - segmentWidth - 16, center + gap / 2);
      splitBars = [
        { x: leftStart, y: SPECIAL_BAR.y, w: segmentWidth, h: SPECIAL_BAR.h, dir: -1, speed: baseSpeed, hp: 1, maxHp: 1 },
        { x: rightStart, y: SPECIAL_BAR.y, w: segmentWidth, h: SPECIAL_BAR.h, dir: 1, speed: baseSpeed, hp: 1, maxHp: 1 }
      ];
    }

    function updateSplitBars(dt) {
      const leftWall = 16;
      const rightWall = canvas.width - 16;
      for (const bar of splitBars) {
        if (bar.hp <= 0) continue;
        bar.x += bar.speed * bar.dir * dt;
        if (bar.x <= leftWall) {
          bar.x = leftWall;
          bar.dir = 1;
        } else if (bar.x + bar.w >= rightWall) {
          bar.x = rightWall - bar.w;
          bar.dir = -1;
        }
      }

      if (splitBars.length >= 2) {
        const a = splitBars[0];
        const b = splitBars[1];
        let left = a;
        let right = b;
        if (a.x > b.x) {
          left = b;
          right = a;
        }
        if (left.x + left.w >= right.x) {
          const overlap = (left.x + left.w) - right.x;
          if (overlap > 0) {
            left.x -= overlap / 2;
            right.x += overlap / 2;
          }
          left.dir = -1;
          right.dir = 1;
        }
      }
      cleanupSplitBars();
    }

    function handleSpecialBarDestroyed() {
      const destroyedWhileGreen = isSpecialBarGreen();
      if (destroyedWhileGreen) {
        lives += 1;
        livesEl.textContent = lives;
        showUpgradeBanner('Bonus Life!');
      } else {
        spawnSplitBars();
        increaseBallSpeedByPercentage(0.2);
        showUpgradeBanner('Ball Speed +20%!');
      }
    }

    function increaseBallSpeedByPercentage(percent) {
      const multiplier = 1 + percent;
      for (const ball of balls) {
        if (ball.lockedToPaddle) continue;
        ball.vx *= multiplier;
        ball.vy *= multiplier;
        const newSpeed = Math.hypot(ball.vx, ball.vy);
        if (newSpeed > 0) {
          minimumBallSpeed = minimumBallSpeed === null
            ? newSpeed
            : Math.max(minimumBallSpeed, newSpeed);
        }
      }
    }

    function handleSplitBarsCollision(ball, prevBallX, prevBallY) {
      for (const bar of splitBars) {
        if (bar.hp <= 0) continue;
        const barTop = bar.y;
        const barBottom = bar.y + bar.h;
        const barLeft = bar.x;
        const barRight = bar.x + bar.w;
        const intersects =
          ball.x + BALL_R >= barLeft &&
          ball.x - BALL_R <= barRight &&
          ball.y + BALL_R >= barTop &&
          ball.y - BALL_R <= barBottom;
        if (!intersects) continue;

        const prevTop = prevBallY - BALL_R;
        const prevBottom = prevBallY + BALL_R;
        let verticalBounce = false;

        if (ball.vy > 0 && prevBottom <= barTop) {
          ball.y = barTop - BALL_R;
          ball.vy = -Math.abs(ball.vy);
          verticalBounce = true;
        } else if (ball.vy < 0 && prevTop >= barBottom) {
          ball.y = barBottom + BALL_R;
          ball.vy = Math.abs(ball.vy);
          verticalBounce = true;
        } else {
          if (prevBallX + BALL_R <= barLeft) {
            ball.x = barLeft - BALL_R;
          } else if (prevBallX - BALL_R >= barRight) {
            ball.x = barRight + BALL_R;
          }
          ball.vx *= -1;
        }

        if (verticalBounce) {
          const offset = (ball.x - (barLeft + bar.w / 2)) / (bar.w / 2);
          ball.vx += offset * 1.1 * 60;
        }

        enforceMinimumBallSpeed(ball);
        bar.hp = Math.max(0, bar.hp - 1);
        if (bar.hp <= 0) {
          score += 50;
          scoreEl.textContent = score;
        }
        break;
      }
      cleanupSplitBars();
    }

    function cleanupSplitBars() {
      if (!splitBars.length) return;
      splitBars = splitBars.filter(bar => bar.hp > 0);
    }

    function resizeGame() {
      const wrapStyles = getComputedStyle(wrapEl);
      const panelStyles = getComputedStyle(panelEl);
      const stageStyles = getComputedStyle(stageEl);

      const wrapPaddingX = parseFloat(wrapStyles.paddingLeft) + parseFloat(wrapStyles.paddingRight);
      const wrapPaddingY = parseFloat(wrapStyles.paddingTop) + parseFloat(wrapStyles.paddingBottom);
      const panelPaddingX = parseFloat(panelStyles.paddingLeft) + parseFloat(panelStyles.paddingRight);
      const panelPaddingY = parseFloat(panelStyles.paddingTop) + parseFloat(panelStyles.paddingBottom);
      const stagePaddingX = parseFloat(stageStyles.paddingLeft) + parseFloat(stageStyles.paddingRight);
      const stagePaddingY = parseFloat(stageStyles.paddingTop) + parseFloat(stageStyles.paddingBottom);
      const stageBorderX = parseFloat(stageStyles.borderLeftWidth) + parseFloat(stageStyles.borderRightWidth);
      const stageBorderY = parseFloat(stageStyles.borderTopWidth) + parseFloat(stageStyles.borderBottomWidth);

      const viewportW = window.innerWidth || document.documentElement.clientWidth || canvas.width;
      const viewportH = (window.visualViewport ? window.visualViewport.height : window.innerHeight) || document.documentElement.clientHeight || canvas.height;
      const isMobile = viewportW <= 640;

      const horizontalMargin = isMobile ? 0 : 16;
      const maxWrapWidth = isMobile ? viewportW : Math.min(980, Math.max(viewportW - horizontalMargin, 240));
      wrapEl.style.maxWidth = maxWrapWidth + 'px';
      wrapEl.style.width = '100%';

      const actualWrapWidth = wrapEl.clientWidth || maxWrapWidth;
      const availableWidth = actualWrapWidth - wrapPaddingX - panelPaddingX - stagePaddingX - stageBorderX;
      const verticalBuffer = isMobile ? 8 : 24;
      const availableHeight = viewportH - wrapPaddingY - panelPaddingY - stagePaddingY - stageBorderY - headerEl.offsetHeight - hudEl.offsetHeight - verticalBuffer;

      const widthScale = availableWidth > 0 ? availableWidth / canvas.width : Number.POSITIVE_INFINITY;
      const heightScale = availableHeight > 0 ? availableHeight / canvas.height : Number.POSITIVE_INFINITY;

      let scale = Math.min(widthScale, heightScale, 1);
      if (!Number.isFinite(scale)) {
        scale = Math.min(
          widthScale === Number.POSITIVE_INFINITY ? heightScale : widthScale,
          1
        );
      }
      if (!Number.isFinite(scale) || scale <= 0) {
        const safeWidth = widthScale > 0 && Number.isFinite(widthScale) ? widthScale : 1;
        const safeHeight = heightScale > 0 && Number.isFinite(heightScale) ? heightScale : 1;
        scale = Math.min(safeWidth, safeHeight, 1);
        if (scale <= 0) scale = 0.25;
      }

      const displayWidth = canvas.width * scale;
      const displayHeight = canvas.height * scale;

      canvas.style.width = `${displayWidth}px`;
      canvas.style.height = `${displayHeight}px`;

      const containerInnerWidth = actualWrapWidth - wrapPaddingX - panelPaddingX;
      const stageContentMax = Math.max(containerInnerWidth - stagePaddingX - stageBorderX, 0);
      const horizontalLimit = stageContentMax > 0 ? stageContentMax : Math.max(containerInnerWidth, 0);
      const maxStageContentWidth = Math.min(displayWidth, horizontalLimit);
      stageEl.style.maxWidth = '100%';
      stageEl.style.width = `${maxStageContentWidth}px`;
      stageEl.style.margin = '0 auto';
    }

    window.addEventListener('resize', resizeGame);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', resizeGame);
    }
    resizeGame();
  </script>
</body>
