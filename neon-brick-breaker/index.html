  <meta charset="UTF-8" />

  <title>Neon Brick Breaker - Bot Built Arcade</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../images/botbuiltarcade-icon-face.png">
  <style>
    :root {
      --gold: #FFD700;
      --teal: #00FFFF;
      --dark-bg: #0a0a12;
      --accent: #ff3edf;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: radial-gradient(circle at 50% 20%, rgba(0,255,255,0.08), transparent 50%),
                  radial-gradient(circle at 20% 80%, rgba(255,62,223,0.08), transparent 50%),
                  linear-gradient(135deg, #0a0a12 0%, #111122 100%);
      color: #F5F5DC;
      font-family: 'Press Start 2P', cursive;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 0 8px;
    }
    #wrap {
      width: 100%;
      max-width: 980px;
      padding: clamp(14px, 4vw, 24px);
      margin: 0 auto;
      transition: padding 0.2s ease;
    }
    .panel {
      background: rgba(0,0,0,0.7);
      border: 4px solid var(--gold);
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(255,215,0,0.25);
      padding: 18px;
      transition: padding 0.2s ease, border-width 0.2s ease;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .title h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 1px;
      background: linear-gradient(90deg, var(--gold), #ffa500);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .btn {
      display: inline-block;
      text-decoration: none;
      color: white;
      border: 2px solid var(--gold);
      background: linear-gradient(45deg, #5F9EA0, #4682B4);
      padding: 10px 14px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(95,158,160,0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      font-size: 12px;
      white-space: nowrap;
      margin-left: auto;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(95,158,160,0.6); }

    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 8px 0 12px 0;
      font-size: 12px;
      color: #A7E7FF;
      flex-wrap: wrap;
      gap: 8px 16px;
    }
    .hud > div { flex: 1 1 120px; text-align: center; }

    .stage {
      position: relative;
      background: radial-gradient(circle at 50% 20%, rgba(0,255,255,0.05), rgba(0,0,0,0.2)),
                  repeating-linear-gradient( to bottom, rgba(0,255,255,0.06) 0px, rgba(0,255,255,0.06) 2px, transparent 2px, transparent 26px ),
                  radial-gradient(circle at 50% 50%, rgba(255,255,255,0.02), transparent 60%),
                  linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
                  #07070d;
      border-radius: 14px;
      border: 2px solid rgba(0,255,255,0.25);
      box-shadow: inset 0 0 30px rgba(0,255,255,0.25);
      padding: 12px;
      max-width: 100%;
      margin: 0 auto;
      transition: padding 0.2s ease, border-width 0.2s ease;
    }

    canvas { width: 100%; height: auto; display: block; background: transparent; touch-action: none; }

    #upgrade-banner {
      position: absolute;
      top: 22%;
      left: 50%;
      transform: translate(-50%, -20px) scale(0.9);
      font-size: clamp(6.5px, 1.5vw, 11px);
      color: var(--gold);
      text-shadow: 0 0 16px rgba(0, 255, 255, 0.8), 0 0 32px rgba(255, 62, 223, 0.6);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }

    #upgrade-banner.show {
      animation: upgradeFade 2.6s ease forwards;
    }

    @keyframes upgradeFade {
      0% {
        opacity: 0;
        transform: translate(-50%, -40px) scale(0.7);
      }
      10% {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
      70% {
        opacity: 1;
        transform: translate(-50%, 6px) scale(1.04);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, 40px) scale(0.92);
      }
    }

    .overlay {
      position: absolute;
      inset: 12px;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 10px;
      background: rgba(0,0,0,0.6);
      border: 2px dashed rgba(255,215,0,0.4);
      touch-action: none;
    }
    .overlay.show { display: flex; }
    .overlay h2 { margin: 0 0 12px 0; font-size: 18px; color: var(--gold); }
    .overlay p { margin: 4px 0; font-size: 12px; color: #9fd; }

    .controls { margin-top: 10px; font-size: 11px; color: #8ec; opacity: 0.9; }

    @media (max-width: 640px) {
      body {
        align-items: stretch;
        justify-content: flex-start;
        padding: 6px;
      }

      #wrap {
        max-width: none;
        padding: 8px;
      }

      .panel {
        padding: 14px;
        border-width: 3px;
      }

      header {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      .btn {
        width: 100%;
        text-align: center;
        font-size: 11px;
        padding: 10px;
      }

      .hud {
        font-size: 11px;
        gap: 6px 10px;
      }

      .hud > div {
        flex: 1 1 80px;
      }

      .stage {
        padding: 6px;
        border-width: 1.5px;
      }
    }

    @media (max-width: 560px) {
      .title h1 { font-size: 18px; }
      .btn {
        font-size: 10px;
        padding: 8px 10px;
      }
    }

    @media (max-height: 640px) {
      body { align-items: flex-start; padding-top: 16px; }
    }
  </style>

<body>
  <div id="wrap">
    <div class="panel">
      <header>
        <div class="title">
          <img src="../images/botbuiltarcade-icon-face.png" alt="BotBuilt" width="36" height="36" style="border-radius:50%; border:2px solid var(--gold)"> 
          <div>
            <h1>Neon Brick Breaker</h1>
          </div>
        </div>
        <a class="btn" href="../index.html">⟵ Back to Home</a>
      </header>

      <div class="hud">
        <div>Score: <span id="score">0</span></div>
        <div>Level: <span id="level">1</span></div>
        <div>Lives: <span id="lives">3</span></div>
      </div>

      <div class="stage">
        <canvas id="game" width="900" height="600"></canvas>
        <div id="upgrade-banner"></div>
        <div class="overlay" id="overlay">
          <div>
            <h2 id="ov-title">Neon Brick Breaker</h2>
            <p id="ov-sub">Tap/Click or press Space to launch</p>
            <div class="controls">Move: Arrow Keys / A & D / Drag. Pause: P</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Assets
    const imgPaddle = new Image(); imgPaddle.src = 'assets/neon_paddle.svg';
    const imgBall = new Image();   imgBall.src   = 'assets/neon_ball.svg';
    const imgBrick1 = new Image(); imgBrick1.src = 'assets/neon_brick_blue.svg';
    const imgBrick2 = new Image(); imgBrick2.src = 'assets/neon_brick_pink.svg';

    let assetsLoaded = 0;
    const needed = 4;
    [imgPaddle, imgBall, imgBrick1, imgBrick2].forEach(img => {
      img.addEventListener('load', () => {
        assetsLoaded++;
        if (assetsLoaded === needed) init();
      });
    });

    // HUD
    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const livesEl = document.getElementById('lives');
    const overlayEl = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const ovSub = document.getElementById('ov-sub');
    const wrapEl = document.getElementById('wrap');
    const panelEl = document.querySelector('.panel');
    const stageEl = document.querySelector('.stage');
    const headerEl = document.querySelector('header');
    const hudEl = document.querySelector('.hud');
    const upgradeBanner = document.getElementById('upgrade-banner');

    // Game constants (canvas is 900x600 logical)
    const PADDLE_W = 200, PADDLE_H = 28;
    const PADDLE_Y = 560;
    const BALL_R = 16; // ball image ~48 px, we will scale

    const BRICK_W = 110, BRICK_H = 30, BRICK_GAP = 10;
    const BRICK_ROWS_START = 4, BRICK_COLS = 7;

    const SPECIAL_BAR_PHASES = [
      { color: 'red', type: 'solid', duration: 4 },
      { color: 'green', type: 'flash', duration: 0.8 },
      { color: 'green', type: 'solid', duration: 2 },
      { color: 'red', type: 'flash', duration: 0.8 },
    ];

    const SPECIAL_BAR = {
      w: 180,
      h: 24,
      x: 0,
      y: 42,
      speed: 3.4 * 60,
      dir: 1,
      maxHp: 3,
      hp: 3,
      stateIndex: 0,
      stateTime: 0,
      flashTimer: 0.12,
      flashInterval: 0.12,
      flashVisible: true
    };

    let splitBars = [];

    // Game state
    let running = false, paused = false;
    let score = 0, level = 1, lives = 3;
    let paddleX = (canvas.width - PADDLE_W) / 2;
    let ballX = canvas.width / 2, ballY = PADDLE_Y - BALL_R - 2;
    let ballVX = 0, ballVY = 0;
    let minimumBallSpeed = null;
    let bricks = [];
    let lastTime = 0;
    let magnetActive = false;
    let magnetTimer = 0;
    let magnetPulse = 0;
    let magnetLockedSpeed = null;

    const input = { left:false, right:false };
    // Leaderboard integration
    const GAME_ID = 'neon-brick-breaker';
    let gameOverHandled = false;

    function init() {
      resetLevel(1);
      showOverlay('Neon Brick Breaker', 'Tap/Click or press Space to launch');
      render();
      lastTime = 0;
      requestAnimationFrame(loop);
      attachControls();
      resizeGame();
    }

    function attachControls() {
      window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
        if (e.code === 'Space') launch();
        if (e.code === 'KeyP') togglePause();
      });
      window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
      });
      function movePaddle(e) {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        // Convert to canvas space
        const scale = canvas.width / rect.width;
        const cx = x * scale;
        paddleX = Math.max(0, Math.min(canvas.width - PADDLE_W, cx - PADDLE_W/2));
      }
      [canvas, overlayEl].forEach(el => {
        el.addEventListener('pointerdown', (e) => { movePaddle(e); launch(); });
        el.addEventListener('pointermove', movePaddle);
      });
    }

    function togglePause() {
      paused = !paused;
      if (paused) {
        showOverlay('Paused', 'Press P to resume');
      } else {
        hideOverlay();
        lastTime = performance.now();
      }
    }

    function showOverlay(title, sub) {
      ovTitle.textContent = title;
      ovSub.textContent = sub;
      overlayEl.classList.add('show');
    }
    function hideOverlay(){ overlayEl.classList.remove('show'); }

    function captureInitialBallSpeed() {
      if (minimumBallSpeed === null) {
        const speed = Math.hypot(ballVX, ballVY);
        if (speed > 0) minimumBallSpeed = speed;
      }
    }

    function enforceMinimumBallSpeed() {
      if (minimumBallSpeed === null) return;
      const currentSpeed = Math.hypot(ballVX, ballVY);
      if (currentSpeed === 0) return;
      if (currentSpeed < minimumBallSpeed) {
        const scale = minimumBallSpeed / currentSpeed;
        ballVX *= scale;
        ballVY *= scale;
      }
    }

    function resetBall(servingRight = Math.random() > 0.5) {
      minimumBallSpeed = null;
      ballX = paddleX + PADDLE_W/2;
      ballY = PADDLE_Y - BALL_R - 2;
      const angle = (Math.random()*0.5 + 0.8) * (servingRight ? 1 : -1); // direction
      const baseSpeed = (6 + level * 0.8) * 0.75 * 60;
      const levelSpeedMultiplier = 1 + Math.max(0, level - 1) * 0.02;
      const speed = baseSpeed * levelSpeedMultiplier;
      ballVX = Math.cos(angle) * speed;
      ballVY = -Math.abs(Math.sin(angle) * speed) - 120;
      captureInitialBallSpeed();
      enforceMinimumBallSpeed();
      running = true;
    }

    function resetLevel(n) {
      level = n;
      levelEl.textContent = level;
      const rows = BRICK_ROWS_START + Math.floor((level-1)%4);
      const topOffset = 80;
      const totalWidth = BRICK_COLS*BRICK_W + (BRICK_COLS-1)*BRICK_GAP;
      const leftOffset = (canvas.width - totalWidth)/2;
      bricks = [];
      for (let r=0; r<rows; r++) {
        for (let c=0; c<BRICK_COLS; c++) {
          bricks.push({
            x: leftOffset + c*(BRICK_W+BRICK_GAP),
            y: topOffset + r*(BRICK_H+BRICK_GAP),
            w: BRICK_W,
            h: BRICK_H,
            hp: 1 + Math.floor((level-1)/3),
            img: (r%2===0) ? imgBrick1 : imgBrick2,
            alive: true
          });
        }
      }
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      paddleX = (canvas.width - PADDLE_W) / 2;
      ballX = canvas.width / 2; ballY = PADDLE_Y - BALL_R - 2;
      ballVX = 0; ballVY = 0; running = false; paused = false;
      minimumBallSpeed = null;
      SPECIAL_BAR.x = (canvas.width - SPECIAL_BAR.w) / 2;
      SPECIAL_BAR.dir = Math.random() > 0.5 ? 1 : -1;
      SPECIAL_BAR.speed = (3.4 + Math.min(level - 1, 6) * 0.35) * 60;
      SPECIAL_BAR.hp = SPECIAL_BAR.maxHp;
      SPECIAL_BAR.stateIndex = 0;
      SPECIAL_BAR.stateTime = 0;
      SPECIAL_BAR.flashTimer = SPECIAL_BAR.flashInterval;
      SPECIAL_BAR.flashVisible = true;
      splitBars = [];
      showOverlay('Level ' + level, 'Tap/Click or press Space to launch');
      magnetActive = false;
      magnetTimer = 0;
      magnetPulse = 0;
      magnetLockedSpeed = null;
      resizeGame();
    }

    function launch() {
      if (paused) { togglePause(); return; }
      if (!running) {
        hideOverlay();
        resetBall();
      }
    }

    function update(dt) {
      // Paddle movement
      const paddleSpeed = (9 + level*0.4) * 60;
      if (input.left) paddleX -= paddleSpeed * dt;
      if (input.right) paddleX += paddleSpeed * dt;
      paddleX = Math.max(0, Math.min(canvas.width - PADDLE_W, paddleX));

      // Special bar movement handled in main loop

      // Ball physics
      if (magnetActive && ballVY > 0) {
        const targetX = paddleX + PADDLE_W / 2;
        const targetY = PADDLE_Y + PADDLE_H / 2;
        let speed = magnetLockedSpeed;
        if (!speed || speed <= 0) {
          const currentSpeed = Math.hypot(ballVX, ballVY);
          if (currentSpeed > 0) {
            speed = currentSpeed;
          } else if (minimumBallSpeed) {
            speed = minimumBallSpeed;
          } else {
            speed = 0;
          }
          if (speed > 0) magnetLockedSpeed = speed;
        }
        if (speed > 0) {
          const dx = targetX - ballX;
          const dy = targetY - ballY;
          const dist = Math.hypot(dx, dy);
          if (dist > 1) {
            ballVX = (dx / dist) * speed;
            ballVY = (dy / dist) * speed;
          } else {
            ballVX = 0;
            ballVY = speed;
          }
        }
      }

      const prevBallX = ballX;
      const prevBallY = ballY;
      ballX += ballVX * dt; ballY += ballVY * dt;

      // Walls
      if (ballX - BALL_R < 0) { ballX = BALL_R; ballVX *= -1; }
      if (ballX + BALL_R > canvas.width) { ballX = canvas.width - BALL_R; ballVX *= -1; }
      if (ballY - BALL_R < 0) { ballY = BALL_R; ballVY *= -1; }

      // Special bar collision (underside deflection)
      if (SPECIAL_BAR.hp > 0) {
        const barLeft = SPECIAL_BAR.x;
        const barRight = SPECIAL_BAR.x + SPECIAL_BAR.w;
        const barTop = SPECIAL_BAR.y;
        const barBottom = SPECIAL_BAR.y + SPECIAL_BAR.h;
        if (ballVY < 0 && ballY + BALL_R >= barTop && ballY - BALL_R <= barBottom && ballX >= barLeft && ballX <= barRight) {
          ballY = barBottom + BALL_R;
          ballVY *= -1;
          const offset = (ballX - (barLeft + SPECIAL_BAR.w / 2)) / (SPECIAL_BAR.w / 2);
          ballVX += offset * 1.2 * 60;
          SPECIAL_BAR.hp = Math.max(0, SPECIAL_BAR.hp - 1);
          if (SPECIAL_BAR.hp > 0) {
            score += 20;
          } else {
            score += 50;
            handleSpecialBarDestroyed();
          }
          scoreEl.textContent = score;
        }
      } else if (splitBars.length) {
        handleSplitBarsCollision();
      }

      // Bottom
      if (ballY - BALL_R > canvas.height) {
        lives--; livesEl.textContent = lives;
        if (lives <= 0) {
          running = false;
          showOverlay('Game Over', 'Press Space to restart');
          if (!gameOverHandled) { gameOverHandled = true; maybeSubmitLeaderboard().catch(console.error); }
          // Reset whole game on space
          window.addEventListener('keydown', restartOnce, { once: true });
        } else {
          running = false;
          showOverlay('Life Lost', 'Tap/Click or press Space to relaunch');
          ballVX = ballVY = 0;
          ballX = paddleX + PADDLE_W/2; ballY = PADDLE_Y - BALL_R - 2;
          magnetActive = false;
          magnetTimer = 0;
          magnetPulse = 0;
          magnetLockedSpeed = null;
        }
      }

      // Paddle collision
      if (ballY + BALL_R >= PADDLE_Y && ballY + BALL_R <= PADDLE_Y + PADDLE_H) {
        if (ballX >= paddleX && ballX <= paddleX + PADDLE_W && ballVY > 0) {
          ballY = PADDLE_Y - BALL_R - 1;
          if (magnetActive) {
            const reboundSpeed = magnetLockedSpeed ?? Math.hypot(ballVX, ballVY);
            ballX = paddleX + PADDLE_W / 2;
            ballVX = 0;
            if (reboundSpeed && reboundSpeed > 0) {
              ballVY = -Math.abs(reboundSpeed);
            } else {
              const fallbackSpeed = minimumBallSpeed || (6 + level * 0.8) * 0.75 * 60;
              ballVY = -Math.abs(fallbackSpeed);
            }
            magnetLockedSpeed = Math.abs(ballVY);
          } else {
            // Reflect based on where it hit the paddle
            const hit = (ballX - (paddleX + PADDLE_W/2)) / (PADDLE_W/2);
            const speed = Math.sqrt(ballVX*ballVX + ballVY*ballVY) * 1.03;
            const angle = hit * 1.0; // -1..1 rad
            ballVX = speed * Math.sin(angle);
            ballVY = -Math.abs(speed * Math.cos(angle));
            enforceMinimumBallSpeed();
          }
        }
      }

      // Brick collisions
      let remaining = 0;
      for (const br of bricks) {
        if (!br.alive) continue; remaining++;
        // AABB collision approximation with ball as circle
        if (ballX + BALL_R > br.x && ballX - BALL_R < br.x + br.w &&
            ballY + BALL_R > br.y && ballY - BALL_R < br.y + br.h) {
          // Determine shallowest penetration axis
          const prevX = prevBallX;
          const prevY = prevBallY;
          const wasAbove = prevY + BALL_R <= br.y;
          const wasBelow = prevY - BALL_R >= br.y + br.h;
          if (wasAbove || wasBelow) {
            ballVY *= -1; // vertical flip
          } else {
            ballVX *= -1; // horizontal flip
          }
          br.hp -= 1;
          if (br.hp <= 0) { br.alive = false; score += 50; }
          else { score += 20; }
          scoreEl.textContent = score;
          if (!br.alive) {
            increaseBallSpeedForBrickBreak();
          }
          enforceMinimumBallSpeed();
          break;
        }
      }

      enforceMinimumBallSpeed();

      if (remaining === 0) {
        // Next level
        score += 200; scoreEl.textContent = score;
        running = false;
        resetLevel(level + 1);
      }
    }

    function increaseBallSpeedForBrickBreak() {
      const boostMultiplier = 1 + level * 0.005;
      ballVX *= boostMultiplier;
      ballVY *= boostMultiplier;
      const currentSpeed = Math.hypot(ballVX, ballVY);
      if (currentSpeed > 0) {
        minimumBallSpeed = minimumBallSpeed === null
          ? currentSpeed
          : Math.max(minimumBallSpeed, currentSpeed);
      }
    }

    function restartOnce(e) {
      if (e.code === 'Space') {
        score = 0; lives = 3; level = 1;
        scoreEl.textContent = score; livesEl.textContent = lives; levelEl.textContent = level;
        gameOverHandled = false;
        resetLevel(1);
      }
    }

    async function maybeSubmitLeaderboard() {
      let dest = `../leaderboard.html?gameId=${encodeURIComponent(GAME_ID)}`;
      try {
        const res = await fetch(`/api/leaderboard/rank?gameId=${encodeURIComponent(GAME_ID)}&score=${encodeURIComponent(score)}`, {
          headers: { 'Accept': 'application/json' }
        });
        if (res.ok) {
          const data = await res.json();
          const rank = Number(data?.rank);
          const qualifies = Number.isFinite(rank) && rank > 0 && rank <= 20;
          if (qualifies) {
            let name = prompt(`New High Score! You placed #${rank}. Enter your name (max 20 chars):`, '');
            if (name != null) {
              name = name.trim().replace(/[^\w \-'.!]/g, '').slice(0, 20);
              if (name) {
                let submitted = false;
                try {
                  await fetch('/api/leaderboard/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ gameId: GAME_ID, name, score })
                  });
                  submitted = true;
                } catch {}
                if (submitted) {
                  dest += `&highlightRank=${encodeURIComponent(rank)}`;
                }
              }
            }
          }
        }
      } catch (e) {
        console.error(e);
      } finally {
        location.href = dest;
      }
    }

    function activateMagnetUpgrade() {
      magnetActive = true;
      magnetTimer = 15;
      magnetPulse = 0;
      const currentSpeed = Math.hypot(ballVX, ballVY);
      if (currentSpeed > 0) {
        magnetLockedSpeed = currentSpeed;
      } else if (minimumBallSpeed) {
        magnetLockedSpeed = minimumBallSpeed;
      }
      showUpgradeBanner('Upgrade: Magnet Paddle!');
    }

    function showUpgradeBanner(text) {
      upgradeBanner.textContent = text;
      upgradeBanner.classList.remove('show');
      void upgradeBanner.offsetWidth;
      upgradeBanner.classList.add('show');
    }

    function drawNeonGrid() {
      // subtle glow grid for retro vibe
      ctx.save();
      ctx.strokeStyle = 'rgba(0,255,255,0.05)';
      ctx.lineWidth = 1;
      const step = 40;
      for (let x=0; x<=canvas.width; x+=step) {
        ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
      }
      for (let y=0; y<=canvas.height; y+=step) {
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
      }
      ctx.restore();
    }

    function render() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      drawNeonGrid();

      // Draw bricks
      for (const br of bricks) {
        if (!br.alive) continue;
        const img = br.img;
        ctx.drawImage(img, br.x, br.y, br.w, br.h);
      }

      drawSpecialBar();

      // Draw paddle
      if (magnetActive) {
        ctx.save();
        const pulse = 0.65 + Math.sin(magnetPulse * 6) * 0.25;
        const glowSize = 24 + Math.sin(magnetPulse * 8) * 6;
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = `rgba(0, 255, 255, ${0.18 + pulse * 0.18})`;
        ctx.shadowColor = 'rgba(0, 255, 255, 0.85)';
        ctx.shadowBlur = glowSize;
        ctx.fillRect(paddleX - 6, PADDLE_Y - 8, PADDLE_W + 12, PADDLE_H + 16);
        ctx.restore();
      }

      ctx.drawImage(imgPaddle, paddleX, PADDLE_Y, PADDLE_W, PADDLE_H);

      // Draw ball (centered)
      ctx.drawImage(imgBall, ballX - BALL_R*1.5, ballY - BALL_R*1.5, BALL_R*3, BALL_R*3);
    }

    function loop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;

      if (SPECIAL_BAR.hp > 0) {
        updateSpecialBarState(dt);
        if (running && !paused) {
          updateSpecialBarMovement(dt);
        }
      } else if (splitBars.length) {
        if (running && !paused) {
          updateSplitBars(dt);
        }
      }

      updateMagnet(dt);
      if (running && !paused) update(dt);
      render();
      requestAnimationFrame(loop);
    }

    function updateMagnet(dt) {
      if (magnetActive) {
        magnetTimer -= dt;
        magnetPulse += dt;
        if (magnetTimer <= 0) {
          magnetActive = false;
          magnetTimer = 0;
          magnetLockedSpeed = null;
        }
      } else if (magnetPulse !== 0) {
        magnetPulse = 0;
        magnetLockedSpeed = null;
      }
    }

    function drawSpecialBar() {
      if (SPECIAL_BAR.hp > 0) {
        if (isSpecialBarFlashing() && !SPECIAL_BAR.flashVisible) return;
        ctx.save();
        const { x, y, w, h, hp, maxHp } = SPECIAL_BAR;
        const damageRatio = hp / maxHp;
        const alpha = damageRatio === 1 ? 0.92 : damageRatio >= 2/3 ? 0.78 : 0.62;
        const color = getSpecialBarColor();
        const grad = ctx.createLinearGradient(x, y, x + w, y);
        if (color === 'green') {
          grad.addColorStop(0, `rgba(80, 255, 140, ${alpha})`);
          grad.addColorStop(0.5, `rgba(20, 200, 120, ${alpha})`);
          grad.addColorStop(1, `rgba(120, 255, 200, ${alpha})`);
          ctx.shadowColor = 'rgba(80, 255, 180, 0.7)';
        } else {
          grad.addColorStop(0, `rgba(255, 90, 90, ${alpha})`);
          grad.addColorStop(0.5, `rgba(255, 30, 0, ${alpha})`);
          grad.addColorStop(1, `rgba(255, 160, 80, ${alpha})`);
          ctx.shadowColor = 'rgba(255, 80, 60, 0.7)';
        }
        ctx.fillStyle = grad;
        ctx.shadowBlur = 12 * damageRatio + (color === 'green' ? 6 : 0);
        ctx.fillRect(x, y, w, h);
        ctx.shadowBlur = 0;
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.strokeRect(x, y, w, h);

        // Draw crack detail as HP decreases
        if (hp <= maxHp - 1) {
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = 'rgba(255,255,255,0.35)';
          ctx.beginPath();
          ctx.moveTo(x + w * 0.22, y + h * 0.2);
          ctx.lineTo(x + w * 0.45, y + h * 0.45);
          ctx.lineTo(x + w * 0.38, y + h * 0.82);
          ctx.stroke();
        }
        if (hp <= maxHp - 2) {
          ctx.beginPath();
          ctx.moveTo(x + w * 0.68, y + h * 0.18);
          ctx.lineTo(x + w * 0.52, y + h * 0.5);
          ctx.lineTo(x + w * 0.56, y + h * 0.88);
          ctx.moveTo(x + w * 0.08, y + h * 0.62);
          ctx.lineTo(x + w * 0.28, y + h * 0.42);
          ctx.lineTo(x + w * 0.48, y + h * 0.5);
          ctx.stroke();
        }

        ctx.restore();
      } else if (splitBars.length) {
        ctx.save();
        for (const bar of splitBars) {
          ctx.shadowColor = 'rgba(255, 80, 60, 0.55)';
          ctx.shadowBlur = 14;
          ctx.fillStyle = 'rgba(255, 70, 70, 0.9)';
          ctx.fillRect(bar.x, bar.y, bar.w, bar.h);
          ctx.shadowBlur = 0;
          ctx.strokeStyle = 'rgba(255,255,255,0.28)';
          ctx.lineWidth = 1.6;
          ctx.strokeRect(bar.x, bar.y, bar.w, bar.h);
        }
        ctx.restore();
      }
    }

    function getSpecialBarPhase() {
      return SPECIAL_BAR_PHASES[SPECIAL_BAR.stateIndex] || SPECIAL_BAR_PHASES[0];
    }

    function getSpecialBarColor() {
      return getSpecialBarPhase().color;
    }

    function isSpecialBarFlashing() {
      return getSpecialBarPhase().type === 'flash';
    }

    function isSpecialBarGreen() {
      return getSpecialBarColor() === 'green';
    }

    function updateSpecialBarState(dt) {
      if (SPECIAL_BAR.hp <= 0) return;
      const phase = getSpecialBarPhase();
      SPECIAL_BAR.stateTime += dt;
      if (phase.type === 'flash') {
        SPECIAL_BAR.flashTimer -= dt;
        if (SPECIAL_BAR.flashTimer <= 0) {
          SPECIAL_BAR.flashVisible = !SPECIAL_BAR.flashVisible;
          SPECIAL_BAR.flashTimer += SPECIAL_BAR.flashInterval;
        }
      } else {
        SPECIAL_BAR.flashVisible = true;
        SPECIAL_BAR.flashTimer = SPECIAL_BAR.flashInterval;
      }
      if (SPECIAL_BAR.stateTime >= phase.duration) {
        SPECIAL_BAR.stateIndex = (SPECIAL_BAR.stateIndex + 1) % SPECIAL_BAR_PHASES.length;
        SPECIAL_BAR.stateTime = 0;
        SPECIAL_BAR.flashTimer = SPECIAL_BAR.flashInterval;
        SPECIAL_BAR.flashVisible = true;
      }
    }

    function updateSpecialBarMovement(dt) {
      const leftBound = 16;
      const rightBound = canvas.width - SPECIAL_BAR.w - 16;
      SPECIAL_BAR.x += SPECIAL_BAR.speed * SPECIAL_BAR.dir * dt;
      if (SPECIAL_BAR.x <= leftBound) {
        SPECIAL_BAR.x = leftBound;
        SPECIAL_BAR.dir = 1;
      } else if (SPECIAL_BAR.x >= rightBound) {
        SPECIAL_BAR.x = rightBound;
        SPECIAL_BAR.dir = -1;
      }
    }

    function spawnSplitBars() {
      const baseSpeed = SPECIAL_BAR.speed * 0.95;
      const segmentWidth = SPECIAL_BAR.w * 0.45;
      const gap = Math.max(10, SPECIAL_BAR.w * 0.1);
      const center = SPECIAL_BAR.x + SPECIAL_BAR.w / 2;
      const leftStart = Math.max(16, center - gap / 2 - segmentWidth);
      const rightStart = Math.min(canvas.width - segmentWidth - 16, center + gap / 2);
      splitBars = [
        { x: leftStart, y: SPECIAL_BAR.y, w: segmentWidth, h: SPECIAL_BAR.h, dir: -1, speed: baseSpeed },
        { x: rightStart, y: SPECIAL_BAR.y, w: segmentWidth, h: SPECIAL_BAR.h, dir: 1, speed: baseSpeed }
      ];
    }

    function updateSplitBars(dt) {
      const leftWall = 16;
      const rightWall = canvas.width - 16;
      for (const bar of splitBars) {
        bar.x += bar.speed * bar.dir * dt;
        if (bar.x <= leftWall) {
          bar.x = leftWall;
          bar.dir = 1;
        } else if (bar.x + bar.w >= rightWall) {
          bar.x = rightWall - bar.w;
          bar.dir = -1;
        }
      }

      if (splitBars.length >= 2) {
        const a = splitBars[0];
        const b = splitBars[1];
        let left = a;
        let right = b;
        if (a.x > b.x) {
          left = b;
          right = a;
        }
        if (left.x + left.w >= right.x) {
          const overlap = (left.x + left.w) - right.x;
          if (overlap > 0) {
            left.x -= overlap / 2;
            right.x += overlap / 2;
          }
          left.dir = -1;
          right.dir = 1;
        }
      }
    }

    function handleSpecialBarDestroyed() {
      const destroyedWhileGreen = isSpecialBarGreen();
      if (destroyedWhileGreen) {
        lives += 1;
        livesEl.textContent = lives;
        showUpgradeBanner('Bonus Life!');
      } else {
        spawnSplitBars();
        increaseBallSpeedByPercentage(0.2);
        showUpgradeBanner('Ball Speed +20%!');
      }
    }

    function increaseBallSpeedByPercentage(percent) {
      const multiplier = 1 + percent;
      ballVX *= multiplier;
      ballVY *= multiplier;
      const newSpeed = Math.hypot(ballVX, ballVY);
      if (newSpeed > 0) {
        minimumBallSpeed = minimumBallSpeed === null
          ? newSpeed
          : Math.max(minimumBallSpeed, newSpeed);
      }
    }

    function handleSplitBarsCollision() {
      for (const bar of splitBars) {
        const barTop = bar.y;
        const barBottom = bar.y + bar.h;
        const barLeft = bar.x;
        const barRight = bar.x + bar.w;
        if (ballVY < 0 && ballY + BALL_R >= barTop && ballY - BALL_R <= barBottom && ballX >= barLeft && ballX <= barRight) {
          ballY = barBottom + BALL_R;
          ballVY *= -1;
          const offset = (ballX - (barLeft + bar.w / 2)) / (bar.w / 2);
          ballVX += offset * 1.1 * 60;
          enforceMinimumBallSpeed();
        }
      }
    }

    function resizeGame() {
      const wrapStyles = getComputedStyle(wrapEl);
      const panelStyles = getComputedStyle(panelEl);
      const stageStyles = getComputedStyle(stageEl);

      const wrapPaddingX = parseFloat(wrapStyles.paddingLeft) + parseFloat(wrapStyles.paddingRight);
      const wrapPaddingY = parseFloat(wrapStyles.paddingTop) + parseFloat(wrapStyles.paddingBottom);
      const panelPaddingX = parseFloat(panelStyles.paddingLeft) + parseFloat(panelStyles.paddingRight);
      const panelPaddingY = parseFloat(panelStyles.paddingTop) + parseFloat(panelStyles.paddingBottom);
      const stagePaddingX = parseFloat(stageStyles.paddingLeft) + parseFloat(stageStyles.paddingRight);
      const stagePaddingY = parseFloat(stageStyles.paddingTop) + parseFloat(stageStyles.paddingBottom);
      const stageBorderX = parseFloat(stageStyles.borderLeftWidth) + parseFloat(stageStyles.borderRightWidth);
      const stageBorderY = parseFloat(stageStyles.borderTopWidth) + parseFloat(stageStyles.borderBottomWidth);

      const viewportW = window.innerWidth || document.documentElement.clientWidth || canvas.width;
      const viewportH = (window.visualViewport ? window.visualViewport.height : window.innerHeight) || document.documentElement.clientHeight || canvas.height;
      const isMobile = viewportW <= 640;

      const horizontalMargin = isMobile ? 0 : 16;
      const maxWrapWidth = isMobile ? viewportW : Math.min(980, Math.max(viewportW - horizontalMargin, 240));
      wrapEl.style.maxWidth = maxWrapWidth + 'px';
      wrapEl.style.width = '100%';

      const actualWrapWidth = wrapEl.clientWidth || maxWrapWidth;
      const availableWidth = actualWrapWidth - wrapPaddingX - panelPaddingX - stagePaddingX - stageBorderX;
      const verticalBuffer = isMobile ? 8 : 24;
      const availableHeight = viewportH - wrapPaddingY - panelPaddingY - stagePaddingY - stageBorderY - headerEl.offsetHeight - hudEl.offsetHeight - verticalBuffer;

      const widthScale = availableWidth > 0 ? availableWidth / canvas.width : Number.POSITIVE_INFINITY;
      const heightScale = availableHeight > 0 ? availableHeight / canvas.height : Number.POSITIVE_INFINITY;

      let scale = Math.min(widthScale, heightScale, 1);
      if (!Number.isFinite(scale)) {
        scale = Math.min(
          widthScale === Number.POSITIVE_INFINITY ? heightScale : widthScale,
          1
        );
      }
      if (!Number.isFinite(scale) || scale <= 0) {
        const safeWidth = widthScale > 0 && Number.isFinite(widthScale) ? widthScale : 1;
        const safeHeight = heightScale > 0 && Number.isFinite(heightScale) ? heightScale : 1;
        scale = Math.min(safeWidth, safeHeight, 1);
        if (scale <= 0) scale = 0.25;
      }

      const displayWidth = canvas.width * scale;
      const displayHeight = canvas.height * scale;

      canvas.style.width = `${displayWidth}px`;
      canvas.style.height = `${displayHeight}px`;

      const containerInnerWidth = actualWrapWidth - wrapPaddingX - panelPaddingX;
      const stageContentMax = Math.max(containerInnerWidth - stagePaddingX - stageBorderX, 0);
      const horizontalLimit = stageContentMax > 0 ? stageContentMax : Math.max(containerInnerWidth, 0);
      const maxStageContentWidth = Math.min(displayWidth, horizontalLimit);
      stageEl.style.maxWidth = '100%';
      stageEl.style.width = `${maxStageContentWidth}px`;
      stageEl.style.margin = '0 auto';
    }

    window.addEventListener('resize', resizeGame);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', resizeGame);
    }
    resizeGame();
  </script>
</body>
