<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfd"/>
      <stop offset="1" stop-color="#cfd3d8"/>
    </linearGradient>
    <linearGradient id="gNose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7b00"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="gFlame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ff6a00"/>
    </linearGradient>
  </defs>
  <!-- soft outer glow -->
  <g opacity=".35">
    <ellipse cx="32" cy="36" rx="10" ry="26" fill="#ffa500"/>
  </g>
  <!-- fins -->
  <path d="M22 36 L10 42 L18 30 Z" fill="#00e5ff" opacity=".9"/>
  <path d="M42 36 L54 42 L46 30 Z" fill="#00e5ff" opacity=".9"/>
  <!-- body -->
  <rect x="26" y="16" width="12" height="30" rx="6" fill="url(#gBody)" stroke="#7f8a91" stroke-width="1"/>
  <!-- nose cone -->
  <path d="M32 8 L40 16 L24 16 Z" fill="url(#gNose)" stroke="#c55700" stroke-width="1"/>
  <!-- engine ring -->
  <circle cx="32" cy="46" r="6" fill="#1b2a3a" stroke="#7f8a91" stroke-width="1"/>
  <circle cx="32" cy="46" r="3" fill="#2b3b4b"/>
  <!-- flame -->
  <path d="M32 54 C28 54 24 58 24 62 C24 60 40 60 40 62 C40 58 36 54 32 54 Z" fill="url(#gFlame)"/>
</svg>
