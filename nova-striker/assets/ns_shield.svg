<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#4df" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#bff"/>
      <stop offset="100%" stop-color="#5fd"/>
    </linearGradient>
  </defs>
  <!-- soft outer glow -->
  <circle cx="32" cy="32" r="30" fill="url(#glow)"/>
  <!-- ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#00e5ff" stroke-width="3"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#9ff" stroke-width="1" opacity="0.5"/>
  <!-- shield emblem -->
  <g transform="translate(32 28)">
    <path d="M 0 -12 C 6 -10 10 -8 10 -3 C 10 7 3 14 0 16 C -3 14 -10 7 -10 -3 C -10 -8 -6 -10 0 -12 Z"
          fill="url(#face)" stroke="#0be" stroke-width="2"/>
    <path d="M 0 -10 C 4 -9 8 -8 8 -4 C 8 4 2 10 0 11 C -2 10 -8 4 -8 -4 C -8 -8 -4 -9 0 -10 Z"
          fill="#eaffff" opacity="0.35"/>
  </g>
</svg>
