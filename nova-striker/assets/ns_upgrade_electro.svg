<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7df9ff"/>
      <stop offset="1" stop-color="#0a3c4a"/>
    </radialGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bffcff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity=".15"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <!-- outer soft glow -->
  <g opacity=".35" filter="url(#softGlow)">
    <circle cx="32" cy="32" r="28" fill="url(#halo)"/>
  </g>
  <!-- token background -->
  <circle cx="32" cy="32" r="22" fill="url(#bg)" stroke="#89f6ff" stroke-width="2"/>
  <!-- electro orb core -->
  <circle cx="32" cy="32" r="10" fill="#0f2330" stroke="#7df9ff" stroke-width="2"/>
  <!-- lightning bolt pictogram -->
  <path d="M36 18 L28 32 L34 32 L28 46 L40 30 L34 30 Z" fill="#e9fdff" stroke="#6fe9f5" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- small orbiting arcs -->
  <g stroke="#7df9ff" stroke-width="1.5" stroke-linecap="round" opacity=".85">
    <path d="M14 32 q6 -10 18 -10"/>
    <path d="M50 32 q-6 10 -18 10"/>
  </g>
  <!-- down arrow to indicate pickup/upgrade -->
  <path d="M32 9 v8" stroke="#cfffff" stroke-width="2" stroke-linecap="round"/>
  <path d="M28 15 L32 19 L36 15" fill="none" stroke="#cfffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
