<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7bff"/>
      <stop offset="1" stop-color="#7a2ea6"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd6ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ff6bff" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#ff4df0"/>
    </linearGradient>
  </defs>
  <!-- outer soft glow -->
  <g opacity=".35">
    <circle cx="32" cy="32" r="28" fill="url(#glow)"/>
  </g>
  <!-- token background -->
  <circle cx="32" cy="32" r="22" fill="url(#bg)" stroke="#ffc6ff" stroke-width="2"/>
  <!-- laser beam pictogram -->
  <g>
    <rect x="30" y="14" width="4" height="36" rx="2" fill="url(#beam)"/>
    <rect x="28" y="14" width="2" height="36" rx="1" fill="#ffb3f7" opacity=".7"/>
    <rect x="34" y="14" width="2" height="36" rx="1" fill="#ff1fe1" opacity=".6"/>
    <!-- spark marks -->
    <circle cx="32" cy="16" r="2" fill="#fff" opacity=".7"/>
    <path d="M22 22 H28" stroke="#ffd1fb" stroke-width="2" stroke-linecap="round"/>
    <path d="M36 26 H42" stroke="#ff9cf3" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 34 H26" stroke="#ffd1fb" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- down arrow to indicate pickup/upgrade -->
  <path d="M32 10 v8" stroke="#ffe6ff" stroke-width="2" stroke-linecap="round"/>
  <path d="M28 16 L32 20 L36 16" fill="none" stroke="#ffe6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
