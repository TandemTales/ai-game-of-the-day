<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Striker - Bot Built Arcade</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../images/botbuiltarcade-icon-face.png">
  <style>
    :root {
      --gold: #FFD700;
      --teal: #5F9EA0;
      --ink: #F5F5DC;
      --bg1: #0b0f1a;
      --bg2: #121a2a;
      --accent: #ff4d6d;
      --neon: #00e5ff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: radial-gradient(circle at 30% 10%, rgba(0,229,255,0.08), transparent 50%),
                  radial-gradient(circle at 80% 70%, rgba(255,77,109,0.07), transparent 50%),
                  linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--ink);
      font-family: 'Press Start 2P', cursive;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #wrap { width: min(100%, 980px); padding: 20px; }
    .panel {
      background: rgba(0,0,0,0.78);
      border: 4px solid var(--gold);
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(255,215,0,0.25);
      padding: 18px;
    }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .title { display:flex; align-items:center; gap:12px; }
    .title h1 {
      margin: 0; font-size: 22px; letter-spacing: 1px;
      background: linear-gradient(90deg, var(--gold), #ffa500);
      background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .meta { font-size: 12px; color: var(--teal); }
    .btn { display:inline-block; text-decoration:none; color:#fff; border:2px solid var(--gold);
      background: linear-gradient(45deg, var(--teal), #4682B4); padding:10px 14px; border-radius:10px;
      box-shadow: 0 4px 15px rgba(95,158,160,0.4); transition: transform .15s ease, box-shadow .15s ease; font-size:12px; white-space:nowrap; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(95,158,160,0.6); }

    .hud { display:flex; align-items:center; justify-content: space-between; margin: 8px 0 12px; font-size:12px; color:#9fe; }

    .stage { position:relative; background:
        radial-gradient(circle at 50% 20%, rgba(0,229,255,0.06), rgba(0,0,0,0.25)),
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.2)), #060910;
      border-radius: 14px; border: 2px solid rgba(0,229,255,0.25); box-shadow: inset 0 0 30px rgba(0,229,255,0.25);
      padding: 12px; }
    canvas { width: 100%; height: auto; display:block; background: transparent; touch-action: none; }

    .overlay { position:absolute; inset:12px; display:none; align-items:center; justify-content:center; text-align:center; border-radius:10px; background: rgba(0,0,0,0.6); border:2px dashed rgba(255,215,0,0.4); touch-action:none; }
    .overlay.show { display:flex; }
    .overlay h2 { margin:0 0 12px; font-size:18px; color: var(--gold); }
    .overlay p { margin:4px 0; font-size:12px; color:#9fd; }

    .controls { margin-top: 10px; font-size: 11px; color:#8ec; opacity: .9; }

    .wave-banner { position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); padding:10px 20px; background:rgba(0,0,0,0.6); border:2px solid rgba(255,215,0,0.4); border-radius:8px; color:var(--gold); font-size:20px; opacity:0; pointer-events:none; transition:opacity 0.5s; }
    .wave-banner.show { opacity:1; }
    /* Audio toggle icon button */
    .audio-toggle { display:flex; align-items:center; gap:8px; }
    #audioIcon { position: relative; width: 28px; height: 22px; cursor: pointer; border:1px solid rgba(255,215,0,0.35); border-radius:6px; background: rgba(0,0,0,0.25); overflow: hidden; }
    #audioIcon img { width: 100%; height: 100%; object-fit: contain; display:block; }

    @media (max-width: 560px) { .title h1{font-size:18px;} .meta{display:none;} .btn{font-size:10px; padding:8px 10px;} }
  </style>
</head>
<body>
  <div id="wrap">
    <div class="panel">
      <header>
        <div class="title">
          <img src="../images/botbuiltarcade-icon-face.png" alt="BotBuilt" width="36" height="36" style="border-radius:50%; border:2px solid var(--gold)"> 
          <div>
            <h1>Nova Striker</h1>
          </div>
        </div>
        <a class="btn" href="../index.html">⟵ Back to Home</a>
      </header>

      <div class="hud">
        <div>Score: <span id="score">0</span></div>
        <div>Wave: <span id="wave">1</span></div>
        <div>Lives: <span id="lives">5</span></div>
        <div class="audio-toggle" title="Toggle Audio (M)">
          <div id="audioIcon">
            <img id="audioIconImg" src="assets/unmuted.png" alt="Audio">
          </div>
        </div>
      </div>

      <div class="stage">
        <canvas id="game" width="900" height="600"></canvas>
        <div id="wave-banner" class="wave-banner"></div>
        <div class="overlay" id="overlay">
          <div>
            <h2 id="ov-title">Nova Striker</h2>
            <p id="ov-sub">Tap/Click or press Space to launch</p>
            <div class="controls">Move: Arrow Keys / A & D / Drag. Shoot: Auto-fire. Pause: P. Audio: M</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Assets
    const SPRITES = {
      player: new Image(),
      enemyF: new Image(),
      enemyB: new Image(),
      enemyS: new Image(),
      enemyW: new Image(),
      bullet: new Image(),
      eBullet: new Image(),
      boss1: new Image(),
      boss2: new Image(),
      boss3: new Image(),
      upgrade: new Image(),
      life: new Image(),
      shield: new Image(),
      upFire: new Image(),
      upTwin: new Image(),
      upSpread: new Image(),
      meteor: new Image(),
      missile: new Image(),
      upMissile: new Image(),
      upElectro: new Image(),
      upLaser: new Image(),
    };

    SPRITES.player.src = 'assets/ns_player01.png';
    SPRITES.enemyF.src = 'assets/ns_enemy_fighter.png';
    SPRITES.enemyB.src = 'assets/ns_enemy_bomber.png';
    SPRITES.enemyS.src = 'assets/ns_enemy_sniper.svg';
    SPRITES.enemyW.src = 'assets/ns_enemy_weaver.svg';
    SPRITES.bullet.src = 'assets/ns_bullet.svg';
    SPRITES.eBullet.src = 'assets/ns_enemy_bullet.svg';
    SPRITES.boss1.src = 'assets/ns_boss_01.png';
    SPRITES.boss2.src = 'assets/ns_boss_02.png';
    SPRITES.boss3.src = 'assets/ns_boss_03.png';
    SPRITES.upgrade.src = 'assets/ns_upgrade.svg';
    SPRITES.life.src = 'assets/ns_life.svg';
    SPRITES.shield.src = 'assets/ns_shield.svg';
    SPRITES.upFire.src = 'assets/ns_upgrade_fire.svg';
    SPRITES.upTwin.src = 'assets/ns_upgrade_twin.svg';
    SPRITES.upSpread.src = 'assets/ns_upgrade_spread.svg';
    SPRITES.meteor.src = 'assets/ns_meteor.svg';
    SPRITES.missile.src = 'assets/ns_missile.svg';
    SPRITES.upMissile.src = 'assets/ns_upgrade_missile.svg';
    SPRITES.upElectro.src = 'assets/ns_upgrade_electro.svg';
    SPRITES.upLaser.src = 'assets/ns_upgrade_laser.svg';

    const MUSIC = {
      normal: new Audio('assets/Game_Score_01.mp3'),
      boss: new Audio('assets/Game_Score_02.mp3')
    };
    MUSIC.normal.loop = true;
    MUSIC.boss.loop = true;
    let currentMusic = MUSIC.normal;

    let loaded = 0; const needed = Object.keys(SPRITES).length;
    for (const k in SPRITES) SPRITES[k].addEventListener('load', () => { if (++loaded === needed) init(); });

    // HUD
    const scoreEl = document.getElementById('score');
    const waveEl = document.getElementById('wave');
    const livesEl = document.getElementById('lives');
    const overlayEl = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const ovSub = document.getElementById('ov-sub');
    const waveBanner = document.getElementById('wave-banner');
    const audioIcon = document.getElementById('audioIcon');
    const audioIconImg = document.getElementById('audioIconImg');

    // Game constants
    const GAME_ID = 'nova-striker';
    const W = canvas.width, H = canvas.height;
    const P = { x: W/2, y: H-80, w: 54, h: 60, speed: 8 };
    const B = { w: 8, h: 20, speed: 13, cooldown: 0.60, baseCooldown: 0.60 };
    const EB = { w: 8, h: 18, speed: 7 };
    const MISS = { w: 21, h: 36, speed: 7.6, turn: 0.10 };
    const LASER = { width: 6, duration: 0.24, cooldown: 1.80 };

    // State
    let running = false, paused = false, gameOverHandled = false;
    let score = 0, wave = 1, lives = 5;
    let bullets = []; // {x,y,vx,vy,good}
    let lasers = [];  // {x, y0, y1, width, life, ttl, dmg, hit:Set}
    let enemies = []; // {x,y,w,h,hp,type,t,pat}
    let stars = [];   // bg starfield
    let lastShoot = 0;
    let drops = [];   // {x,y,vx,vy,t,type:'U'|'L'|'S',kind?:'fire'|'twin'|'spread'|'missile'|'electro'|'laser'}
    const DROP = { w: 34, h: 34 };
    let power = { fireLv: 0, twin: false, spread: false, missileLv: 0, electro: false, laserLv: 0 };
    let pickupMsgs = []; // {text,color,t,dur}
    // Player invulnerability timer
    let invulnT = 0;                 // remaining seconds of invulnerability
    // One-hit shield (consumes next hit and destroys the attacker)
    let shieldActive = false, shieldPulse = 0;
    // Meteors and particles
    let meteors = [];   // {x,y,vx,vy,w,h,rot,vr}
    let particles = []; // {x,y,vx,vy,life,ttl,size,color}
    // Global meteor spawn cooldown timer (seconds since last meteor)
    let timeSinceLastMeteor = 999;
    // Special weapon timers
    let missileT = 0;   // accumulates until firing a homing missile (if owned)
    let laserT = 0;     // accumulates for laser cadence when owned
    // End-of-wave delay handle
    let endWaveTimeout = null;
    // End-of-game delay handle (for death -> leaderboard)
    let endGameTimeout = null;
    // Player death state during end-game delay
    let playerDead = false;
    // Global audio mute state
    let muted = false;
    const LS_MUTE_KEY = 'nova-striker:muted';

    function setMuted(m) {
      muted = !!m;
      // Apply to all current music Audio objects
      for (const k in MUSIC) {
        try { MUSIC[k].muted = muted; } catch (e) {}
      }
      if (muted) {
        try { currentMusic.pause(); } catch (e) {}
      } else {
        if (running && !paused) {
          currentMusic.play().catch(()=>{}); // ignore errors
        }
      }
      updateAudioIcon();
      try { localStorage.setItem(LS_MUTE_KEY, muted ? '1' : '0'); } catch (e) {}
    }

    function toggleAudio() { setMuted(!muted); }

    // Update icon image based on mute state
    function updateAudioIcon() {
      if (!audioIconImg) return;
      audioIconImg.src = muted ? 'assets/muted.png' : 'assets/unmuted.png';
      audioIconImg.alt = muted ? 'Muted' : 'Audio';
    }

    const input = { left:false, right:false };

    function init() {
      makeStars();
      setupWave(1);
      showOverlay('Nova Striker', 'Tap/Click or press Space to launch');
      draw();
      attachControls();
      // Initialize audio icon/mute from storage
      try {
        const saved = localStorage.getItem(LS_MUTE_KEY);
        if (saved !== null) setMuted(saved === '1'); else updateAudioIcon();
      } catch (e) { updateAudioIcon(); }
    }

    function attachControls() {
      window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
        if (e.code === 'Space') launch();
        if (e.code === 'KeyP') togglePause();
        if (e.code === 'KeyM') toggleAudio();
      });
      window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
      });
      // Clickable audio icon
      if (audioIcon) audioIcon.addEventListener('click', toggleAudio);
      function moveToPointer(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = W / rect.width;
        const x = (e.clientX - rect.left) * scaleX;
        P.x = Math.max(P.w/2, Math.min(W - P.w/2, x));
      }
      [canvas, overlayEl].forEach(el => {
        el.addEventListener('pointerdown', (e) => { moveToPointer(e); launch(); });
        el.addEventListener('pointermove', moveToPointer);
      });
    }

    function togglePause() {
      paused = !paused;
      if (paused) {
        if (!muted) currentMusic.pause();
        showOverlay('Paused', 'Press P to resume');
      } else {
        if (!muted) currentMusic.play().catch(console.error);
        hideOverlay();
      }
    }

    function showOverlay(title, sub) { ovTitle.textContent = title; ovSub.textContent = sub; overlayEl.classList.add('show'); }
    function hideOverlay() { overlayEl.classList.remove('show'); }

    function showWaveBanner(text) {
      waveBanner.textContent = text;
      waveBanner.classList.add('show');
      setTimeout(() => waveBanner.classList.remove('show'), 1500);
    }
    

    function launch() {
      if (paused) { togglePause(); return; }
      if (!running) {
        hideOverlay();
        running = true;
        currentMusic.play().catch(console.error);
        const label = isBossWave(wave) ? ('Boss Wave ' + Math.floor(wave/3)) : ('Wave ' + wave);
        showWaveBanner(label);
        if (!muted) currentMusic.play().catch(console.error);
      }
    }

    function isBossWave(n) { return n % 3 === 0; }

    function setupWave(n) {
      wave = n; waveEl.textContent = wave;
      // Clear any pending end-of-wave popup
      if (endWaveTimeout) { clearTimeout(endWaveTimeout); endWaveTimeout = null; }
      enemies = [];
      bullets = [];
      lasers = [];
      drops = [];
      meteors = [];
      particles = [];
      // Reset meteor cooldown so the next spawn is allowed immediately
      timeSinceLastMeteor = 999;
      const desired = isBossWave(n) ? MUSIC.boss : MUSIC.normal;
      if (currentMusic !== desired) {
        currentMusic.pause();
        currentMusic = desired;
        if (running && !paused && !muted) currentMusic.play().catch(console.error);
      }
      if (isBossWave(n)) {
        // Create a unique boss for waves 3, 6, 9
        const idx = Math.floor(n / 3); // 1,2,3
        const bossHP = idx === 1 ? 56 : (idx === 2 ? 180 : 390);
        const bossW = idx === 1 ? 140 : (idx === 2 ? 160 : 180);
        const bossH = idx === 1 ? 120 : (idx === 2 ? 135 : 150);
        const bossScore = idx === 1 ? 1500 : (idx === 2 ? 2500 : 4000);
        enemies.push({
          x: W/2, y: -160,
          w: bossW, h: bossH, hp: bossHP, type: 'X' + idx, boss: true, t: 0, fireT: 0, spawnT: 0, phase: 0,
          pat: { amp: 130, freq: 0.5 + idx*0.1, vy: (1.4 - idx*0.2) * 2 },
          score: bossScore
        });
      } else {
        // Pattern: rows of fighters plus a few bombers with sine motion
        const colsBase = 6 + Math.min(4, Math.floor((n-1)/2));
        const rows = 2 + Math.min(2, Math.floor((n-1)/3));
        // Reduce the number of fighters by ~40% via column count scaling
        const cols = Math.max(2, Math.round(colsBase * 0.6));
        const gapX = 90, gapY = 70;
        const startX = (W - (cols-1)*gapX) / 2;
        for (let r=0; r<rows; r++) {
          for (let c=0; c<cols; c++) {
            enemies.push({
              x: startX + c*gapX, y: -120 - r*gapY,
              w: 48, h: 46, hp: 1 + Math.floor((n-1)/3), type: 'F', t: Math.random()*6.28,
              pat: { amp: 30 + 8*r, freq: 1.1 + r*0.15, vy: 1.4 + n*0.1 }
            });
          }
        }
        // Add a few bombers
        const bombersBase = Math.min(3 + Math.floor(n/2), 7);
        // Reduce bombers by ~40%
        const bombers = Math.max(0, Math.round(bombersBase * 0.6));
        for (let i=0; i<bombers; i++) {
          enemies.push({ x: Math.random()*W, y: -300 - i*120, w: 56, h: 54, hp: 2 + Math.floor(n/2), type: 'B', t: Math.random()*6.28,
            pat: { amp: 60, freq: 0.7, vy: 1.0 + n*0.12 } });
        }
        // Add a couple of Snipers (precise shooters)
        const snipers = Math.max(0, Math.min(1 + Math.floor((n-1)/4), 3));
        for (let i=0; i<snipers; i++) {
          enemies.push({ x: 60 + Math.random()*(W-120), y: -350 - i*160, w: 40, h: 44, hp: 2 + Math.floor((n-1)/3), type: 'S', t: Math.random()*6.28,
            pat: { amp: 18, freq: 0.7, vy: 0.9 + n*0.09 }, score: 350 });
        }
        // Add Weavers (wide sine movers)
        const weaversBase = Math.min(2 + Math.floor(n/3), 5);
        const weavers = Math.max(0, Math.round(weaversBase * 0.7));
        for (let i=0; i<weavers; i++) {
          enemies.push({ x: 60 + Math.random()*(W-120), y: -200 - i*100, w: 52, h: 34, hp: 2 + Math.floor(n/3), type: 'W', t: Math.random()*6.28,
            pat: { amp: 90, freq: 1.5, vy: 1.2 + n*0.10 }, score: 180 });
        }
      }
    }

    // Pickups and upgrades
    function spawnDrop(e) {
      // Drop chances; extra life tuned, upgrades unchanged, shield added (rare normal, higher on boss)
      const lifeChance = e.boss ? 0.08 : 0.01;     // 8% boss, 1% normal
      const upChance   = e.boss ? 0.25 : 0.06;     // 25% boss, 6% normal
      const shieldChance = e.boss ? 0.10 : 0.015;  // 10% boss, 1.5% normal
      const r = Math.random();
      let type = null, kind = null;
      if (r < lifeChance) type = 'L';
      else if (r < lifeChance + upChance) { type = 'U'; kind = pickUpgrade(); }
      else if (r < lifeChance + upChance + shieldChance) { type = 'S'; }
      if (!type) return;
      drops.push({ x: e.x, y: e.y, vx: (Math.random()-0.5)*1.2, vy: 1.6, t: 0, type, kind });
    }

    function pickUpgrade() {
      // Build a weighted pool dynamically. Keep fire common; include missile/electro if not owned/maxed.
      const pool = ['fire','fire','twin','spread'];
      if (power.missileLv < 2) pool.push('missile');
      if (!power.electro) pool.push('electro');
      if (power.laserLv < 2) pool.push('laser');
      // Nudge towards unowned basics when applicable
      if (!power.twin) pool.push('twin');
      if (!power.spread) pool.push('spread');
      return pool[Math.floor(Math.random()*pool.length)];
    }

    function applyUpgrade(kind) {
      if (kind === 'fire') {
        power.fireLv = Math.min(5, power.fireLv + 1);
        // Reduced effect per level: 15% faster per level (multiplier 0.85^level) with a 0.07s minimum
        B.cooldown = Math.max(0.07, B.baseCooldown * Math.pow(0.85, power.fireLv));
        // Give immediate feedback by allowing an instant shot
        lastShoot = B.cooldown;
        pickupMsgs.push({ text: 'FIRE RATE UP!', color: '#ffb347', t: 0, dur: 0.9 });
      } else if (kind === 'twin') {
        power.twin = true;
        pickupMsgs.push({ text: 'TWIN SHOT!', color: '#00e5ff', t: 0, dur: 0.9 });
      } else if (kind === 'spread') {
        power.spread = true;
        pickupMsgs.push({ text: 'SPREAD SHOT!', color: '#21d87a', t: 0, dur: 0.9 });
      } else if (kind === 'missile') {
        power.missileLv = Math.min(2, (power.missileLv||0) + 1);
        pickupMsgs.push({ text: 'HOMING MISSILE!', color: '#ffa500', t: 0, dur: 0.9 });
      } else if (kind === 'electro') {
        power.electro = true;
        pickupMsgs.push({ text: 'ELECTRO ORB!', color: '#7df9ff', t: 0, dur: 0.9 });
      } else if (kind === 'laser') {
        power.laserLv = Math.min(2, (power.laserLv||0) + 1);
        pickupMsgs.push({ text: 'LASER!', color: '#ff4df0', t: 0, dur: 0.9 });
        // Allow immediate visual feedback
        laserT = LASER.cooldown;
      }
    }

    function applyDrop(d) {
      if (d.type === 'L') {
        if (lives < 6) { lives++; livesEl.textContent = lives; }
      } else if (d.type === 'S') {
        shieldActive = true; shieldPulse = 0;
        pickupMsgs.push({ text: 'SHIELD!', color: '#00e5ff', t: 0, dur: 0.9 });
      } else {
        const kind = d.kind || pickUpgrade();
        applyUpgrade(kind);
      }
    }

    function makeStars() {
      stars = [];
      for (let i=0; i<150; i++) {
        stars.push({ x: Math.random()*W, y: Math.random()*H, s: Math.random()*2+0.5, spd: Math.random()*0.6+0.3 });
      }
    }

    function shoot(dt) {
      // Fire lasers on their own cadence (in addition to normal shots)
      if (power.laserLv > 0) {
        laserT += dt;
        const lcd = LASER.cooldown;
        if (laserT >= lcd) {
          laserT = 0;
          const offsets = power.twin ? [-10, 10] : [0];
          const baseWidth = LASER.width + (power.laserLv >= 2 ? 2 : 0);
          const dmg = power.laserLv >= 2 ? 5 : 3;
          for (const off of offsets) {
            lasers.push({
              x: Math.max(6, Math.min(W - 6, P.x + off)),
              y0: P.y - P.h/2 - 6,
              y1: -40,
              width: baseWidth,
              life: 0,
              ttl: LASER.duration,
              dmg,
              hit: new Set()
            });
          }
        }
      }

      // Normal bullets (always)
      lastShoot += dt;
      if (lastShoot >= B.cooldown) {
        lastShoot = 0;
        // Determine shot pattern based on upgrades
        const angles = power.spread ? [-0.16, 0, 0.16] : [0];
        const offsets = power.twin ? [-10, 10] : [0];
        for (const ang of angles) {
          for (const off of offsets) {
            const vx = Math.sin(ang) * B.speed;
            const vy = -Math.cos(ang) * B.speed;
            bullets.push({ x: P.x + off, y: P.y - P.h/2 - 4, vx, vy, good: true, kind: 'normal', dmg: 1 });
          }
        }
      }
    }

    function spawnMissile() {
      // Spawn from the ship center; initial upward velocity; will home in update
      bullets.push({ x: P.x, y: P.y - P.h/2 - 6, vx: 0, vy: -MISS.speed, good: true, kind: 'missile', dmg: 2, spd: MISS.speed });
    }

    function enemyShoot(e, chance=0.006) {
      if (Math.random() < chance) {
        const vx = (P.x - e.x) * 0.006; // slight aim
        bullets.push({ x: e.x, y: e.y + e.h/2, vx, vy: EB.speed, good: false });
      }
    }

    // Precise long-range shot for Sniper ships (fast bullet, low rate)
    function enemyShootSniper(e, chance=0.0028) {
      if (Math.random() < chance) {
        // Aim toward player but clamp within ±45° of straight down to avoid extreme side shots
        const base = Math.PI / 2; // straight down
        let ang = Math.atan2(P.y - e.y, P.x - e.x);
        let delta = ang - base;
        // normalize delta to [-PI, PI]
        delta = ((delta + Math.PI) % (Math.PI * 2)) - Math.PI;
        const limit = Math.PI / 4; // 45°
        if (delta < -limit) delta = -limit; else if (delta > limit) delta = limit;
        ang = base + delta;
        const spd = 10.5;
        bullets.push({ x: e.x, y: e.y + e.h/2, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd, good: false });
      }
    }

    // Weaver ships fire periodic 3-shot downward fans
    function enemyShootWeaver(e, dt) {
      e.fireT = (e.fireT || 0) + dt;
      if (e.fireT >= 1.1) {
        e.fireT = 0;
        const base = Math.PI / 2; // straight down
        const offsets = [-0.18, 0, 0.18];
        const spd = 5.6;
        for (const off of offsets) {
          const ang = base + off;
          bullets.push({ x: e.x, y: e.y + e.h/2, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd, good: false });
        }
      }
    }

    // Boss attack patterns
    function bossShoot1(e, dt) {
      // Wave 3 boss: aimed triple spread
      e.fireT += dt;
      if (e.fireT >= 0.9) {
        e.fireT = 0;
        const base = Math.atan2(P.y - e.y, P.x - e.x);
        const speeds = [7.2, 7.0, 7.2];
        const offsets = [-0.18, 0, 0.18];
        for (let i=0;i<3;i++) {
          const ang = base + offsets[i];
          bullets.push({ x: e.x, y: e.y + e.h*0.3, vx: Math.cos(ang)*speeds[i], vy: Math.sin(ang)*speeds[i], good: false });
        }
      }
    }

    function bossShoot2(e, dt) {
      // Wave 6 boss: rotating radial rings
      e.fireT += dt; e.phase += dt * 0.6;
      if (e.fireT >= 1.1) {
        e.fireT = 0;
        const N = 14;
        for (let i=0;i<N;i++) {
          const ang = e.phase + (i * (Math.PI*2/N));
          bullets.push({ x: e.x, y: e.y + e.h*0.25, vx: Math.cos(ang)*4.2, vy: Math.sin(ang)*4.2, good: false });
        }
      }
    }

    function bossShoot3(e, dt) {
      // Wave 9 boss: spawns minions + fast aimed salvos
      e.fireT += dt; e.spawnT += dt;
      // Aimed 5-shot fan
      if (e.fireT >= 0.9) {
        e.fireT = 0;
        const base = Math.atan2(P.y - e.y, P.x - e.x);
        for (let i=-2;i<=2;i++) {
          const ang = base + i*0.12;
          bullets.push({ x: e.x, y: e.y + e.h*0.3, vx: Math.cos(ang)*6.5, vy: Math.sin(ang)*6.5, good: false });
        }
      }
      // Spawn fighters from top edges, up to a cap
      if (e.spawnT >= 3.5) {
        e.spawnT = 0;
        const activeAdds = enemies.filter(en => !en.boss && en.hp > 0 && en.y < H+40).length;
        if (activeAdds < 10) {
          const spawn = (x) => enemies.push({ x, y: -80, w: 48, h: 46, hp: 1 + Math.floor((wave-1)/3), type: 'F', t: 0,
            pat: { amp: 20 + Math.random()*30, freq: 0.9, vy: 1.6 + wave*0.12 } });
          spawn(40 + Math.random()*120);
          spawn(W - (40 + Math.random()*120));
        }
      }
    }

    // Meteor logic
    function spawnMeteorFromEnemy(e) {
      // Enforce a global 0.5s cooldown between meteor spawns
      if (timeSinceLastMeteor < 0.5) return;
      timeSinceLastMeteor = 0;
      // Spawn from above, roughly above the enemy, aiming down toward the player
      const sx = Math.max(30, Math.min(W - 30, e.x + (Math.random()*80 - 40)));
      const sy = -20;
      const base = Math.atan2(P.y - sy, P.x - sx);
      const ang = base + (Math.random()*0.35 - 0.175);
      const spd = 6.2 + Math.min(4.0, wave * 0.22);
      let vx = Math.cos(ang) * spd;
      let vy = Math.sin(ang) * spd;
      if (vy < 3.2) vy = 3.2;
      const w = 38, h = 38;
      const rot = Math.atan2(vy, vx) + Math.PI * 0.5; // point the flame back
      const vr = (Math.random()*1.0 - 0.5) * 1.8; // small spin
      meteors.push({ x: sx, y: sy, vx, vy, w, h, rot, vr });
    }

    function spawnExplosion(x, y, count = 18, color = 'orange') {
      for (let i=0;i<count;i++) {
        const ang = Math.random()*Math.PI*2;
        const spd = 1.5 + Math.random()*4;
        particles.push({
          x, y,
          vx: Math.cos(ang)*spd,
          vy: Math.sin(ang)*spd,
          life: 0,
          ttl: 0.6 + Math.random()*0.5,
          size: 2 + Math.random()*3,
          color
        });
      }
    }

    // Smaller cyan burst for homing missile impacts
    function spawnMissileBurst(x, y, count = 12) {
      for (let i=0; i<count; i++) {
        const ang = Math.random()*Math.PI*2;
        const spd = 0.8 + Math.random()*2.0;
        particles.push({
          x, y,
          vx: Math.cos(ang)*spd,
          vy: Math.sin(ang)*spd,
          life: 0,
          ttl: 0.28 + Math.random()*0.18,
          size: 0.9 + Math.random()*1.1,
          color: 'missile'
        });
      }
    }

    function updateParticles(dt) {
      for (const p of particles) {
        p.life += dt;
        if (p.kind === 'arc') {
          // Advance a tracking electric arc and apply damage on arrival
          let tx = p.destX, ty = p.destY;
          if (p.target && p.target.hp > 0) {
            tx = p.target.x; ty = p.target.y;
            // keep dest updated to last known target position
            p.destX = tx; p.destY = ty;
          } else {
            // target died before arrival: remove immediately so no ghost arcs are shown
            if (!p.didDamage) p.ttl = Math.min(p.ttl, p.life);
          }
          const dist = Math.hypot(tx - p.startX, ty - p.startY) || 1;
          const spd = p.speed || 1200;
          const traveled = p.life * spd;
          p.progress = Math.min(1, traveled / dist);
          if (!p.didDamage && p.progress >= 1) {
            if (p.target && p.target.hp > 0) {
              p.target.hp -= (p.damage || 1);
              if (p.target.hp <= 0) {
                const add = (p.target.type === 'F') ? 100 : (p.target.type === 'B' ? 250 : (p.target.score || 2000));
                score += add; scoreEl.textContent = score;
                spawnDrop(p.target);
                // explosion on electro kill
                spawnExplosion(tx, ty, (p.target && p.target.boss) ? 50 : 20, 'electric');
              }
            }
            // impact sparks at current destination
            for (let i=0;i<6;i++) {
              const ang = Math.random()*Math.PI*2, sp = 2+Math.random()*2.5;
              particles.push({ x: tx, y: ty, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp, life:0, ttl:0.25, size:1.6+Math.random()*1.4, color:'electric' });
            }
            p.didDamage = true;
          }
        } else {
          p.x += p.vx; p.y += p.vy;
          p.vx *= 0.985; p.vy = p.vy*0.985 + 0.02; // slight gravity
        }
      }
      particles = particles.filter(p => p.life < p.ttl && (p.kind === 'arc' || p.y < H + 60));
    }

    // Electro Orb utils
    function buildArcPoints(x1, y1, x2, y2, segs = 6) {
      const pts = [];
      for (let i = 0; i <= segs; i++) {
        const t = i / segs;
        const x = x1 + (x2 - x1) * t;
        const y = y1 + (y2 - y1) * t;
        const dx = x2 - x1, dy = y2 - y1;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len, ny = dx / len;
        const mag = (Math.random() * 8 - 4) * (1 - Math.abs(0.5 - t) * 1.2);
        pts.push({ x: x + nx * mag, y: y + ny * mag });
      }
      return pts;
    }
    // Electro Orb: chain lightning from a hit enemy to nearby enemies
    function spawnElectricArc(x1, y1, x2, y2, opts = {}) {
      // Create a traveling arc that tracks a moving target. Damage is applied on arrival.
      const speed = opts.speed || 1200; // px/sec
      const initialDist = Math.hypot(x2 - x1, y2 - y1) || 1;
      const travel = initialDist / Math.max(1, speed);
      const arc = {
        kind: 'arc',
        life: 0,
        ttl: Math.max(0.2, travel + 0.15),
        width: 3,
        startX: x1,
        startY: y1,
        target: opts.target || null,
        destX: x2,
        destY: y2,
        speed,
        progress: 0,
        damage: opts.damage || 1,
        didDamage: false
      };
      particles.push(arc);
      // impact sparks are spawned upon arrival in updateParticles
    }

    function triggerElectro(srcEnemy, hx, hy) {
      if (!power.electro) return;
      const R = 140;
      // collect nearby enemies and hit the nearest few with delayed arcs
      const cand = [];
      for (const e2 of enemies) {
        if (e2 === srcEnemy || e2.hp <= 0) continue;
        // Only chain to enemies that are actually visible on-screen
        if (e2.y < e2.h/2 || e2.y >= H + 80) continue;
        const dx = e2.x - srcEnemy.x, dy = e2.y - srcEnemy.y;
        if (dx*dx + dy*dy <= R*R) {
          const dxh = e2.x - hx, dyh = e2.y - hy;
          cand.push({ e: e2, d2: dxh*dxh + dyh*dyh });
        }
      }
      cand.sort((a,b) => a.d2 - b.d2);
      const maxChains = 2; // reduced overall damage by limiting number of chained targets
      const dmg = 1; // per-target shock damage upon arrival
      for (let i=0; i<Math.min(maxChains, cand.length); i++) {
        const e2 = cand[i].e;
        spawnElectricArc(hx, hy, e2.x, e2.y, { target: e2, damage: dmg });
      }
    }

    function update(dt) {
      // Tick down invulnerability timer
      if (invulnT > 0) invulnT = Math.max(0, invulnT - dt);
      if (shieldActive) shieldPulse += dt;
      // Advance meteor cooldown timer
      timeSinceLastMeteor += dt;
      // Player move
      const spd = P.speed * (1 + wave*0.04);
      if (input.left) P.x -= spd; if (input.right) P.x += spd;
      P.x = Math.max(P.w/2, Math.min(W - P.w/2, P.x));

      // Auto fire when running (disabled after death)
      if (!playerDead) shoot(dt);

      // Special weapons handling
      // Homing missile timer
      if (power.missileLv > 0 && !playerDead) {
        missileT += dt;
        const cd = power.missileLv >= 2 ? 0.8 : 1.2;
        if (missileT >= cd) { missileT = 0; spawnMissile(); }
      }

      // Stars
      for (const s of stars) { s.y += s.spd * (1 + wave*0.05); if (s.y > H) { s.y = -4; s.x = Math.random()*W; } }

      // Enemies: move/animate only here; shooting happens later after collisions
      for (const e of enemies) {
        // Skip dead enemies so they don't move/wrap/spawn meteors
        if (e.hp <= 0) continue;
        e.t += dt;
        const sway = Math.sin(e.t * e.pat.freq) * e.pat.amp;
        const prevY = e.y;
        e.y += e.pat.vy; e.x += sway * 0.04;
        // Bosses settle into the arena
        if (e.boss && e.y > 160) e.pat.vy = 0;
        // Keep enemies within horizontal bounds
        e.x = Math.max(e.w/2, Math.min(W - e.w/2, e.x));
        // Vertical wrap for non-boss enemies: only when crossing the bottom edge this frame
        if (!e.boss && prevY <= H + e.h/2 && e.y > H + e.h/2) {
          // Spawn at most one meteor per enemy lifetime
          if (!e.meteorSpawned) { spawnMeteorFromEnemy(e); e.meteorSpawned = true; }
          e.y = -e.h/2;
          // Reset the flag now that it wrapped to the top; it'll be eligible again next time
          e.meteorSpawned = false;
        }
      }

      // Bullets
      for (const b of bullets) {
        // Homing behavior
        if (b.good && b.kind === 'missile') {
          // Find nearest alive enemy
          let best = null, bestD2 = Infinity;
          for (const e of enemies) if (e.hp > 0) {
            const dx = e.x - b.x, dy = e.y - b.y; const d2 = dx*dx + dy*dy;
            if (d2 < bestD2) { bestD2 = d2; best = e; }
          }
          if (best) {
            const desired = Math.atan2(best.y - b.y, best.x - b.x);
            const cur = Math.atan2(b.vy, b.vx);
            let delta = desired - cur;
            // Wrap to [-PI, PI]
            delta = ((delta + Math.PI) % (Math.PI*2)) - Math.PI;
            const maxTurn = MISS.turn;
            const newAng = cur + Math.max(-maxTurn, Math.min(maxTurn, delta));
            b.vx = Math.cos(newAng) * (b.spd || MISS.speed);
            b.vy = Math.sin(newAng) * (b.spd || MISS.speed);
          }
        }
        b.x += b.vx; b.y += b.vy;
      }
      bullets = bullets.filter(b => b.y > -40 && b.y < H+40 && b.x > -40 && b.x < W+40);

      // Lasers: advance life and apply piercing damage to all intersecting enemies once per beam
      if (lasers.length) {
        for (const L of lasers) {
          L.life += dt;
          for (const e of enemies) {
            if (e.hp <= 0) continue;
            // beam-rect intersection (vertical strip at x=L.x)
            const halfW = L.width * 0.5;
            const withinX = Math.abs(e.x - L.x) < (e.w/2 + halfW);
            const withinY = (e.y + e.h/2) > L.y1 && (e.y - e.h/2) < L.y0;
            if (withinX && withinY && !L.hit.has(e)) {
              L.hit.add(e);
              const hitX = Math.max(e.x - e.w/2, Math.min(L.x, e.x + e.w/2));
              const hitY = Math.max(e.y - e.h/2, Math.min(L.y0, e.y + e.h/2));
              e.hp -= L.dmg;
              // Electro chain from this laser hit
              triggerElectro(e, hitX, hitY);
              if (e.hp <= 0) {
                // explosion on laser kill
                spawnExplosion(hitX, hitY, e.boss ? 50 : 22, 'orange');
                const add = (e.type === 'F') ? 100 : (e.type === 'B' ? 250 : (e.score || 2000));
                score += add; scoreEl.textContent = score;
                spawnDrop(e);
              }
            }
          }
        }
        lasers = lasers.filter(L => L.life < L.ttl);
      }

      // Meteors
      for (const m of meteors) {
        m.x += m.vx; m.y += m.vy; m.rot += m.vr * dt;
        // Trail particles
        if (Math.random() < 0.9) {
          particles.push({
            x: m.x - m.vx*0.15,
            y: m.y - m.vy*0.15,
            vx: (Math.random()-0.5)*0.4,
            vy: (Math.random()-0.5)*0.4 + 0.3,
            life: 0,
            ttl: 0.35 + Math.random()*0.25,
            size: 2.5 + Math.random()*2.5,
            color: 'orange'
          });
          if (Math.random() < 0.25) {
            particles.push({ x: m.x, y: m.y, vx: 0, vy: 0.2+Math.random()*0.4, life: 0, ttl: 0.25, size: 1.5, color: 'gold' });
          }
        }
      }
      meteors = meteors.filter(m => m.y < H + 60 && m.x > -60 && m.x < W + 60);

      // Particles
      updateParticles(dt);

      // Drops
      for (const d of drops) {
        d.t += dt;
        d.x += d.vx + Math.sin(d.t*3) * 0.4;
        d.y += d.vy;
        d.vy = Math.min(d.vy + 0.01, 3.2);
        // Keep upgrade and extra life drops within horizontal bounds so they stay collectible
        if (d.type === 'U' || d.type === 'L') {
          const pad = DROP.w * 0.5 + 8; // small margin inside the walls
          const minX = pad;
          const maxX = W - pad;
          if (d.x < minX) {
            d.x = minX;
            // nudge inward and dampen drift
            d.vx = Math.abs(d.vx) * 0.5;
          } else if (d.x > maxX) {
            d.x = maxX;
            d.vx = -Math.abs(d.vx) * 0.5;
          }
        }
      }
      // Collect drops
      for (const d of drops) {
        if (Math.abs(d.x - P.x) < (P.w*0.45) && Math.abs(d.y - P.y) < (P.h*0.45)) {
          applyDrop(d);
          d.collected = true;
        }
      }
      drops = drops.filter(d => !d.collected && d.y < H + 50);

      // Collisions: bullets vs enemies
      for (const b of bullets) if (b.good) {
        for (const e of enemies) {
          if (e.hp <= 0) continue;
          if (Math.abs(b.x - e.x) < (e.w/2) && Math.abs(b.y - e.y) < (e.h/2)) {
            // capture impact point BEFORE removing the bullet
            const hitX = b.x, hitY = b.y;
            e.hp -= (b.dmg || 1); b.y = -9999; // remove
            if (b.kind === 'missile') {
              // distinct smaller cyan burst for missile impacts
              spawnMissileBurst(hitX, hitY, 12);
            }
            // Electro chain from this hit
            triggerElectro(e, hitX, hitY);
            if (e.hp <= 0) {
              // explosion on bullet kill
              spawnExplosion(e.x, e.y, e.boss ? 50 : 22, 'orange');
              const add = (e.type === 'F') ? 100 : (e.type === 'B' ? 250 : (e.score || 2000));
              score += add; scoreEl.textContent = score;
              spawnDrop(e);
            }
            break;
          }
        }
      }

      // Collisions: enemy bullets vs player (ignored while invulnerable)
      if (invulnT <= 0) {
        for (const b of bullets) if (!b.good) {
          if (Math.abs(b.x - P.x) < (P.w*0.35) && Math.abs(b.y - P.y) < (P.h*0.35)) {
            // Bullet hits player: if shield active, consume it and destroy the bullet; otherwise, take damage
            b.y = H + 999; // remove bullet
            if (shieldActive) {
              shieldActive = false;
            } else {
              // explosion on player hit by bullet
              spawnExplosion(P.x, P.y, 26, 'orange');
              hitPlayer();
            }
          }
        }
      }

      // Collisions: meteors vs player (ignored while invulnerable)
      if (invulnT <= 0) {
        for (const m of meteors) {
          if (Math.abs(m.x - P.x) < (P.w*0.4) && Math.abs(m.y - P.y) < (P.h*0.4)) {
            // Impact explosion
            spawnExplosion(m.x, m.y, 24, 'orange');
            m.y = H + 999; // remove
            if (shieldActive) {
              shieldActive = false;
            } else {
              hitPlayer();
            }
          }
        }
      }

      // Enemies hitting player (ignored while invulnerable)
      if (invulnT <= 0) {
        for (const e of enemies) {
          if (e.hp <= 0) continue;
          if (Math.abs(e.x - P.x) < (P.w*0.45) && Math.abs(e.y - P.y) < (P.h*0.45)) {
            if (shieldActive) {
              // Destroy the enemy and consume shield
              e.hp = 0; shieldActive = false; spawnDrop(e);
              // explosion on enemy destroyed by shield
              spawnExplosion(e.x, e.y, e.boss ? 50 : 22, 'orange');
            } else {
              e.hp = 0;
              // explosions on collision: enemy and player
              spawnExplosion(e.x, e.y, e.boss ? 50 : 22, 'orange');
              spawnExplosion(P.x, P.y, 26, 'orange');
              hitPlayer();
            }
          }
        }
      }

      // Enemy shooting (after collisions so dead enemies don't fire this frame)
      for (const e of enemies) {
        // Only shoot when alive and fully visible (top edge on-screen), and not far below screen
        if (e.hp <= 0 || e.y < e.h/2 || e.y >= H + 80) continue;
        if (e.boss) {
          if (e.type === 'X1') bossShoot1(e, dt);
          else if (e.type === 'X2') bossShoot2(e, dt);
          else bossShoot3(e, dt);
        } else {
          if (e.type === 'F') enemyShoot(e, 0.004 + wave*0.0008);
          else if (e.type === 'B') enemyShoot(e, 0.006 + wave*0.0012);
          else if (e.type === 'S') enemyShootSniper(e, 0.0022 + wave*0.00035);
          else if (e.type === 'W') enemyShootWeaver(e, dt);
          else enemyShoot(e, 0.006 + wave*0.0012);
        }
      }

      // Next wave (wait if upgrades/shield are still on-screen). Require all enemies to be truly defeated.
      // Suppress wave advancement during post-death delay.
      if (!playerDead && !enemies.some(e => e.hp > 0) && !drops.some(d => (d.type === 'U' || d.type === 'S' || d.type === 'L') && d.y >= 0 && d.y <= H)) {
        // Schedule the next wave after a short breather, only once
        if (!endWaveTimeout) {
          endWaveTimeout = setTimeout(() => {
            endWaveTimeout = null;
            if (wave >= 9) {
              victory();
            } else {
              setupWave(wave + 1);
              const label = isBossWave(wave) ? ('Boss Wave ' + Math.floor(wave/3)) : ('Wave ' + wave);
              showWaveBanner(label);
            }
          }, 2000);
        }
      }
    }

    function hitPlayer() {
      if (!running) return;
      lives--; livesEl.textContent = lives;
      if (lives <= 0) {
        // Player destroyed: keep the world running for 2s so effects/enemies continue
        playerDead = true;
        invulnT = 999; // block further hits
        if (!endGameTimeout) {
          endGameTimeout = setTimeout(() => {
            endGameTimeout = null;
            running = false; // finally stop the game
            showOverlay('Game Over', 'Press Space to restart');
            if (!gameOverHandled) { gameOverHandled = true; maybeSubmitLeaderboard(false).catch(console.error); }
            window.addEventListener('keydown', restartOnce, { once: true });
          }, 2000);
        }
      } else {
        // Brief invulnerability after being hit
        invulnT = 2.5; // seconds
      }
    }

    function victory() {
      running = false;
      showOverlay('You Won!', 'Press Space to restart');
      if (!gameOverHandled) { gameOverHandled = true; maybeSubmitLeaderboard(true).catch(console.error); }
      window.addEventListener('keydown', restartOnce, { once: true });
    }

    function restartOnce(e) {
      if (e.code === 'Space') {
        // Clear any pending end-of-wave popup
        if (endWaveTimeout) { clearTimeout(endWaveTimeout); endWaveTimeout = null; }
        // Clear any pending end-of-game popup
        if (endGameTimeout) { clearTimeout(endGameTimeout); endGameTimeout = null; }
        playerDead = false;
        score = 0; wave = 1; lives = 5; scoreEl.textContent = score; waveEl.textContent = wave; livesEl.textContent = lives;
        power = { fireLv: 0, twin: false, spread: false, missileLv: 0, electro: false, laserLv: 0 }; B.cooldown = B.baseCooldown; lastShoot = 0; drops = []; meteors = []; particles = [];
        missileT = 0; laserT = 0; lasers = [];
        invulnT = 0; shieldActive = false; shieldPulse = 0;
        gameOverHandled = false; setupWave(1); showOverlay('Nova Striker', 'Tap/Click or press Space to launch');
      }
    }

    async function maybeSubmitLeaderboard(won=false) {
      let dest = `../leaderboard.html?gameId=${encodeURIComponent(GAME_ID)}`;
      try {
        const res = await fetch(`/api/leaderboard/rank?gameId=${encodeURIComponent(GAME_ID)}&score=${encodeURIComponent(score)}`, { headers: { 'Accept': 'application/json' } });
        if (res.ok) {
          const data = await res.json();
          const rank = Number(data?.rank);
          const qualifies = Number.isFinite(rank) && rank > 0 && rank <= 20;
          if (qualifies) {
            const prefix = won ? 'You Won! ' : '';
            let name = prompt(`${prefix}New High Score! You placed #${rank}. Enter your name (max 20 chars):`, '');
            if (name != null) {
              name = name.trim().replace(/[^\w \-'.!]/g, '').slice(0, 20);
              if (name) {
                let submitted = false;
                try {
                  await fetch('/api/leaderboard/submit', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ gameId: GAME_ID, name, score })
                  });
                  submitted = true;
                } catch {}
                if (submitted) dest += `&highlightRank=${encodeURIComponent(rank)}`;
              }
            }
          }
        }
      } catch (e) { console.error(e); }
      finally { location.href = dest; }
    }

    // RENDERING
    function drawStars() {
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      for (const s of stars) { ctx.globalAlpha = 0.4 + (s.s/2); ctx.fillRect(s.x, s.y, s.s, s.s); }
      ctx.restore();
      // scanlines glow grid
      ctx.save(); ctx.strokeStyle = 'rgba(0,229,255,0.05)'; ctx.lineWidth = 1; const step = 40;
      for (let y=0; y<=H; y+=step) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
      ctx.restore();
    }

    function drawSprite(img, x, y, w, h) { ctx.drawImage(img, x - w/2, y - h/2, w, h); }
    function drawRotSprite(img, x, y, w, h, rot) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.drawImage(img, -w/2, -h/2, w, h); ctx.restore();
    }

    function drawBossBar(b) {
      const pad = 12;
      const x = pad, y = pad, w = W - pad*2, h = 12;
      const pct = Math.max(0, Math.min(1, b.hp / (b.maxHp || b.hp)));
      // Store maxHp once
      if (!b.maxHp) b.maxHp = b.hp;
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = 'rgba(255,215,0,0.65)'; ctx.lineWidth = 2; ctx.strokeRect(x-1, y-1, w+2, h+2);
      ctx.fillStyle = '#ff4d6d'; ctx.fillRect(x, y, w*pct, h);
      ctx.restore();
    }

    function drawPickupMsgs(dt) {
      if (!pickupMsgs.length) return;
      // advance timers
      for (const m of pickupMsgs) m.t += dt;
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '12px "Press Start 2P", cursive';
      for (const m of pickupMsgs) {
        const a = Math.max(0, 1 - (m.t / m.dur));
        const y = 72 - m.t * 24;
        ctx.globalAlpha = a;
        ctx.fillStyle = m.color || '#fff';
        ctx.fillText(m.text, W/2, y);
      }
      ctx.restore();
      pickupMsgs = pickupMsgs.filter(m => m.t < m.dur);
    }

    let lastTime = 0;
    function draw(ts=0) {
      const dt = Math.min(0.05, (ts - lastTime) / 1000) || 0.016; lastTime = ts;
      ctx.clearRect(0,0,W,H);
      drawStars();
      drawPickupMsgs(dt);

      // Enemies
      for (const e of enemies) if (e.hp > 0) {
        if (e.boss) {
          // Boss glow ring
          ctx.save();
          ctx.beginPath(); ctx.arc(e.x, e.y, Math.max(e.w, e.h)*0.6, 0, Math.PI*2);
          ctx.strokeStyle = 'rgba(0,229,255,0.25)'; ctx.lineWidth = 6; ctx.stroke(); ctx.restore();
        }
        const img = e.boss
          ? (e.type === 'X1' ? SPRITES.boss1 : (e.type === 'X2' ? SPRITES.boss2 : SPRITES.boss3))
          : (e.type === 'F' ? SPRITES.enemyF
             : (e.type === 'B' ? SPRITES.enemyB
                : (e.type === 'S' ? SPRITES.enemyS : SPRITES.enemyW)));
        drawSprite(img, e.x, e.y, e.w, e.h);
      }

      // Particles (meteors, sparks, electric arcs)
      for (const p of particles) {
        const a = Math.max(0, 1 - (p.life / p.ttl));
        if (p.kind === 'arc') {
          // If the target died and we haven't applied damage, skip drawing this arc this frame
          if (p.target && p.target.hp <= 0 && !p.didDamage) { continue; }
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = a * 0.95;
          ctx.strokeStyle = 'rgba(125,249,255,0.95)';
          ctx.lineWidth = p.width || 3;
          // dynamic path toward current target position
          const tx = (p.target && p.target.hp > 0) ? p.target.x : p.destX;
          const ty = (p.target && p.target.hp > 0) ? p.target.y : p.destY;
          const pts = buildArcPoints(p.startX, p.startY, tx, ty, 6);
          const prog = p.progress || 0;
          const maxIdx = Math.max(1, Math.floor(prog * (pts.length - 1)));
          ctx.beginPath();
          for (let i = 0; i <= maxIdx; i++) {
            const pt = pts[i];
            if (i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
          }
          ctx.stroke();
          // outer glow
          ctx.globalAlpha = a * 0.35; ctx.lineWidth = (p.width || 3) + 8; ctx.stroke();
          // traveling head glow
          const head = pts[maxIdx];
          if (head) {
            ctx.globalAlpha = 0.9;
            ctx.fillStyle = 'rgba(180,255,255,0.9)';
            ctx.beginPath(); ctx.arc(head.x, head.y, 3.5, 0, Math.PI*2); ctx.fill();
          }
          ctx.restore();
        } else {
          ctx.save();
          ctx.globalAlpha = a * 0.9;
          if (p.color === 'gold') ctx.fillStyle = 'rgba(255,215,0,1)';
          else if (p.color === 'electric') ctx.fillStyle = 'rgba(125,249,255,1)';
          else if (p.color === 'missile') ctx.fillStyle = 'rgba(80,200,255,1)';
          else ctx.fillStyle = 'rgba(255,140,0,1)';
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
          ctx.restore();
        }
      }

      // Meteors
      for (const m of meteors) {
        drawRotSprite(SPRITES.meteor, m.x, m.y, m.w, m.h, m.rot);
      }

      // Player (hidden after death; blink while invulnerable otherwise)
      if (!playerDead) {
        if (invulnT > 0) {
          // Simple blink at ~8 Hz using remaining time
          const blinkOn = (Math.floor(invulnT * 8) % 2) === 0;
          if (blinkOn) drawSprite(SPRITES.player, P.x, P.y, P.w, P.h);
        } else {
          drawSprite(SPRITES.player, P.x, P.y, P.w, P.h);
        }
      }

      // Active shield visual: glowing ring around the player (not shown after death)
      if (shieldActive && !playerDead) {
        ctx.save();
        const r = Math.max(P.w, P.h) * 0.70;
        ctx.globalAlpha = 0.85;
        // Outer soft glow
        ctx.beginPath(); ctx.arc(P.x, P.y, r + 6, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(0,229,255,0.25)'; ctx.lineWidth = 10; ctx.stroke();
        // Core ring with subtle dash animation
        ctx.setLineDash([10, 8]);
        ctx.lineDashOffset = -(shieldPulse * 60 % 18);
        ctx.beginPath(); ctx.arc(P.x, P.y, r, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(0,229,255,0.9)'; ctx.lineWidth = 3; ctx.stroke();
        ctx.restore();
      }

      // Drops
      for (const d of drops) {
        const img = d.type === 'L'
          ? SPRITES.life
          : (d.type === 'S' ? SPRITES.shield
             : (d.kind === 'fire' ? SPRITES.upFire
                : (d.kind === 'twin' ? SPRITES.upTwin
                  : (d.kind === 'spread' ? SPRITES.upSpread
                    : (d.kind === 'missile' ? SPRITES.upMissile
                      : (d.kind === 'electro' ? SPRITES.upElectro
                        : (d.kind === 'laser' ? SPRITES.upLaser : SPRITES.upgrade)))))));
        // soft glow
        ctx.save();
        ctx.beginPath(); ctx.arc(d.x, d.y, 20, 0, Math.PI*2);
        let glow = 'rgba(0,229,255,0.18)';
        if (d.type === 'L') glow = 'rgba(255,77,109,0.18)';
        else if (d.type === 'S') glow = 'rgba(0,229,255,0.20)';
        else if (d.kind === 'fire') glow = 'rgba(255,140,0,0.18)';
        else if (d.kind === 'twin') glow = 'rgba(0,229,255,0.18)';
        else if (d.kind === 'spread') glow = 'rgba(33,216,122,0.18)';
        else if (d.kind === 'missile') glow = 'rgba(255,165,0,0.20)';
        else if (d.kind === 'electro') glow = 'rgba(125,249,255,0.20)';
        else if (d.kind === 'laser') glow = 'rgba(255,77,240,0.22)';
        ctx.fillStyle = glow;
        ctx.fill(); ctx.restore();
        drawSprite(img, d.x, d.y, DROP.w, DROP.h);
      }

      // Bullets
      for (const b of bullets) {
        if (b.good && b.kind === 'missile') {
          const ang = Math.atan2(b.vy, b.vx) + Math.PI/2;
          drawRotSprite(SPRITES.missile, b.x, b.y, MISS.w, MISS.h, ang);
        } else {
          drawSprite(b.good?SPRITES.bullet:SPRITES.eBullet, b.x, b.y, b.good?B.w:EB.w, b.good?B.h:EB.h);
        }
      }

      // Draw Lasers (glowing vertical beams)
      if (lasers.length) {
        for (const L of lasers) {
          const a = Math.max(0, 1 - (L.life / L.ttl));
          const yTop = Math.max(0, L.y1);
          const yBot = Math.max(0, Math.min(H, L.y0));
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          // core
          ctx.strokeStyle = 'rgba(255,77,240,0.95)';
          ctx.lineWidth = L.width;
          ctx.globalAlpha = 0.9 * a;
          ctx.beginPath(); ctx.moveTo(L.x, yTop); ctx.lineTo(L.x, yBot); ctx.stroke();
          // inner glow
          ctx.globalAlpha = 0.55 * a; ctx.lineWidth = L.width + 6; ctx.stroke();
          // outer glow
          ctx.globalAlpha = 0.25 * a; ctx.lineWidth = L.width + 14; ctx.stroke();
          ctx.restore();
        }
      }

      // Boss HUD
      const bossAlive = enemies.find(e => e.boss && e.hp > 0);
      if (bossAlive) drawBossBar(bossAlive);

      if (running && !paused) update(dt);
      else {
        // Keep destruction particle effects animating during death delay
        if (endGameTimeout) updateParticles(dt);
      }
      requestAnimationFrame(draw);
    }
  </script>
</body>
</html>
