<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07060a" />
  <meta name="description" content="Shiftwick - a maze-chase where the maze slides under your feet. Eat glow-motes, scorch the Hollows, and read the warnings before the walls move." />
  <title>Shiftwick - Bot Built Arcade</title>
  <link rel="icon" type="image/png" href="../images/botbuiltarcade-icon-face.png" />
  <link rel="stylesheet" href="assets/css/game.css" />
</head>
<body>
  <canvas id="sw-canvas" aria-label="Shiftwick game view" role="img"></canvas>
  <a class="sw-back" href="../index.html">&larr; Back to Arcade</a>
  <button class="sw-pause" id="sw-pause" type="button" aria-label="Pause">II</button>
  <div class="sw-dpad" id="sw-dpad" aria-hidden="true">
    <button data-dir="up" type="button" tabindex="-1">&#9650;</button>
    <button data-dir="left" type="button" tabindex="-1">&#9664;</button>
    <button data-dir="right" type="button" tabindex="-1">&#9654;</button>
    <button data-dir="down" type="button" tabindex="-1">&#9660;</button>
  </div>
  <div class="sw-overlay" id="sw-overlay" role="dialog" aria-live="polite"></div>
  <noscript><p style="color:#fff;padding:24px">Shiftwick needs JavaScript. <a href="../index.html">Back to Arcade</a></p></noscript>
  <script src="assets/js/logic.js"></script>
  <script src="assets/js/audio.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
