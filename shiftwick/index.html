<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#06040b" />
  <meta name="description" content="Shiftwick - a maze-chase where you are a living flame and the labyrinth itself slides. Shift rows and columns to outwit the Shades." />
  <title>Shiftwick - Bot Built Arcade</title>
  <link rel="icon" type="image/png" href="../images/botbuiltarcade-icon-face.png" />
  <link rel="stylesheet" href="assets/css/game.css" />
</head>
<body>
  <canvas id="sw-canvas" aria-label="Shiftwick game view" role="img"></canvas>
  <div id="hud">
    <div class="stat"><span class="lbl">Score</span><span class="val" id="score">0</span></div>
    <div class="stat"><span class="lbl">Best</span><span class="val" id="best">0</span></div>
    <div class="stat"><span class="lbl">Level</span><span class="val" id="level">1</span></div>
    <div class="stat"><span class="lbl">Lives</span><span class="val" id="lives">♥♥♥</span></div>
    <div class="stat"><span class="lbl">Shift</span><div id="charges"></div></div>
  </div>
  <div id="toast" role="status"></div>
  <div id="touch"><button id="shiftbtn" type="button">SHIFT<small>tap, then swipe</small></button></div>
  <a id="back" href="../index.html">&larr; Back to Arcade</a>
  <button id="mute" type="button">Sound</button>
  <div id="overlay"></div>
  <noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#f6e9d0">Shiftwick needs JavaScript. <a href="../index.html">Back to Arcade</a></p></noscript>
  <script src="assets/js/logic.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/audio.js"></script>
  <script src="assets/js/game.js"></script>
</body>
</html>
