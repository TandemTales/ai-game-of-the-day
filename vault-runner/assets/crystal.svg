<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Collectible crystal -->
  <defs>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGrad">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Glow -->
  <circle cx="12" cy="12" r="10" fill="url(#glowGrad)" opacity="0.6"/>
  
  <!-- Crystal facets -->
  <path d="M 12 2 L 18 12 L 12 22 L 6 12 Z" fill="url(#crystalGrad)" stroke="#6B21A8" stroke-width="1"/>
  <path d="M 12 2 L 18 12 L 12 12 Z" fill="#FFFFFF" opacity="0.3"/>
  <path d="M 12 12 L 6 12 L 12 22 Z" fill="#000000" opacity="0.2"/>
  
  <!-- Highlight -->
  <circle cx="10" cy="8" r="2" fill="#FFFFFF" opacity="0.6"/>
</svg>
