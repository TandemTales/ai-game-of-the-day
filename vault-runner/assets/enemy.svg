<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Guardian enemy -->
  <defs>
    <linearGradient id="enemyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991B1B;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="eyeGlow">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <!-- Body -->
  <rect x="8" y="12" width="16" height="16" rx="2" fill="url(#enemyGrad)" stroke="#7F1D1D" stroke-width="1"/>
  
  <!-- Head -->
  <circle cx="16" cy="10" r="6" fill="url(#enemyGrad)" stroke="#7F1D1D" stroke-width="1"/>
  
  <!-- Eyes -->
  <circle cx="13" cy="9" r="2.5" fill="url(#eyeGlow)"/>
  <circle cx="19" cy="9" r="2.5" fill="url(#eyeGlow)"/>
  <circle cx="13" cy="9" r="1" fill="#DC2626"/>
  <circle cx="19" cy="9" r="1" fill="#DC2626"/>
  
  <!-- Arms -->
  <rect x="5" y="16" width="4" height="8" rx="2" fill="url(#enemyGrad)" stroke="#7F1D1D" stroke-width="0.5"/>
  <rect x="23" y="16" width="4" height="8" rx="2" fill="url(#enemyGrad)" stroke="#7F1D1D" stroke-width="0.5"/>
  
  <!-- Legs -->
  <rect x="10" y="26" width="4" height="5" rx="1" fill="url(#enemyGrad)" stroke="#7F1D1D" stroke-width="0.5"/>
  <rect x="18" y="26" width="4" height="5" rx="1" fill="url(#enemyGrad)" stroke="#7F1D1D" stroke-width="0.5"/>
</svg>
