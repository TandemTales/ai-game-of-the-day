<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Grappling hook pickup -->
  <defs>
    <linearGradient id="hookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rope/chain -->
  <line x1="12" y1="2" x2="12" y2="12" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="2,1"/>
  
  <!-- Hook -->
  <path d="M 12 12 Q 18 12 18 18 Q 18 20 16 20 L 14 18" 
        fill="none" stroke="url(#hookGrad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Hook point -->
  <circle cx="14" cy="18" r="2" fill="url(#hookGrad)" stroke="#047857" stroke-width="1"/>
  
  <!-- Glow effect -->
  <circle cx="12" cy="12" r="8" fill="#10B981" opacity="0.2"/>
</svg>
