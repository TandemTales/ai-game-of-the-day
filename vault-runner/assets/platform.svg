<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 16">
  <!-- Stone platform tile -->
  <defs>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6B7280;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main platform -->
  <rect x="0" y="0" width="64" height="16" fill="url(#stoneGrad)" stroke="#1F2937" stroke-width="1"/>
  
  <!-- Stone texture details -->
  <rect x="4" y="3" width="8" height="2" fill="#4B5563" opacity="0.5"/>
  <rect x="20" y="6" width="12" height="2" fill="#4B5563" opacity="0.4"/>
  <rect x="40" y="4" width="10" height="2" fill="#4B5563" opacity="0.5"/>
  <rect x="56" y="8" width="6" height="2" fill="#4B5563" opacity="0.4"/>
  
  <!-- Top highlight -->
  <rect x="0" y="0" width="64" height="2" fill="#9CA3AF" opacity="0.3"/>
</svg>
