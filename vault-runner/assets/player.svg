<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Player character - agile vault runner -->
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C7A7B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Body -->
  <ellipse cx="16" cy="20" rx="6" ry="8" fill="url(#bodyGrad)" stroke="#1A5F5F" stroke-width="1"/>
  
  <!-- Head -->
  <circle cx="16" cy="10" r="5" fill="url(#bodyGrad)" stroke="#1A5F5F" stroke-width="1"/>
  
  <!-- Visor/Eyes -->
  <rect x="12" y="9" width="8" height="3" rx="1.5" fill="url(#accentGrad)" opacity="0.9"/>
  
  <!-- Arms -->
  <line x1="11" y1="18" x2="8" y2="22" stroke="url(#bodyGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="21" y1="18" x2="24" y2="22" stroke="url(#bodyGrad)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Legs -->
  <line x1="14" y1="27" x2="12" y2="31" stroke="url(#bodyGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="27" x2="20" y2="31" stroke="url(#bodyGrad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Accent details -->
  <circle cx="16" cy="20" r="2" fill="url(#accentGrad)" opacity="0.7"/>
</svg>
