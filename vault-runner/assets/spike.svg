<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 16">
  <!-- Spike trap -->
  <defs>
    <linearGradient id="spikeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7F1D1D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Base -->
  <rect x="0" y="12" width="32" height="4" fill="#374151"/>
  
  <!-- Spikes -->
  <polygon points="2,12 6,2 10,12" fill="url(#spikeGrad)" stroke="#991B1B" stroke-width="0.5"/>
  <polygon points="11,12 16,0 21,12" fill="url(#spikeGrad)" stroke="#991B1B" stroke-width="0.5"/>
  <polygon points="22,12 26,2 30,12" fill="url(#spikeGrad)" stroke="#991B1B" stroke-width="0.5"/>
  
  <!-- Highlights -->
  <line x1="16" y1="0" x2="16" y2="8" stroke="#FCA5A5" stroke-width="1" opacity="0.4"/>
</svg>
